
<div aw-class="['sw-row','aw-pma-updateSummaryTile',
{'aw-pma-actionableTile':subPanelContext.updateSummary.isActionable ==='true'},
{'aw-pma-nonactionableTile':subPanelContext.updateSummary.isActionable ==='false'},
{'aw-pma-updateSummaryTileSelected': conditions.isTileSelected}]" tabindex="0">
    <!-- tile details start-->
    <div class="sw-column w-12">
        <!-- tile header -->
        <div class="sw-row">
            <span aw-class="[{'aw-pma-actionableTileHeader':subPanelContext.updateSummary.isActionable ==='true'},{'aw-pma-nonactionableTileHeader':subPanelContext.updateSummary.isActionable ==='false'}]">{{subPanelContext.updateSummary.selectedUpdateAction.displayValue}}</span>
        </div>
        <div class="sw-row ">
             <!-- source object cell -->
                 <div class="sw-column justify-center w-6" enable-when = "!conditions.isTileSelected && subPanelContext.updateSummary.srcItems.length > 1" visible-when="!conditions.isTileSelected && subPanelContext.updateSummary.srcItems.length > 1">
                    <a>
                        <aw-i18n class = "aw-pma-flexible-item-title" visible-when="subPanelContext.swapRequired === false">{{subPanelContext.updateSummary.srcItems.length}} {{i18n.Pma1Designs}}</aw-i18n>
                        <aw-i18n class = "aw-pma-flexible-item-title" visible-when="subPanelContext.swapRequired === true">{{subPanelContext.updateSummary.srcItems.length}} {{i18n.Pma1Parts}}</aw-i18n>
                    </a>
                </div>
                <div class="sw-column justify-center w-6" visible-when="conditions.isTileSelected || subPanelContext.updateSummary.srcItems.length === 1" >
                    <div  aw-repeat="srcItem:subPanelContext.updateSummary.srcItems">
                        <pma-update-summary-cell sub-panel-context="{...subPanelContext,
                            propertyInfos:subPanelContext.updateSummary.sourcePropertyInfos,
                            itemVMO:srcItem,
                            nameRevisionInfo:subPanelContext.updateSummary.nameRevisionInfo?subPanelContext.updateSummary.nameRevisionInfo[srcItem.uid].source:null}">
                        </pma-update-summary-cell>
                    </div>
                </div>
            <div class='sw-column sw-row aw-pma-updateSummaryHeaderContent align-arrow-center justify-center w-3'>
                <aw-icon class='aw-visual-indicator aw-pma-updateSummaryHeaderIcon' icon-id='cmdRightArrow'></aw-icon>
            </div>
            <!-- target object cell -->
            <div class="sw-column justify-center w-6">
                <pma-update-summary-cell sub-panel-context="{...subPanelContext,
                    propertyInfos:subPanelContext.updateSummary.targetPropertyInfos,
                    itemVMO:subPanelContext.updateSummary.trgItem,
                    nameRevisionInfo:subPanelContext.updateSummary.nameRevisionInfo?subPanelContext.updateSummary.nameRevisionInfo[subPanelContext.updateSummary.trgItem.uid].target:null}">
                </pma-update-summary-cell>
            </div>
        </div>

        <!-- tile details end-->
        <div aw-class="['sw-row flex-auto  align-self-right, justify-right ',{'aw-pma-singleUpdateAction' : subPanelContext.updateSummary.isActionable ==='false'}]">
            <div class="sw-column w-5">
                <aw-radiobutton prop="data.tileRadioButton[0]" list="subPanelContext.updateSummary.updateActionValues.dbValue" action="loadUpdateSummaryChips" exist-when="subPanelContext.updateSummary.isActionable ==='true'" class="aw-pma-updateActionControl"  tabindex="0"></aw-radiobutton>
            </div>
        </div>
    </div>
</div>
