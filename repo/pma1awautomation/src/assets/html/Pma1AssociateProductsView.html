<aw-command-panel caption="i18n.addElementBtn" anchor="" context="subPanelContext">
    <aw-form name="createInputs">
        <aw-add include-types="Item" type-filter="Item,ItemRevision"
        preferred-type="Item" is-include-sub-types="true" load-sub-types="true"
        auto-select-on-unique-type="true" visible-tabs="palette,search"
        max-recent-count="5" add-panel-state="fields.addPanelState">
        </aw-add>
    </aw-form>
    <aw-panel-footer>
        <aw-button action="addSelectedObjects" visible-when="conditions.isAddButtonVisibleInPaletteTab || conditions.isAddButtonVisibleInSearchTab">
            <aw-i18n>i18n.addElementBtn</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-command-panel>
