<aw-popup-panel2 class="aw-pma-popupScreenMask">
    <aw-panel-body>
        <div class="sw-section">
            <aw-label class="aw-pma-generateBOMPopupLabel" prop="data.generateDBOMconfirmationMessage" exist-when="conditions.isSourcePart"></aw-label>
            <aw-label class="aw-pma-generateBOMPopupLabel" prop="data.generateEBOMconfirmationMessage" exist-when="conditions.isSourceDesign"></aw-label>
        </div>
        <div class="sw-section aw-pma-generateBOMPopupSection">
            <aw-checkbox prop="data.runInBackground"></aw-checkbox>
            <div class="sw-button-group sw-row aw-pma-generateBomPopupBtn">
                <aw-button class='small' button-type="base" action="hidePopup" enable-when="conditions.isGenerateBOMEnabled" size="auto">{{i18n.cancel}}</aw-button>
                <aw-button class='small' action="evaluateActionForBOMGeneration" enable-when="conditions.isGenerateBOMEnabled" size="auto">{{i18n.generate}}</aw-button>
            </div>
        </div>
    </aw-panel-body>
</aw-popup-panel2>
