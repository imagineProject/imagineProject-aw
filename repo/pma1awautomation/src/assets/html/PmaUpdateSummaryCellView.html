<div aw-class="['sw-column','aw-pma-updateSummaryTileInfo','aw-widgets-cellListCellContent']">
    <div class = "aw-widgets-cellListCellContent aw-pma-propertyObjectString" >
        <!-- Element Name-->
        <div class="sw-row" >
            <label title="{{subPanelContext.itemVMO.cellHeader1}}" class = "aw-pma-propertyObjectString" exist-when="!subPanelContext.nameRevisionInfo.newName && !subPanelContext.nameRevisionInfo.oldName">
                {{subPanelContext.itemVMO.cellHeader1}}
            </label >
            <span title="{{subPanelContext.nameRevisionInfo.newName}}" class = "sw-property-val aw-jswidgets-change aw-pma-propertyNewName aw-pma-propertyObjectString"
                    exist-when="(subPanelContext.nameRevisionInfo.newName || subPanelContext.nameRevisionInfo.oldName) && !subPanelContext.nameRevisionInfo.oldName"> {{subPanelContext.nameRevisionInfo.newName}}</span>
            <span title="{{subPanelContext.nameRevisionInfo.newName}}" class = "sw-property-val aw-pma-propertyObjectString aw-pma-propertyNewName"
                    exist-when="(subPanelContext.nameRevisionInfo.newName || subPanelContext.nameRevisionInfo.oldName) && subPanelContext.nameRevisionInfo.oldName"> {{subPanelContext.nameRevisionInfo.newName}}</span>
            <span title="{{subPanelContext.nameRevisionInfo.oldName}}" class = "aw-jswidgets-oldText aw-pma-propertyObjectString"
                    exist-when="(subPanelContext.nameRevisionInfo.newName || subPanelContext.nameRevisionInfo.oldName) && subPanelContext.nameRevisionInfo.oldName"> {{subPanelContext.nameRevisionInfo.oldName}}</span >
        </div>

        <!-- Revision Name-->
        <div class="sw-row" exist-when="subPanelContext.itemVMO.cellHeader2
        && subPanelContext.itemVMO.cellProperties.Revision.value
        && !subPanelContext.nameRevisionInfo.newRevision">
            <label title="{{subPanelContext.itemVMO.cellHeader2}}/{{subPanelContext.itemVMO.cellProperties.Revision.value}}" class = "aw-pma-propertyObjectString">
                {{subPanelContext.itemVMO.cellHeader2}}/{{subPanelContext.itemVMO.cellProperties.Revision.value}}
            </label >
        </div>

        <div class="sw-row" exist-when="subPanelContext.nameRevisionInfo.newRevision || subPanelContext.nameRevisionInfo.oldRevision">
            <label title="{{subPanelContext.itemVMO.cellHeader2}}/{{subPanelContext.itemVMO.cellProperties.Revision.value}}" class = "aw-pma-propertyObjectString">
                <div class = "propertyLabelTopContainer" >
                    <span class = "sw-property-val"> {{subPanelContext.itemVMO.cellHeader2}}/ </span>
                    <span class = "sw-property-val"> {{subPanelContext.nameRevisionInfo.newRevision}} &nbsp;</span>
                    <span class = "aw-jswidgets-oldText"> {{subPanelContext.nameRevisionInfo.oldRevision}}  </span >
                </div>
            </label >
        </div>
    </div>

    <!-- Properties Change-->
     <label class = "sw-property sw-component aw-pma-propertyName sw-readOnly w-2" aw-repeat="propertyInfo:subPanelContext.propertyInfos">
        <div class = "propertyLabelTopContainer quantityChangeLabel" >
            <span class = "sw-property-name aw-pma-propertyName" > {{propertyInfo.propDisplayName}} </span>
            <span class = "sw-property-val aw-jswidgets-change" > {{propertyInfo.currentDBValue}} </span>
            <span class = "aw-jswidgets-oldText" > {{propertyInfo.oldDBValue}}  </span >
        </div >
    </label >
</div>
