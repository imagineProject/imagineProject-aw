<div show-when="conditions.createPartRadioButtonVisibility">
    <!--Label : Part-->

    <div class="sw-row aw-pma-createPartLabel">
        <div class="aw-pma-createPartTitle">{{i18n.partCreationlabel}} :</div>
        <div class="pma-infoIcon">
            <aw-icon size="xxsmall" icon-id="cmdInfo16" extended-tooltip="PmaCreatePartInfoTooltip"></aw-icon>
        </div>
    </div>

    <!-- Radio buttons : Auto-Create, Assign Part ID, Add Part, Defer for later-->
    <aw-radiobutton class="aw-pma-radioButton" prop="data.createPartOption" list="data.createPartOptionValues.dbValue" ></aw-radiobutton>
    <!-- Show message if user selects Auto-create part option -->
    <div>
        <aw-label class="aw-pma-autoCreatePartMessage" prop='data.autoCreatePartMessage' exist-when="data.createPartOption.dbValue === 'autoCreate'"></aw-label>
    </div>

    <!-- Show text box if user selects Assign Part ID option-->
    <aw-textbox class="aw-pma-assignPartIdTextBox" prop="data.pmaAssignPartIdTextBox" exist-when="data.createPartOption.dbValue === 'assignPartId'" ></aw-textbox>

    <pma-set-associate-part sub-panel-context="{...props.subPanelContext, associatePartNumber:data.pmaAssignPartIdTextBox.dbValue}" exist-when="data.createPartOption.dbValue === 'assignPartId'"></pma-set-associate-part>

    <pma-set-auto-create-part sub-panel-context="{...props}" exist-when="data.createPartOption.dbValue === 'autoCreate'"></pma-set-auto-create-part>

    <!-- Show section to add part if user selects Add Part option-->
    <pma-align-part-custom-panel sub-panel-context="{...props.subPanelContext}" exist-when="data.createPartOption.dbValue === 'addPart'" ></pma-align-part-custom-panel>

    <pma-set-defer-for-later sub-panel-context="{...props.subPanelContext}" exist-when="data.createPartOption.dbValue === 'deferForLater'"></pma-set-defer-for-later>
</div>
