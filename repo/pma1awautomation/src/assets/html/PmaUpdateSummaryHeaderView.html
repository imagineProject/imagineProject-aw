<div class='sw-column aw-pma-updateHeaderTile'>
    <div aw-click="actions.tileSelected" aw-class="['sw-row aw-pma-updateSummaryHeader','aw-pma-updateSummaryTile',{'aw-pma-updateSummaryTileSelected':props.subPanelContext.updateSummaryState.headerSummary.selected===true}]">
        <div class='sw-column w-12'>
            <div class='sw-row'>
                <div class='sw-column sw-row aw-pma-updateSummaryHeaderContent align-center w-4'>
                    <div class="aw-pma-updateHeaderTileText">
                        <aw-i18n  exist-when="props.subPanelContext.swapRequired === false" class='aw-pma-updateSummaryHeaderText'>i18n.DBOM</aw-i18n>
                        <aw-i18n  exist-when="props.subPanelContext.swapRequired === true" class='aw-pma-updateSummaryHeaderText'>i18n.EBOM</aw-i18n>
                        {props.subPanelContext.updateSummaryState.headerSummary.srcContext}
                    </div>
                </div>
                <div class='sw-column sw-row aw-pma-updateSummaryHeaderContent align-center justify-center w-4'>
                    <aw-icon class='aw-visual-indicator aw-pma-updateSummaryHeaderIcon' icon-id='cmdRightArrow'></aw-icon>
                </div>
                <div class='sw-column sw-row aw-pma-updateSummaryHeaderContent align-center w-4'>
                    <div class="aw-pma-updateHeaderTileText">
                        <aw-i18n  exist-when="props.subPanelContext.swapRequired === true" class='aw-pma-updateSummaryHeaderText'>i18n.DBOM</aw-i18n>
                        <aw-i18n  exist-when="props.subPanelContext.swapRequired === false" class='aw-pma-updateSummaryHeaderText'>i18n.EBOM</aw-i18n>
                        {props.subPanelContext.updateSummaryState.headerSummary.trgContext}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
