<div exist-when="conditions.isCreatePanel">
    <div class="sw-row aw-pma-alignedPartSection">
        <aw-label class="aw-pma-alignedPartTitle" prop="data.alignedPartLabel"></aw-label>
        <aw-command-bar class="sw-column aw-pma-add-part-button" visible-when="conditions.isCreatePanel" enable-when="conditions.isAlignPartCustomPanelVisible" anchor="aw_addAlignPart" alignment="HORIZONTAL" context="{...subPanelContext.activeState,primaryXrtTypeLoaded:props.subPanelContext.xrtState.xrtTypeLoaded.type}"></aw-command-bar>
    </div>

    <div>
        <aw-label class="aw-pma-noPartAvailableMessage" prop='data.noPartAvailableMessage'
        exist-when="data.dataProviders.getPartRevisionDataProvider.viewModelCollection.loadedVMObjects.length === 0"></aw-label>

        <aw-list exist-when="conditions.isAlignPartCustomPanelVisible && data.dataProviders.getPartRevisionDataProvider.viewModelCollection.loadedVMObjects.length>0" command-context="data.dataProviders.getPartRevisionDataProvider" dataprovider="data.dataProviders.getPartRevisionDataProvider" has-floating-cell-commands=false>
            <aw-default-cell vmo="item"></aw-default-cell>
        </aw-list>
    </div>
</div>

<div exist-when="conditions.isRevisePanel">
    <aw-command-bar visible-when="conditions.isRevisePanel" enable-when="conditions.isAlignPartCustomPanelVisible" anchor="aw_addAlignPart" alignment="HORIZONTAL" context="{...subPanelContext.activeState,primaryXrtTypeLoaded:props.subPanelContext.xrtState.xrtTypeLoaded.type}"></aw-command-bar>
    <aw-list exist-when="conditions.isAlignPartCustomPanelVisible && data.dataProviders.getPartRevisionDataProvider.viewModelCollection.loadedVMObjects.length>0" command-context="data.dataProviders.getPartRevisionDataProvider" dataprovider="data.dataProviders.getPartRevisionDataProvider" has-floating-cell-commands=false>
        <aw-default-cell vmo="item"></aw-default-cell>
    </aw-list>
</div>
<aw-i18n exist-when="conditions.isAddPartWarningMessageVisible" class="aw-cba-italicText">i18n.addPartInfoMessage</aw-i18n>
<div exist-when="data.isPartRequired">
    <pma-set-parts-to-align-input-panel exist-when="props.subPanelContext.xrtType === 'CREATE'" sub-panel-context="{...props, isPartRequired:props.subPanelContext.xrtState.xrtVMO.props[data.isPartRequired],createAlignedPart:props.subPanelContext.xrtState.xrtVMO.props[data.createAlignedPart],dataProvider:data.dataProviders.getPartRevisionDataProvider}"></pma-set-parts-to-align-input-panel>
</div>
<pma-set-parts-to-align-input-for-revise-panel exist-when="props.subPanelContext.xrtType === 'REVISE' && props.subPanelContext.xrtState.xrtVMO" sub-panel-context="{...props,dataProvider:data.dataProviders.getPartRevisionDataProvider}"></pma-set-parts-to-align-input-for-revise-panel>
