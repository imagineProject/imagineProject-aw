<div exist-when="conditions.isAlignDesignCustomPanelExists">
    <aw-command-bar visible-when="conditions.isAlignDesignCustomPanelExists" enable-when="conditions.isAlignDesignCustomPanelVisible" anchor="aw_addAlignDesign" alignment="HORIZONTAL" context="{...subPanelContext.activeState,primaryXrtTypeLoaded:props.subPanelContext.xrtState.xrtTypeLoaded.type}"></aw-command-bar>
    <aw-list exist-when="conditions.isAlignDesignCustomPanelVisible && data.dataProviders.getDesignRevisionDataProvider.viewModelCollection.loadedVMObjects.length>0" command-context="data.dataProviders.getDesignRevisionDataProvider" dataprovider="data.dataProviders.getDesignRevisionDataProvider" has-floating-cell-commands=false>
        <aw-default-cell vmo="item"></aw-default-cell>
    </aw-list>
</div>
<aw-i18n class="aw-cba-italicText" exist-when="conditions.isAddDesignWarningMessageVisible">i18n.addDesignInfoMessage</aw-i18n>
<div exist-when="data.isDesignRequired">
    <pma-set-designs-to-align-input-panel sub-panel-context="{...props,isDesignRequired:props.subPanelContext.xrtState.xrtVMO.props[data.isDesignRequired],createAlignedDesign:props.subPanelContext.xrtState.xrtVMO.props[data.createAlignedDesign],dataProvider:data.dataProviders.getDesignRevisionDataProvider}"></pma-set-designs-to-align-input-panel>
</div>
