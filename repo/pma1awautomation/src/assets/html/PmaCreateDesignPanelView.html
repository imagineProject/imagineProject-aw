<aw-panel-body>
    <aw-radiobutton prop="data.createOrUseExisting"></aw-radiobutton>
    <div class="sw-column" exist-when="data.createOrUseExisting.dbValue===true">
        <aw-panel-header>
            <aw-panel-section caption="i18n.objectType">
                <aw-type-selector exist-when="data.primaryXrtTypeLoaded"
                    prop="data.typeListProp"
                    include="{{data.allowedTypeInfo.includeTypes}}"
                    load-sub-types="false"
                    type-filter="{{data.allowedTypeInfo.searchTypeName}}"
                    preferred-type="{{data.primaryXrtTypeLoaded}}"
                    auto-select-on-unique-type="true"
                    max-recent-count="5"
                    selection-data="data.typeListSelectionData"
                    auto-open-on-mount="false">
                </aw-type-selector>
            </aw-panel-section>
        </aw-panel-header>
        <aw-panel-body exist-when="data.primaryXrtTypeLoaded && data.xrtData">
                <aw-xrt-2 
                object-type="{{data.primaryXrtTypeLoaded}}"
                type="CREATE"
                xrt-data="data.xrtData"
                xrt-state="data.xrtState">
            </aw-xrt-2>
        </aw-panel-body>
    </div>
    <div class="sw-column" exist-when="data.createOrUseExisting.dbValue===false">
        <aw-add
            type-filter="{{data.allowedTypeInfo.searchTypeName}}"
            visible-tabs="palette,search"
            max-recent-count="5"
            add-panel-state="fields.addPanelState"
            exist-when="data.allowedTypeInfo""
            sub-panel-context="{ selectionMode: subPanelContext.selectionMode}">
        </aw-add>
    </div>
    <aw-panel-footer>
        <aw-button action="createAndAddObject" size="auto" visible-when="data.createOrUseExisting.dbValue === true"  enable-when="data.createOrUseExisting.dbValue === true && formProp.attributes.valid">
            <aw-i18n>i18n.add</aw-i18n>
        </aw-button>
        <aw-button action="addExistingRevision" size="auto" visible-when="data.createOrUseExisting.dbValue === false && conditions.isAddExistingButtonVisible">
            <aw-i18n>i18n.add</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel-body>
