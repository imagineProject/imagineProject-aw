<div class="sw-column justify-center aw-pma-ecnIndicator">
    <div class="sw-row w-12 h-12">
        <aw-separator exist-when="ctx.taskbarfullscreen && ctx.taskbarfullscreen === 'true'" is-vertical="true"></aw-separator>
        <div class="sw-row">
            <div class="sw-column aw-pma-space-before-ecnIndicator" exist-when="!(ctx.taskbarfullscreen && ctx.taskbarfullscreen === 'true')"></div>
            <div class="sw-column justify-center w-12">
                <div class="sw-row aw-pma-ecnIndicatorInCbaSection" exist-when="subPanelContext.ECNForImpactAnalysis !== null" extended-tooltip="PmaActiveEcnTooltip" extended-tooltip-options="{'placement' : 'bottom'}" extended-tooltip-context="subPanelContext.ECNForImpactAnalysis">
                    <div class="sw-column justify-center">
                        <aw-icon class="aw-pma-indicatorChipTrackingIcon" icon-id="indicatorChipTrackingChanges"></aw-icon>
                    </div>
                    <div class="sw-column justify-center aw-pma-ecnIndicatorText">
                        <span class="aw-widgets-checkSelectPanel">{{subPanelContext.ECNForImpactAnalysis.props.object_string.uiValues[ 0 ]}}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
