<div class="aw-base-scrollPanel" exist-when="data.totalFound === 0">
    <aw-empty-workarea
        image="graEmptyGeneric128"
        title="i18n.noNewsFeed"
        hint="i18n.noNewsFeedHint">
    </aw-empty-workarea>
</div>
    <aw-scrollpanel exist-when="data.totalFound>0">
    <aw-list dataprovider="data.dataProviders.imageDataProvider">
        <aw-default-cell vmo="item" aw-class="[{'aw-subscription-unReadCellTitle': item.props.fnd0MessageReadFlag.dbValue===false}]"></aw-default-cell>
    </aw-list>
    <aw-dialog action="newsFeedFilterPanelOpenCloseEvent" sub-panel-context= "{...subPanelContext}"></aw-dialog>
</aw-scrollpanel>
