<aw-server-visibility-toolbar first-anchor="aw_altPWADisplay,aw_3dViewer,aw_2dViewer" second-anchor="aw_toolbarRight,aw_fullScreen,aw_viewerRightSide" orientation="HORIZONTAL" context="{viewerContextData : data.svInstance.viewerCtxData, viewerAtomicData:props.viewerStateProp.value, occmgmtContext: props.subPanelContext.context.occContext, fullScreenState : subPanelContext.fullScreenState, popupAction: subPanelContext.dialogAction, ...subPanelContext, rightPanelDialogAction: actions.rightPanelDialog }"></aw-server-visibility-toolbar>
<div class="aw-threeDViewer-viewer3DParentContainer sw-column w-12">
    <div>
        <aw-layout-slot name="markupPVWToolbar" context="props.viewerStateProp"></aw-layout-slot>
    </div>
    <div exist-when="conditions.display3dOnScreenMarkupToolbar && !conditions.displayImageCapture && !conditions.isCSR" class="aw-viewer-viewerMarkupContainer sw-row">
        <aw-toolbar class="aw-viewer-viewer3DSubCommandToolbar" first-anchor="aw_3dMarkupViewer" second-anchor="aw_3dMarkupRight" orientation="HORIZONTAL" context="{viewerContextData : data.svInstance.viewerCtxData, viewerAtomicData:props.viewerStateProp.value, ...subPanelContext}"></aw-toolbar>
    </div>
    <div exist-when="conditions.displaySubCommandToolbar" class="aw-viewer-viewer3DContainer sw-row">
        <aw-server-visibility-toolbar class="aw-viewer-viewer3DSubCommandToolbar" first-anchor="aw_3dViewerSubCommandsFirstAnchor" second-anchor="aw_3dViewerSubCommandsSecondAnchor" orientation="HORIZONTAL" context="{viewerContextData : data.svInstance.viewerCtxData, viewerAtomicData:props.viewerStateProp.value}" mselected="ctx.mselected" pselected="ctx.pselected"></aw-server-visibility-toolbar>
    </div>
    <div class="sw-row">
        <div class="aw-viewer-viewer3DContainer">
            <div exist-when="conditions.displayExplodedViewSubCommandToolbar" class="sw-row">
            <awv0-explode-view-component sub-panel-context="{viewerContextData: data.svInstance.viewerCtxData, viewerAtomicData:props.viewerStateProp.value}">
            </awv0-explode-view-component>
            </div>
            <div class="sw-row" exist-when="conditions.displayVolumeSelectViewSubCommandToolbar">
                <aw-layout-slot name="viewerSubCommandToolbar"  context="{viewerAtomicData:props.viewerStateProp, ...subPanelContext, viewerContextData : data.svInstance.viewerCtxData}"></aw-layout-slot>
            </div>
        </div>
      
    </div>
    <div visible-when="conditions.loadingViewer && !conditions.viewerLoadbarVisible && conditions.disableRenderingWhileLoading" class="aw-threeDViewer-viewer3DChildContainer sw-row">
        <aw-i18n class="aw-threeDViewer-topMessage">i18n.LoadingViewer</aw-i18n>
    </div>
    <div visible-when="conditions.loadingViewer && conditions.disableRenderingWhileLoading" class="aw-threeDViewer-viewer3DChildContainer sw-row">
        <aw-image source="data.thumbnailImage"></aw-image>
    </div>
    <div id="imageCaptureContainer" visible-when="conditions.displayImageCapture" class="aw-threeDViewer-viewer3DChildContainer aw-threeDViewer-imageCaptureContainer sw-row">
    </div>
    <div id="awStructureViewer" class="aw-threeDViewer-viewer3DChildContainer sw-row aw-viewer-pvwPartHoverTooltip" aw-class="[{'aw-viewer-hideThreeDViewer': conditions.displayImageCapture}]">
        <awv0-structure-viewer-component view-container-prop="data.viewContainerProp"></awv0-structure-viewer-component>
        <span id="awViewerTooltipSpan" class="sw-popup afx-content-background">
            {{data.prehighlightedPartName.dispValue}}
        </span>
    </div>
    <div visible-when="conditions.showViewerProgress" class="aw-threeDViewer-loadProgressContainer sw-row">
        <div class="aw-viewer-loadProgressPerformant aw-threeDViewer-loadProgress"></div>
    </div>
    <div visible-when="conditions.showViewerEmmProgress" class="aw-threeDViewer-emmLoadProgressContainer sw-row">
        <div class="aw-viewer-emmLoadProgress aw-threeDViewer-emmLoadProgress"></div>
    </div>
    <div id="awViewerLoadbar" visible-when="conditions.viewerLoadbarVisible" class="aw-threeDViewer-loadbarContainer" aw-class="[{'aw-threeDViewer-loadbarContainerPadded': conditions.viewerAnyToolbarIsDisplayed}]">
        <awv0-viewer-load-dialog viewerStateProp="{{props.viewerStateProp}}" viewerCtxData="{{data.svInstance.viewerCtxData}}"></awv0-viewer-load-dialog>
    </div>
    <div exist-when="conditions.viewerLoaded && !conditions.loadingViewer && conditions.isCSR && conditions.hasViewerCtxDataDefined">
        <awv0-context-menu sub-panel-context="{viewerAtomicData:props.viewerStateProp.value,...subPanelContext,dialogAction: actions.rightPanelDialog,viewerContextData:data.svInstance.viewerCtxData}"></awv0-context-menu>
    </div>
    <div class="aw-threeDViewer-visualReportLegend" exist-when="conditions.viewerLoaded && !conditions.loadingViewer && conditions.isCSR && conditions.hasViewerCtxDataDefined && conditions.isVisualReportLegendEnabled">
        <awv0-visual-report-legend sub-panel-context="{viewerContextData:data.svInstance.viewerCtxData}"></awv0-visual-report-legend>
    </div>
    <aw-dialog action="rightPanelDialog"></aw-dialog>
    <aw-layout-slot name="clearanceSummaryView" context="{viewerAtomicData:props.viewerStateProp, ...subPanelContext}"></aw-layout-slot>
</div>
<aw-layout-slot name="clearanceResultsPanel" context="{viewerAtomicData:props.viewerStateProp, ...subPanelContext, viewerContextData : data.svInstance.viewerCtxData}"></aw-layout-slot>
