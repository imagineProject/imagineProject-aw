<aw-panel class="pca0ruledatesub">
    <aw-panel-body>
        <aw-panel-section caption="i18n.options" collapsed="disabled">
            <aw-widget prop="data.ruleDateOptions"></aw-widget>
            <div class="sw-property sw-component" exist-when="data.ruleDateOptions.dbValue=='date'">
                <aw-datetime prop="data.ruleDateTimeDetails"></aw-datetime>
            </div>
        </aw-panel-section>
    </aw-panel-body>
</aw-panel>
<aw-panel-footer>
    <aw-button exist-when="conditions.enableSetButton" action="applyRuleDate">{{i18n.set}}</aw-button>
</aw-panel-footer>
