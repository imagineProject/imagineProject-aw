<aw-panel>
    <aw-panel-header>
        <p visible-when="data.resultsString.dbValue">{{data.resultsString.dbValue}}</p>
        <!--LCS-532075 - Why the star is so far away from the label (name label)?
we are temporarily replacing aw-label because of the look until the LCS-823870 — AwPropertyGrid component change is in place -->
        <!-- <aw-label prop="data.activeSearchResultPropLabel"></aw-label> -->
        <div class="aw-cfg-tempLabel sw-defaultCell-properties">
            <label class="sw-property-name">{{data.activeSearchResultPropLabel.propertyDisplayName}}</label>
            <label class="aw-widgets-propertyValue">{{data.activeSearchResultPropLabel.uiValue}}</label>
        </div>
    </aw-panel-header>
    <aw-panel-body class="sw-section">
        <aw-list dataprovider="data.dataProviders.getAllVariantRulesBasedOnSearchCriteria">
            <aw-default-cell item="item" vmo="item"></aw-default-cell>
        </aw-list>
    </aw-panel-body>
</aw-panel>
