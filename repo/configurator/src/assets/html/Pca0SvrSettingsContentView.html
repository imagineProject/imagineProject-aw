<aw-panel-body>
     <aw-panel-section caption="i18n.filterCriteria" context="data">
        <pca0-svr-filter-criteria-settings visible-when="conditions.isSettingsInit"
            sub-panel-context="{ ...props.subPanelContext, popupId: props.subPanelContext.popupOptions.popupId,
                selection: props.subPanelContext.selection && props.subPanelContext.selection[0],
                rootModuleHasChildren:props.subPanelContext.rootModuleHasChildren, isConfigurationReadOnly: props.subPanelContext.isConfigurationReadOnly === 'true' ? true : false, isRevRuleActionDefaultBehavior: true}">
        </pca0-svr-filter-criteria-settings>
    </aw-panel-section>
    <aw-panel-section caption="i18n.validationMode"
        exist-when="props.subPanelContext.svrSettings.value.settingsMO.solverProfilesLOV !== undefined">
        <div class="sw-section" exist-when ="!conditions.isConfigurationReadOnly">
            <aw-widget class="aw-cfg-fscSolverProfilesListBox" prop="data.profileProp" action="profileChanged"></aw-widget>
        </div>
        <div class="sw-section aw-cfg-readOnly" exist-when ="conditions.isConfigurationReadOnly">
            <!-- it has no action attached to it for now, add some if editable -->
            <aw-widget class="aw-cfg-fscSolverProfilesListBox" prop="data.profileProp"></aw-widget>
        </div>
        <div class="sw-section" exist-when ="!conditions.isConfigurationReadOnly">
            <aw-label class="aw-cfg-fscPropLabel" prop="data.validationSeverityLabel"></aw-label>
            <div aw-repeat="p : data.validationSeverityProperties" class="aw-cfg-fscValidationSeverityOption">
                <aw-checkbox prop="p" action="validationSeverityChanged"></aw-checkbox>
            </div>
        </div>
        <div class="sw-section aw-cfg-readOnly" exist-when ="conditions.isConfigurationReadOnly">
            <aw-label class="aw-cfg-fscPropLabel" prop="data.validationSeverityLabel"></aw-label>
            <div aw-repeat="p : data.validationSeverityProperties" class="aw-cfg-fscValidationSeverityOption">
                <aw-checkbox prop="p" action="validationSeverityChanged"></aw-checkbox>
            </div>
        </div>
        <div class="sw-section" exist-when ="!conditions.isConfigurationReadOnly">
            <aw-label class="aw-cfg-fscPropLabel" prop="data.expansionSeverityLabel"></aw-label>
            <div aw-repeat="p : data.expansionSeverityProperties" class="aw-cfg-fscExpansionSeverityOption">
                <aw-checkbox prop="p" action="expansionSeverityChanged"></aw-checkbox>
            </div>
        </div>
        <div class="sw-section aw-cfg-readOnly" exist-when ="conditions.isConfigurationReadOnly">
            <aw-label class="aw-cfg-fscPropLabel" prop="data.expansionSeverityLabel"></aw-label>
            <div aw-repeat="p : data.expansionSeverityProperties" class="aw-cfg-fscExpansionSeverityOption">
                <aw-checkbox prop="p" action="expansionSeverityChanged"></aw-checkbox>
            </div>
        </div>
        <div class="sw-section" exist-when ="!conditions.isConfigurationReadOnly">
            <aw-label class="aw-cfg-fscPropLabel" prop="data.selectionBehaviorLabel"></aw-label>
            <aw-checkbox prop="data.allowMultipleSelections"></aw-checkbox>
        </div>
        <div class="sw-section aw-cfg-readOnly" exist-when ="conditions.isConfigurationReadOnly">
            <aw-label class="aw-cfg-fscPropLabel" prop="data.selectionBehaviorLabel"></aw-label>
            <aw-checkbox prop="data.allowMultipleSelections"></aw-checkbox>
        </div>
        <div class="sw-section" exist-when ="!conditions.isConfigurationReadOnly">
            <aw-label class="aw-cfg-fscPropLabel" prop="data.contentConfigurationLabel"></aw-label>
            <aw-checkbox prop="data.applyConstraints"></aw-checkbox>
            <aw-checkbox prop="data.enableExplicitContentConfiguration"></aw-checkbox>
        </div>
        <div class="sw-section aw-cfg-readOnly" exist-when ="conditions.isConfigurationReadOnly">
            <aw-label class="aw-cfg-fscPropLabel" prop="data.contentConfigurationLabel"></aw-label>
            <aw-checkbox prop="data.applyConstraints"></aw-checkbox>
            <aw-checkbox prop="data.enableExplicitContentConfiguration"></aw-checkbox>
        </div>
        <div class="sw-section" exist-when ="!conditions.isConfigurationReadOnly">
            <aw-label class="aw-cfg-fscPropLabel" prop="data.expansionBehaviorLabel"></aw-label>
            <aw-checkbox prop="data.allowValidationRulesToExpand"></aw-checkbox>
        </div>
        <div class="sw-section aw-cfg-readOnly" exist-when ="conditions.isConfigurationReadOnly">
            <aw-label class="aw-cfg-fscPropLabel" prop="data.expansionBehaviorLabel"></aw-label>
            <aw-checkbox prop="data.allowValidationRulesToExpand"></aw-checkbox>
        </div>
    </aw-panel-section>
</aw-panel-body>

<aw-panel-footer class="aw-cfg-settingsFooter">
    <aw-button action="applySettingsBatch" enable-when="conditions.isApplyandSaveEnable">
        <aw-i18n>i18n.applySaveCmd</aw-i18n>
    </aw-button>
</aw-panel-footer>
