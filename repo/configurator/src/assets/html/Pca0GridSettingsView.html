<aw-command-panel name="Pca0GridSettingsPanel" caption="i18n.settings" context="subPanelContext">
    <aw-panel-body>
        <pca0-grid-column-header-section sub-panel-context= "{ ...props.subPanelContext }" gridSettingsDataForColumnHeader= "{{data.gridSettingsDataForColumnHeader}}"></pca0-grid-column-header-section>
        <!-- Include Severity In Comparison -->
        <aw-panel-section caption="i18n.dataViewRelatedSettings" anchor="pca0SeverityInfoAnchor" anchor-position="RIGHT" exist-when="conditions.isMultivariantsGrid" >
            <aw-checkbox prop="data.includeSeverityInComparison" ></aw-checkbox>
        </aw-panel-section>
        <!-- Constraints Specific div-->
        <div exist-when="conditions.isConstraintsGrid">
            <aw-panel-section caption="i18n.sectionTitle">
                <aw-label prop="data.resizeTopSectionHeightLabel"></aw-label>
                <!-- To change the height between top and bottom table-->
                <aw-slider prop="data.headerHeight"></aw-slider>
                <!-- Toggle to flip Show Subject In Top Grid (sections is available only for Grid Editor view)-->
                <aw-togglebutton prop="data.showSubjectInTopGrid" exist-when="conditions.isGridEditor"></aw-togglebutton>
            </aw-panel-section>
            <!-- Show Properties Information for constraints In Grid Toggle -->
            <aw-panel-section caption="i18n.properties">
                <aw-togglebutton prop="data.showPropsInfoInGrid"></aw-togglebutton>
            </aw-panel-section>
            <!-- To work with All Variability/Features In Grid Editor Toggle -->
            <aw-panel-section caption="i18n.variabilityContent">
                <aw-togglebutton prop="data.useAllVariabilityInGridEditor"></aw-togglebutton>
            </aw-panel-section>
            <!-- Toggle to show/hide legend for Feature Dispositions LOVs is visible for SnO matrix view only-->
            <aw-panel-section caption="i18n.legend" exist-when="conditions.isSnOMatrix">
                <aw-togglebutton prop="data.showLegend"></aw-togglebutton>
            </aw-panel-section>
        </div>
    </aw-panel-body>
    <aw-panel-footer class=" aw-cfg-settingsFooter">
        <aw-button action="applyGridSettings" enable-when="conditions.settingsChanged">
            <aw-i18n>i18n.applyCmd</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-command-panel>
