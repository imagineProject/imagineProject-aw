<aw-panel-body>
    <aw-panel-section caption="i18n.reuseFromSectionTitle">
        <div class="sw-row">
            <div class="sw-column w-3">
                <aw-listbox prop="data.searchTypeList" list="data.searchTypeListValues.dbValue"></aw-listbox>
            </div>
            <div class="sw-column aw-cfg-advancedReuseSearchField w-9">
                <aw-search-box prop="data.searchBox" placeholder="i18n.advancedReuseSearchPlaceHolder" action="searchAction"></aw-search-box>
            </div>
        </div>
        <aw-flex-row height="50f" exist-when="conditions.isSearchPerformed">
            <aw-splm-table gridid="contextSearchResultGrid" exist-when="conditions.isSearchResultFound"></aw-splm-table>
            <aw-empty-workarea
                image='graNoSearchResult'
                title='i18n.noResultFound'
                hint='i18n.noResultFoundHint'
                exist-when="!conditions.isSearchResultFound">
            </aw-empty-workarea>
        </aw-flex-row>
    </aw-panel-section>
    <div class="sw-row" exist-when="!conditions.isSearchPerformed">
        <aw-panel-section caption="i18n.recentSectionTitle">
            <aw-list dataprovider="data.dataProviders.recentContextHistoryDataProvider" exist-when="conditions.isRecentContextHistoryFound">
                <aw-default-cell vmo="item"></aw-default-cell>
            </aw-list>
            <aw-label prop="data.noRecentContextFoundLabel" exist-when="!conditions.isRecentContextHistoryFound" ></aw-label>
        </aw-panel-section>
    </div>
</aw-panel-body>
