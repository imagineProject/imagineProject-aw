<aw-panel name="Pca0AdvancedReusePanel" context="subPanelContext">
    <div class="aw-layout-flexColumn" exist-when="conditions.showSearchPanel">
        <pca0-advanced-reuse-search sub-panel-context="{ ...subPanelContext}"/>
    </div>
    <div class="aw-layout-flexColumn" exist-when="conditions.showPickerPanel">
        <pca0-advanced-reuse-picker sub-panel-context="{ ...subPanelContext, contextUidInAdvancedReuse: data.selectedContext.uid}"/>
    </div>
</aw-panel>
