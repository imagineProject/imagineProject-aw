<aw-command-panel caption="{{i18n.exportCmdTitle}}" context="subPanelContext">
    <aw-panel-body>
        <aw-panel-section>
            <div class="sw-column">
                <aw-label prop="data.selectionIconsToTextConversionMessage"></aw-label>
                <div class="sw-row aw-cfg-constraintsMatrixLegend">
                    <img src="assets/image/indicatorApprovedPass16.svg" class="aw-cfg-variantgridHeaderIcon"></img>
                    <aw-label prop="data.positiveSelection"></aw-label>
                </div>
                <div class="sw-row aw-cfg-constraintsMatrixLegend">
                    <img src="assets/image/miscUiExcludeBox18.svg" class="aw-cfg-variantgridHeaderIcon"></img>
                    <aw-label prop="data.negativeSelection"></aw-label>
                </div>
                <div class="sw-row aw-cfg-constraintsMatrixLegend">
                    <img src="assets/image/indicatorIncludeDefaultSelection16.svg" class="aw-cfg-variantgridHeaderIcon"></img>
                    <aw-label prop="data.defaultPositiveSelection"></aw-label>
                </div>
                <div class="sw-row aw-cfg-constraintsMatrixLegend">
                    <img src="assets/image/indicatorExcludeDefaultSelection16.svg" class="aw-cfg-variantgridHeaderIcon"></img>
                    <aw-label prop="data.defaultNegativeSelection"></aw-label>
                </div>
                <div class="sw-row aw-cfg-constraintsMatrixLegend">
                    <img src="assets/image/indicatorSystemApprovedPass16.svg" class="aw-cfg-variantgridHeaderIcon"></img>
                    <aw-label prop="data.systemPositiveSelection"></aw-label>
                </div>
                <div class="sw-row aw-cfg-constraintsMatrixLegend">
                    <img src="assets/image/indicatorSystemExclude16.svg" class="aw-cfg-variantgridHeaderIcon"></img>
                    <aw-label prop="data.systemNegativeSelection"></aw-label>
                </div>
                <div class="sw-row aw-cfg-constraintsMatrixLegend">
                    <img src="assets/image/indicatorConfiguredOut16.svg" class="aw-cfg-variantgridHeaderIcon"></img>
                    <aw-label prop="data.isUnconfigured"></aw-label>
                </div>
            </div>
        </aw-panel-section>
    </aw-panel-body>
    <aw-panel-footer class=" aw-cfg-settingsFooter">
        <aw-button action="exportDocBatch">i18n.export</aw-button>
    </aw-panel-footer>
</aw-command-panel>
