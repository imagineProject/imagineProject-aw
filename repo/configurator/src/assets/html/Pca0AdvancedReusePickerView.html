<aw-panel-body>
    <aw-command-bar anchor="pca0_AdvancedReuseCommandBar" alignment="HORIZONTAL" context="data.selectedVariability"></aw-command-bar>
    <pca0-variability-picker
        sub-panel-context="{ ...props.subPanelContext, tabKey : 'tc_xrt_Features',
        showMultiSelectOnLoad: 'true', selectionModel: selectionModels.variabilitySelectionModel }"
        selection-data="data.selectionData" selected-variability="data.selectedVariability"
        display-properties="{ viewMode: 'advancedReuse' }",
        client-scope="Pca0AdvancedReuseVariability">
    </pca0-variability-picker>
</aw-panel-body>
<aw-panel-footer>
    <aw-checkbox prop="data.runInBackground"></aw-checkbox>
    <aw-button action="reuseAction" aw-class="{'disabled': conditions.isReuseDisabled}">
        {{i18n.reuseCmd}}
    </aw-button>
</aw-panel-footer>
