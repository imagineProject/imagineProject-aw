<!-- Generic Search, e.g. Name/Description/ID -->
<div visible-when="conditions.isGenericFieldSearchCriteriaSelected">
    <br />
    <aw-property-label prop="data.searchCriteriaLink"></aw-property-label>
    <aw-search-box prop="data.searchCriteria" action="launchResultsPanelAndSearch"></aw-search-box>
    <br />
    <div class="aw-cfg-revisionruleCheckBox">
        <aw-checkbox prop="data.considerRevRuleForSearch"></aw-checkbox>
    </div>
    <div class="aw-cfg-revisionruleValue">
        <aw-include name="Pca0RevisionRule"
            sub-panel-context="{ ...data.subPanelContextInfo, currentRevisionRule : props.subPanelContext.value.revisionRule, popupId: props.subPanelContext.popupId }"></aw-include>
    </div>
</div>

<!-- Feature Search -->
<aw-panel visible-when="conditions.featureSearchCriteriaSelected">
    <br />
    <aw-panel-body>
        <aw-panel-section caption="i18n.familiesAndFeatures" exist-when="!conditions.showFeatureSelectorView"
            anchor="aw_vcv_loadSVRFilterByFeatureCommandBar" anchor-position="RIGHT" hide-commands-when-collapsed="true"
            context="{{props.subPanelContext.searchState}}">
            <pca0-families-and-features-filter sub-panel-context="{...props.subPanelContext}">
            </pca0-families-and-features-filter>
        </aw-panel-section>
        <div class="sw-column" exist-when="conditions.showFeatureSelectorView">
            <aw-navigate-panel title="i18n.advancedFeatureSelector" pre-panel-id="Pca0LoadSVRSearchInputTab"
                panel-id="Pca0SelectFeaturesSubPanel" sub-panel-context="{selectionData : props.subPanelContext.searchState.selectionData,
                    selectedVariability : props.subPanelContext.searchState.selectedVariability,
                variantRuleData: props.subPanelContext.variantRuleData}"
                action="navigateToSubView"></aw-navigate-panel>
        </div>
        <div class="aw-cfg-revisionruleCheckBox">
            <aw-checkbox prop="data.considerRevRuleForSearch"></aw-checkbox>
        </div>
        <div class="aw-cfg-revisionruleValue">
            <pca0-revision-rule sub-panel-context="{ ...data.subPanelContextInfo, currentRevisionRule : props.subPanelContext.value.revisionRule, popupId: props.subPanelContext.popupId }">
            </pca0-revision-rule>
        </div>
    </aw-panel-body>
    <br />
    <br />
    <br />
    <br />
    <br />
    <aw-panel-footer exist-when="!conditions.showFeatureSelectorView">
        <aw-button action="launchResultsPanelAndSearch" enable-when="conditions.enableFilterApply">
            <aw-i18n>{{i18n.search}}</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel>

<!-- Expression Search -->
<aw-panel visible-when="conditions.expressionSearchCriteriaSelected">
    <aw-panel-body>
        <aw-panel-section anchor-position="RIGHT" anchor="aw_FormulaSuggesterCommandBar"
            context="{{{editorObject:props.subPanelContext.editorObject, contextKey:'fscContext'}}}">
            <aw-checkbox prop="data.useExpressionFromVCV" action='handleUseExpressionsFromVCV'></aw-checkbox>
            <pca0-formula-suggester formula="props.subPanelContext.formula"
                editor-object="props.subPanelContext.editorObject"
                config-perspective-uid="{{data.configPerspectiveUid}}"></pca0-formula-suggester>
        </aw-panel-section>
        <div class="aw-cfg-revisionruleCheckBox">
            <aw-checkbox prop="data.considerRevRuleForSearch"></aw-checkbox>
        </div>
        <div class="aw-cfg-revisionruleValue">
            <pca0-revision-rule sub-panel-context="{ ...data.subPanelContextInfo, currentRevisionRule : props.subPanelContext.value.revisionRule, popupId: props.subPanelContext.popupId }">
            </pca0-revision-rule>
        </div>
    </aw-panel-body>
    <br />
    <br />
    <br />
    <br />
    <br />
    <aw-panel-footer>
        <aw-button action="triggerEditorInternalFormulaUpdateBatch" enable-when="data.isEditorContentNotEmpty">
            <aw-i18n>{{i18n.search}}</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel>

<!-- Variant Rules (Saved Query) Search -->
<aw-include exist-when="conditions.savedQuerySearchCriteriaSelected" name="Pca0AdvancedSearch"
    sub-panel-context="{ ...props.subPanelContext }"></aw-include>
