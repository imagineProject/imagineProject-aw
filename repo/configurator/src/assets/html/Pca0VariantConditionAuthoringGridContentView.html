<div class="sw-column w-12">
    <div class="sw-row aw-cfg-variantConditionFilterCriteriaSettings" exist-when="!subPanelContext.hideFilterSettings && ctx.variantConditionContext.appliedSettings">
        <aw-include name="Pca0FilterCriteriaSettings" sub-panel-context="data.subPanelContextInfo"></aw-include>
    </div >
    <div class="sw-row">
        <div class="sw-column w-12">
            <div>
                <div class="aw-xrt-objectSetCommandPanel" aw-transclude>
                    <aw-server-visibility-command-bar anchor="aw_Vca_CommandBar"
                        context="{ variabilityProps: fields.variabilityProps, vcaEditState: fields.vcaEditState, gridSelectionState: fields.gridSelectionState, subPanelContext: subPanelContext, keepFilterActive: props.grids.variantConditionAuthoringGrid.columnProviderInstance.columnFilterSavingStatus }"
                        alignment="HORIZONTAL" exist-when="data.isCommandBarVisible"></aw-server-visibility-command-bar>
                </div>
            </div>
            <aw-splm-table class="aw-cfg-variantgrid" gridid="variantConditionAuthoringGrid" use-tree="true" show-decorators="true"
            selection-data="props.subPanelContext.selectionData"></aw-splm-table>
        </div>
    </div>
    <aw-splitter exist-when="ctx.variantConditionContext.formulaEditorProps.isFormulaEditorOpen" direction="HORIZONTAL"
        min-size-1="6" min-size-2="6"> </aw-splitter>
    <div class="sw-row  aw-cfg-variantFormulaEditor" exist-when="ctx.variantConditionContext.formulaEditorProps.isFormulaEditorOpen">
        <aw-break></aw-break>
        <aw-full-screen include-component-name="Pca0VariantFormulaEditor" header-title="{{props.subPanelContext.activeTab.name}}"
            header-context-title="aw-full-screen" context="{...props.subPanelContext, vcaEditState:data.vcaEditState, contextKey: 'variantConditionContext', configPerspectiveUid: data.treeMaps.soaResponseConfigPerspectiveUid, selectedExpressions: data.treeMaps.soaResponseSelectedExpressions }">
        </aw-full-screen>
    </div>
</div>
