    <aw-panel-body class="aw-cfg-tooltipViolationPanel aw-layout-flexRowContainer">
        <aw-panel-section caption="Current Violations" collapsed="disabled">
            <div aw-repeat="violationMsg: subPanelContext" class="aw-clsadmin-objectNamesList">
                <aw-flex-row>
                    <aw-icon class="aw-cfg-violationImageTooltip errorIndicatorinSummary" icon-id="indicatorError" exist-when="violationMsg.icon === 'error'"></aw-icon>
                    <aw-icon class="aw-cfg-violationImageTooltip warningIndicatorinSummary" icon-id="indicatorWarning" exist-when="violationMsg.icon === 'warning'"></aw-icon>
                    <aw-icon class="aw-cfg-violationImageTooltip infoIndicatorinSummary" icon-id="indicatorInfo" exist-when="violationMsg.icon === 'info'"></aw-icon>
                    <label class="aw-clsadmin-objectNames aw-cfg-tooltipViolationLabel" title="{{violationMsg.message}}">{{violationMsg.message}}</label>
                </aw-flex-row>
            </div>
        </aw-panel-section>
    </aw-panel-body>
    <aw-panel-footer class="sw-column">
        <br />
        <div class="sw-row sw-component">
            <div class="sw-column demo-w-3f">
                <aw-pic class="aw-widget-thumbnail" icon-id="data.indicatorInfo"></aw-pic>
            </div>
            <div class="sw-column">
                <span>{{i18n.violationNote}}</span>
            </div>
        </div>
    </aw-panel-footer>
