<aw-column width="fill">
    <!-- Case - Navigation from Where used tab -->
    <aw-guidance-message message="selectedVariantsMessage" closable="true" banner-style="true" show-icon="true" show-type="false" visible-when="conditions.Pca0ShowFilteredListGuidanceMsg" >
        <aw-button action="resetPrimaryWorkAreaTableBatchAction">{{i18n.refresh}}</aw-button>
    </aw-guidance-message>
    <!-- Case - Compare revisions or Variant criteria -->
    <aw-guidance-message message="compareRevisionsMessage" closable="true" banner-style="true" show-icon="true" show-type="false" visible-when="conditions.Pca0IsInShowAllRevisionMode" >
        <aw-button action="resetPrimaryWorkAreaTableBatchAction">{{i18n.showAllVariants}}</aw-button>
    </aw-guidance-message>
    <aw-splm-table gridid="pca0VariantRuleGrid"
        use-tree="false" exist-when="!conditions.showEmptyWorkarea"
        show-decorators="true" show-check-box="subPanelContext.showCheckBox">
    </aw-splm-table>
    <aw-empty-workarea
        exist-when="conditions.showEmptyWorkarea"
        image="graEmptyProductConfigurator128"
        title="i18n.emptyWorkAreaTitle"
        hint="i18n.showNoVariantsHint"
        command-id="Pca0AddVariants"
        command-context="{...subPanelContext}"
        link-text="i18n.addCmd">
    </aw-empty-workarea>
</aw-column>
