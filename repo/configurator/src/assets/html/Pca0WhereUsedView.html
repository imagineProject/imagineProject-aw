<aw-panel-body>
    <aw-server-visibility-toolbar first-anchor="aw_featuresWhereUsed_CommandBar"
        second-anchor="aw_featuresWhereUsed_CommandBarRight"
        context="{ settings: data.settings, ...props.subPanelContext  }"
        alignment="HORIZONTAL"></aw-server-visibility-toolbar>

    <aw-scrollpanel>

        <!--Contexts and Dictionaries-->
        <div class="aw-layout-summaryContent">
            <aw-full-screen include-component-name="Pca0WhereUsedSection" exist-when="conditions.showContexts"
                header-title="{{props.subPanelContext.activeTab.name}}"
                header-path='{{props.subPanelContext.selection[0].props.object_string.uiValues[0]}}'
                header-context-title='i18n.section_showContexts'
                context='{sectionName: "where_used_in_contexts", sectionExpanded: data.sectionExpStatusCache.value.contextsExpanded,
            displayTitle: i18n.section_showContexts, ...data.objectSetContexts, ...props.subPanelContext, reloadObjectSetState : data.reloadObjectSetState}'>
            </aw-full-screen>
        </div>

        <!--Constraints-->
        <div class="aw-layout-summaryContent">
            <aw-full-screen include-component-name="Pca0WhereUsedSection" exist-when="conditions.showConstraints"
                header-title="{{props.subPanelContext.activeTab.name}}"
                header-path='{{props.subPanelContext.selection[0].props.object_string.uiValues[0]}}'
                header-context-title='i18n.section_showConstraints'
                context='{sectionName: "where_used_in_constraints", sectionExpanded: data.sectionExpStatusCache.value.constraintsExpanded,
        displayTitle: i18n.section_showConstraints, ...data.objectSetConstraints, ...props.subPanelContext, reloadObjectSetState : data.reloadObjectSetState}'>
            </aw-full-screen>
        </div>

        <!--Variants-->
        <div class="aw-layout-summaryContent">
            <aw-full-screen include-component-name="Pca0WhereUsedSection" exist-when="conditions.showVariants"
                header-title="{{props.subPanelContext.activeTab.name}}"
                header-path='{{props.subPanelContext.selection[0].props.object_string.uiValues[0]}}'
                header-context-title='i18n.section_showVariants'
                context='{sectionName: "where_used_in_variants", sectionExpanded: data.sectionExpStatusCache.value.variantsExpanded,
        displayTitle: i18n.section_showVariants, ...data.objectSetVariants, ...props.subPanelContext, reloadObjectSetState : data.reloadObjectSetState}'>
            </aw-full-screen>
        </div>

        <!--Layout Slots-->
        <aw-layout-slot aw-repeat="section: data.consumerAppSlots" name="{{section}}"
            context="{settingsUpdateCallback: actions.handleLayoutSlotUpdate, showSection: data.settings.sectionsVisibility[section].isSectionVisibleInUI, xrtContext: data.xrtContext, reloadObjectSetState : data.reloadObjectSetState, pwaSelectionData : props.subPanelContext.selection}"></aw-layout-slot>
    </aw-scrollpanel>
</aw-panel-body>
