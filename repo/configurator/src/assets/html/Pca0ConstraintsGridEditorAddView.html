<aw-command-panel caption="i18n.addCmd" context="subPanelContext">
    <div class="aw-layout-flexColumn" show-when="data.activeState.value.activeView ==='AddObjectPrimarySub'">
        <aw-add include-types="{{subPanelContext.ruleTypes}}"
                visible-tabs="new"
                active-state="data.activeState"
                xrt-state="data.xrtState"
                auto-select-on-unique-type="true"
                edit-handler="editHandlers.addPanelEditHandler"
                max-recent-count="10"
                sub-panel-context="{ ...subPanelContext}">
        </aw-add>

        <aw-panel-footer class="aw-cfg-settingsFooter">
            <aw-button action="createConstraint" enable-when="formProp.attributes.valid && data.xrtState.xrtTypeLoaded">
                <aw-i18n>i18n.addCmd</aw-i18n>
            </aw-button>
        </aw-panel-footer>
    </div>
    <aw-add-navigate active-state="data.activeState" action="actions.setActiveView"></aw-add-navigate>
</aw-command-panel>
