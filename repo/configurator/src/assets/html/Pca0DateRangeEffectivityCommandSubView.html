<aw-panel class="pca0dateeffectivitysub">
    <aw-panel-body>
        <aw-panel-section caption="i18n.dateRange" collapsed="disabled">
            <div class="aw-cfg-fscStartDateEffRange">
                <aw-date prop="data.startDate"></aw-date>
            </div>
            <aw-break></aw-break>
            <div class="aw-cfg-fscEndDateEffRange">
                <aw-widget prop="data.endDateOptions"></aw-widget>
                <aw-date prop="data.endDate" exist-when="data.endDateOptions.dbValue=='Date'"></aw-date>
            </div>
        </aw-panel-section>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="applyDateRangeEffectivity" enable-when=" !conditions.isStartDateValidationFailed && !conditions.isEndDateValidationFailed">
            <aw-i18n>i18n.set</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel>
