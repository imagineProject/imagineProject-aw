<div class='sw-full-screen-header aw-layout-panelTitle sw-row justify-justified'>
    <div class="sw-row" align-content="start">
        <div class='aw-layout-locationTitle justify-justified aw-cfg-constraintsFullScreenHeaderContent'
            exist-when="props.subPanelContext.headerPath">
            {{props.subPanelContext.headerPath}}
        </div>
        <div class='aw-layout-locationTitle aw-cfg-constraintsFullScreenSeparator' exist-when="props.subPanelContext.headerPath">|
        </div>
        <div class='aw-layout-locationTitle justify-justified aw-cfg-constraintsFullScreenHeaderContent'>
            {{i18n.Pca0Constraints}}
        </div>
    </div>
    <div class='align-center justify-right flex-shrink sw-panel-bar'>
        <aw-command-bar class='aw-layout-workareaCommandbar' anchor="aw_fullScreenHeader"
            context="props.subPanelContext" alignment="HORIZONTAL"></aw-command-bar>
    </div>
</div>
