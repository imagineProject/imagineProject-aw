<aw-command-panel caption="i18n.addPanelTitle" context="subPanelContext">
    <aw-panel-body>
        <aw-panel-section caption="i18n.toTitle" exist-when="data.toFamily">
            <aw-default-cell item="data.toFamily"></aw-default-cell>
        </aw-panel-section>
        <aw-panel-section caption="{{data.nameOfFamily}}">
            <div class="sw-row">
                <div class="aw-cfg-rangeText" exist-when="conditions.isRangeInfoAvailable">
                    <aw-widget prop="data.showRangeTitle"></aw-widget>
                </div>
            </div>
            <div class="sw-row">
                <div class="sw-column aw-cfg-fscFreeFormToFromRange">
                    <aw-listbox class="aw-cfg-fromOperatorListBox" prop="data.fromOperator"
                        list="data.fromListValues.OperatorValues" exist-when="!conditions.isStringFamily">
                    </aw-listbox>

                    <aw-widget class="aw-cfg-fromOperatorListBox" prop="data.textTitle" exist-when="conditions.isStringFamily"></aw-widget>
                    <label exist-when="conditions.isStringFamily">=</label>
                </div>

                <div class="sw-column w-11 aw-cfg-fscFreeFormRangeExpEnumValue" exist-when="!conditions.isDateFamily">
                    <aw-widget class="aw-cfg-fromValueListBox" prop="data.fromFeatureComponent"
                        exist-when="conditions.isFreeFormFamily && !conditions.isDateFamily">
                    </aw-widget>
                    <aw-widget class="aw-cfg-fromValueListBox" prop="data.fromFeatureListComponent"
                        exist-when="!conditions.isFreeFormFamily && !conditions.isDateFamily"></aw-widget>
                </div>

                <div class="sw-column w-11 aw-cfg-fscFreeFormRangeExpDateWidget" exist-when="conditions.isDateFamily">
                    <aw-widget prop="data.fromDateFeatureComponent"></aw-widget>
                </div>
            </div>

            <div class="sw-row" exist-when="!conditions.isStringFamily">
                <div class="sw-column aw-cfg-fscFreeFormToFromRange">
                    <aw-listbox class="aw-cfg-toOperatorListBox" prop="data.toOperator"
                        list="data.toListValues.OperatorValues" enable-when="conditions.isToPartEnable"></aw-listbox>
                </div>
                <div class="sw-column w-11 aw-cfg-fscFreeFormRangeExpEnumValue" exist-when="!conditions.isDateFamily">
                    <aw-widget class="aw-cfg-toValueListBox" prop="data.toFeatureComponent" enable-when="conditions.isToPartEnable && conditions.toOperatorIsValid"
                        exist-when="conditions.isFreeFormFamily && !conditions.isDateFamily"></aw-widget>
                    <aw-widget class="aw-cfg-toValueListBox" prop="data.toFeatureListComponent" enable-when="conditions.isToPartEnable && conditions.toOperatorIsValid"
                        exist-when="!conditions.isFreeFormFamily && !conditions.isDateFamily"></aw-widget>
                </div>
                <div class="sw-column w-11 aw-cfg-fscFreeFormRangeExpDateWidget" exist-when="conditions.isDateFamily">
                    <aw-widget prop="data.toDateFeatureComponent" enable-when="conditions.isToPartEnable && conditions.toOperatorIsValid"></aw-widget>
                </div>
            </div>
            <div>
                <aw-widget prop="data.previewTitle"></aw-widget>
                <!-- just text -->
                <div class="aw-cfg-previewText" exist-when="!conditions.isDateFamily && conditions.isFreeFormFamily">
                    <label>{{data.fromOperator.uiValue}} {{data.fromFeatureComponent.uiValue}}</label>
                    <label exist-when="conditions.isToPartEnable && data.toFeatureComponent.dbValue !== ''">
                        {{data.expressionAndValue}}{{data.toOperator.uiValue}} {{data.toFeatureComponent.uiValue}}
                    </label>
                </div>

                <div class="aw-cfg-previewText" exist-when="!conditions.isDateFamily && !conditions.isFreeFormFamily">
                    <label>{{data.fromOperator.uiValue}} {{data.fromFeatureListComponent.uiValue}}</label>
                    <label exist-when="conditions.isToPartEnable && data.toFeatureListComponent.dbValue !== ''">
                        {{data.expressionAndValue}}{{data.toOperator.uiValue}} {{data.toFeatureListComponent.uiValue}}
                    </label>
                </div>

                <div class="aw-cfg-previewText" exist-when="conditions.isDateFamily">
                    <label>{{data.fromOperator.uiValue}} {{data.fromDateFeatureComponent.uiValue}}</label>
                    <label exist-when="conditions.isToPartEnable && data.toDateFeatureComponent.dbValue !== ''">
                        {{data.expressionAndValue}}{{data.toOperator.uiValue}} {{data.toDateFeatureComponent.uiValue}}
                    </label>
                </div>
            </div>
        </aw-panel-section>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="addFeatureToFamily"
            visible-when="data.fromFeatureComponent.dbValue !== '' || data.fromDateFeatureComponent.dbValue !== '' || data.fromFeatureListComponent.dbValue !== '' ">
            <aw-i18n>i18n.addButtonTitle</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-command-panel>
