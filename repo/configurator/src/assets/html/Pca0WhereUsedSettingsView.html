<aw-command-panel name="Pca0WhereUsedSettingsPanel" caption="i18n.settings" context="subPanelContext">
    <aw-panel-body>
        <aw-panel-section caption="i18n.revisions">
            <aw-togglebutton prop="data.showAllRevisions"></aw-togglebutton>
        </aw-panel-section>
        <aw-panel-section caption="i18n.dataFromContexts" exist-when="data.canShowDataFromAllContexts">
            <aw-togglebutton prop="data.showDataFromAllContexts" enable-when="conditions.isModelsOrFeaturesTab"></aw-togglebutton>
        </aw-panel-section>
        <aw-panel-section caption="i18n.sectionTitle">
            <div aw-repeat="section : data.sectionsVisibility">
                <aw-togglebutton prop="section" action="handleSectionsVisibilityChanged"></aw-togglebutton>
            </div>
        </aw-panel-section>
    </aw-panel-body>
    <aw-panel-footer class="aw-cfg-settingsFooter">
        <aw-button action="applySettings" visible-when="conditions.settingsChanged">
            <aw-i18n>i18n.applyCmd</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-command-panel>
