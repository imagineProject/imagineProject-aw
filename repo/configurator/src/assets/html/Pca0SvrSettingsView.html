
<aw-command-panel name="Pca0SVRSettingsPanel" caption="{{i18n.profileSettings}}" context="subPanelContext">
    <div>
        <aw-label class="aw-cfg-labelAlignmentInPanelHeader" prop="data.settingsTitle"></aw-label>
        <aw-separator class="aw-cfg-separatorAlignmentInAddModulesPanel"></aw-separator>
    </div>
    <div class="aw-layout-flexColumn" exist-when="data.settingsTitle" show-when="data.activeView ==='Pca0SvrSettingsContent'">
        <pca0-svr-settings-content sub-panel-context="{ ...subPanelContext, svrSettings: data.svrSettings }" />
    </div>
    <!-- those are views that replace the main view as we navigate into the depths of it, coming back we'll restore the main settings content view-->
    <div class="aw-layout-flexColumn" exist-when="data.activeView ==='Pca0DateRangeEffectivityCommandSub'">
        <aw-navigate-panel title="i18n.effectivity" pre-panel-id="Pca0SvrSettingsContent"
            panel-id="Pca0DateRangeEffectivityCommandSub" action="setActiveView"
            sub-panel-context="{ ...props.subPanelContext, svrSettings: data.svrSettings}">
        </aw-navigate-panel>
    </div>
    <div class="aw-layout-flexColumn" exist-when="data.activeView ==='Pca0RuleDateSub'">
        <aw-navigate-panel title="i18n.ruleDateSubPanelTitle" pre-panel-id="Pca0SvrSettingsContent"
            panel-id="Pca0RuleDateSub" action="setActiveView" sub-panel-context="{ ...props.subPanelContext, svrSettings: data.svrSettings}">
        </aw-navigate-panel>
    </div>
    <div class="aw-layout-flexColumn" exist-when="ctx.showFileUploadPanel===true">
</aw-command-panel>
