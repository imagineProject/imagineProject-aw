<div class="sw-column aw-cfg-variantgridHeaderMaxHeight">
    <div class="sw-row aw-cfg-variantgridHeaderMaxHeight">
        <div exist-when="props.column.isTreeNavigation === true || props.column.isColumnFromCots" class="aw-cfg-variantgridFilterHeader">
            <aw-icon icon-id="cmdMoreVertical" class="aw-cfg-variantgridHeaderMenuIcon"></aw-icon>
            {props.column.displayName}
        </div>
        <div exist-when="props.column.isTreeNavigation !== true && !props.column.isSplitColumn && !props.column.isColumnFromCots"
            class="aw-cfg-variantgridHeader">
            {props.column.displayName}
        </div>
        <div exist-when="props.column.isTreeNavigation !== true && !props.column.isColumnFromCots">
            <aw-icon icon-id="cmdMoreVertical" class="aw-cfg-variantgridHeaderMenuIcon"></aw-icon>
        </div>
    </div>
    <div class="sw-row aw-cfg-variantgridHeaderRow">
        <div class="sw-column">
            <img src="{{data.headerIconUrl}}" exist-when="data.headerIconUrl" class="aw-cfg-variantgridHeaderIcon"
                alt="{{props.column.displayName}}"></img>
        </div>
        <div class="sw-column" exist-when="data.violationsInColumn">
            <img class="aw-cfg-variantgridHeaderIcon aw-cfg-variantgridHeaderViolationIcon" alt="i18n.error"
                src="{{data.errorIconUrl}}" extended-tooltip-context="data.tooltipDetails"
                extended-tooltip="Pca0VariantColumnExtTooltip"></img>
        </div>
        <div exist-when="data.tooltipInfo.showExpressionNonGridableTooltip" class="aw-cfg-constraintsGridHeaderIcon">
            <img src="{{data.tooltipInfo.expressionNonGridableTooltipDetails.attentionIconUrl}}" alt="" extended-tooltip-context="data.tooltipInfo"
                extended-tooltip="Pca0NonGridableExpressionTooltip">
            </img>
        </div>
    </div>
</div>
