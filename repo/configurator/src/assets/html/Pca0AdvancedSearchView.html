<aw-panel-body>
    <aw-panel-body>
        <aw-panel-section visible-when="conditions.showAdvancedSearchAttributes" class="aw-attributes-section">
            <aw-advanced-search-attributes attributes="fields.awp0AdvancedQueryAttributes" call-back-action="clearAll"
                enter-key-action="doAdvancedSearch"></aw-advanced-search-attributes>
        </aw-panel-section>
        <div class="aw-cfg-revisionruleCheckBox">
            <aw-checkbox prop="data.considerRevRuleForSearch"></aw-checkbox>
        </div>
        <div class="aw-cfg-revisionruleValue">
            <aw-include name="Pca0RevisionRule"
                sub-panel-context="{ ...data.subPanelContextInfo, currentRevisionRule : props.subPanelContext.value.revisionRule, popupId: props.subPanelContext.popupId }"></aw-include>
        </div>
    </aw-panel-body>

    <aw-panel-footer>
        <aw-button size='auto' action="doAdvancedSearch" exist-when="conditions.showAdvancedSearchButton">
            <aw-i18n>i18n.searchBtn</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel-body>
