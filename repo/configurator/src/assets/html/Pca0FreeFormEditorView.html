<div class="sw-column w-12">
    <div class="sw-row">
        <aw-guidance-message message="freeFormEditorReadonlyMessage" closable="true" banner-style="true" show-icon="true" show-type="false" close-action="closeGuidanceMsgAction" visible-when="conditions.isTextEditorTemplatesInReadOnlyMode">
        </aw-guidance-message>
    </div>
    <div class="sw-row cfg-fixed-width-container-bar">
        <div>
            <div class="cfg-fixed-width-container-template">
                <div>
                    <div class="justify-left aw-cfg-expressionsTemplateText">
                        <p>i18n.expressionTemplates</p>
                    </div>
                </div>
                <div>
                    <div class="justify-left aw-cfg-expressionsTemplateBox" height="1f">
                        <aw-listbox prop="data.templateBox" list="data.freeFormEditorData.listOfTemplates"
                            action="freeFormTemplateSelection" enable-when="!conditions.isTextEditorTemplatesInReadOnlyMode"></aw-listbox>
                    </div>
                </div>
            </div>
        </div>
        <div class="sw-column w-8">
            <div class="sw-row justify-right">
                <aw-command-bar anchor="aw_FreeFormEditorCommandBar" class="aw-commands-commandBarHorizontalRight"
                    alignment="HORIZONTAL" overflow='true'
                    context="{ freeFormEditorData: data.freeFormEditorData, ...props.subPanelContext, readOnly:data.config.options.readOnly } ">
                </aw-command-bar>
            </div>
        </div>
    </div>
    <div class="sw-row h-12">
        <div class="aw-cfg-freeFormTextEditorContainer">
            <aw-source-editor name="freeFormSourceEditor" editor="data.monacoEditor" content="data.monacoContent"
                config="data.config" global-config="fields.monacoGlobalConfig">
            </aw-source-editor>
        </div>
    </div>
</div>

<div class="aw-cfg-overlay">
    <p class="aw-cfg-freeFormEditorFooter">i18n.row</p>: <span id="freeForm-row"></span>
    <p class="aw-cfg-freeFormEditorFooter">i18n.column</p>: <span id="freeForm-column"></span>
    <p class="aw-cfg-freeFormEditorFooter">i18n.totalLines</p>: <span id="freeForm-total"></span>
</div>
