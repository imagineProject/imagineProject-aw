<!-- Double layout according to use case as header or in Settings panel-->
<div class="aw-layout-headerPropContainer aw-layout-flexRowContainer" id="vcaFilterCriteriaContainer"
    exist-when="subPanelContext.contextKey !== 'fscContext'">
    <div class="sw-row aw-layout-headerProperty align-center">
        <aw-property-label prop="data.revisionRule"></aw-property-label>
        <aw-include name="Pca0RevisionRule" sub-panel-context="{...props.subPanelContext}"></aw-include>
    </div>
    <div class="sw-row aw-layout-headerProperty align-center">
        <aw-property-label prop="data.effectivity"></aw-property-label>
        <div exist-when="ctx.preferences.PCA_effectivity_shown_columns[ 0 ] !== 'UnitOnly'">
            <pca0-date-effectivity sub-panel-context="{...props.subPanelContext}" />
        </div>
        <div exist-when="ctx.preferences.PCA_effectivity_shown_columns[ 0 ] !== 'DateOnly'">
            <aw-include name="Pca0UnitEffectivity" sub-panel-context="{...props.subPanelContext}"></aw-include>
        </div>
    </div>
    <div class="sw-row aw-layout-headerProperty align-center">
        <aw-property-label prop="data.ruleDate"></aw-property-label>
        <pca0-rule-date sub-panel-context="{...props.subPanelContext}" />
    </div>
</div>

<div exist-when="subPanelContext.contextKey === 'fscContext'">
    <div class="sw-section" exist-when="conditions.showProductHierarchyDepth" enable-when="!conditions.isFSCGridViewSelected">
        <aw-listbox prop="data.productHierarchyDepth" action="productHierarchyDepthChanged"></aw-listbox>
    </div>

    <aw-property-label prop="data.revisionRule"></aw-property-label>
    <aw-include name="Pca0RevisionRule" sub-panel-context="{...props.subPanelContext}"></aw-include>

    <aw-break></aw-break>

    <!-- Display Date range followed by unit range -->
    <aw-property-label prop="data.effectivity"></aw-property-label>
    <div exist-when="ctx.preferences.PCA_effectivity_shown_columns[ 0 ] !== 'UnitOnly'">
        <pca0-date-effectivity sub-panel-context="{...props.subPanelContext}" />
    </div>
    <div exist-when="ctx.preferences.PCA_effectivity_shown_columns[ 0 ] !== 'DateOnly'">
        <aw-include name="Pca0UnitEffectivity" sub-panel-context="{...props.subPanelContext}"></aw-include>
    </div>

    <aw-break></aw-break>

    <aw-property-label prop="data.ruleDate"></aw-property-label>
    <pca0-rule-date sub-panel-context="{...props.subPanelContext}" />
</div>
