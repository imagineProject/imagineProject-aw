<aw-panel>
    <aw-panel-body>
        <pca0-show-variability sub-panel-context="{ ...subPanelContext}"
            selection-data="props.subPanelContext.selectionData" selected-variability="props.subPanelContext.selectedVariability"
            display-properties="{ viewMode: 'constraintsFilterByFeature' }"
            feature-client-scope="Pca0VariabilityExplorerFeatures"
            models-client-scope="Pca0VariabilityExplorerProducts">
        </pca0-show-variability>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="setSelectedFeaturesInConstraintsFilterPanel">
            {i18n.confirmSelections}
        </aw-button>
    </aw-panel-footer>
</aw-panel>
