<aw-form name="createVariantRuleInput" >
    <div exist-when="conditions.showFromSection">
        <aw-label class="aw-cfg-labelAlignmentInPanelHeader" prop="data.fromTitle"></aw-label>
        <aw-separator class="aw-cfg-separatorAlignmentInAddModulesPanel"></aw-separator>
    </div>
    <aw-break> </aw-break>
    <aw-panel-body>
        <aw-xrt type="CREATE" object-type="{{props.subPanelContext.type}}" xrt-state="data.xrtState" ></aw-xrt>
        <aw-panel-section visible-when="conditions.showAttachmentChoice">
            <aw-radiobutton prop="data.attachVariantRuleToContent"></aw-radiobutton>
        </aw-panel-section>
    </aw-panel-body>
    <aw-panel-footer>
       <aw-button action="createVariantRuleBatch" enable-when="formProp.attributes.valid && !data.saveSVRinProgressFlag">
            <aw-i18n>i18n.saveCmd</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-form>
