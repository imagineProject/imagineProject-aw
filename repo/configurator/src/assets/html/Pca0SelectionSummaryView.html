<aw-scrollpanel caption="i18n.selectionSummaryTitle" context="subPanelContext">
    <aw-panel-header>
        <div class="sw-row">
            <aw-guidance-message message="selectionSummaryGuidanceMessage" visible-when="conditions.refreshSelectionListForAllSelection" banner-style="true" show-icon="true" show-type="false" icon="indicatorWarning">
                <aw-button action="refreshSelectionSummary" button-type="accent-high-contrast" default="" size="default">{{i18n.refresh}}</aw-button>
            </aw-guidance-message>
            <aw-guidance-message message="selectionSummaryGuidanceMessage" visible-when="conditions.expandForAllSelection" banner-style="true" show-icon="true" show-type="false" icon="indicatorWarning">
                <aw-button action="Pca0ExpandForSummary" button-type="accent-high-contrast" default="" size="default">{{i18n.cmdExpandSystemSelection}}</aw-button>
            </aw-guidance-message>
            <aw-guidance-message message="selectionSummaryGuidanceMessage" visible-when="conditions.refreshSelectionListForIncompleteFamilies" banner-style="true" show-icon="true" show-type="false" icon="indicatorWarning">
                <aw-button action="refreshSelectionSummary" button-type="accent-high-contrast" default="" size="default">{{i18n.refresh}}</aw-button>
            </aw-guidance-message>
            <aw-guidance-message message="selectionSummaryGuidanceMessage" visible-when="conditions.expandForIncompleteFamilies" banner-style="true" show-icon="true" show-type="false" icon="indicatorWarning">
                <aw-button action="Pca0ExpandForSummary" button-type="accent-high-contrast" default="" size="default">{{i18n.cmdExpandSystemSelection}}</aw-button>
            </aw-guidance-message>
        </div>
        <aw-break></aw-break>
        <div class="sw-row align-center">
            <div class="sw-column w-8">
                <aw-listbox prop="data.typeOfSelectionList" list="data.typeOfSelectionListValues.dbValue" action="handleTypeOfSelectionChange"></aw-listbox>
            </div>
        </div>
        <div class="sw-row justify-space-between align-center">
            <div class="sw-column">
                <div class="sw-row">
                    <span class="aw-cfg-selectionCountText">{{data.legendDetails.propertyDisplayName}}</span>
                    <aw-icon icon-id="indicatorInfo16" class="aw-cfg-selectionCountInfo" extended-tooltip-context="data.legendDetails" extended-tooltip="Pca0Legend" exist-when="conditions.isInSelectionTypeAll"></aw-icon>
                </div>
            </div>
            <div class="sw-column">
                <aw-command-bar anchor="aw_SelectionSummaryCommandBar" alignment="HORIZONTAL" overflow='true' context='{isStale : data.isStale}'></aw-command-bar>
            </div>
        </div>
    </aw-panel-header>
    <aw-panel-body visible-when="data.typeOfSelectionList.dbValue !== ''">
        <aw-flex-row>
            <aw-splm-table gridid="selectionSummaryTable" exist-when="conditions.showSelectionSummaryTable"></aw-splm-table>
            <aw-splm-table class="aw-cfg-incompleteFamiliesTable" exist-when="conditions.isInSelectionTypeIncomplete" gridid="incompleteFamiliesTable"></aw-splm-table>
        </aw-flex-row>
    </aw-panel-body>
</aw-scrollpanel>
