<aw-splm-table
    gridid="variabilityExplorerModulesGrid"
    use-tree="true"
    show-decorators="true"
    show-check-box="subPanelContext.pwaSelectionModel.multiSelectEnabled"
    show-when="data.isModulesVisible"
    show-context-menu="true">
</aw-splm-table>
<aw-empty-workarea
    show-when="conditions.showNoModules"
    image="{{data.noResultsImage}}"
    title="i18n.showNoModulesTitle"
    hint="i18n.showNoModulesHint">
</aw-empty-workarea>
