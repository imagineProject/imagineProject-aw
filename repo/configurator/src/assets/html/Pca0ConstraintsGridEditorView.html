<aw-panel-body>
    <div id='matrixLovLegend' class="sw-row flex-shrink aw-cfg-constraintsMatrixLegend"
        visible-when="conditions.canShowLegend">
        <pca0-legend sub-panel-context="data.matrixLegendDetails"></pca0-legend>
    </div>

    <div class="sw-row flex-shrink">
        <aw-server-visibility-toolbar id="constraintsGridEditorToolbar"
            first-anchor="aw_constraintsGridEditorCommandBar" second-anchor="aw_constraintsGridEditorCommandBarRight"
            context="{ variabilityProps: data.variabilityProps, gridSettings: data.gridSettings, displayMode: data.displayMode, arithmeticRuleValidationProps: data.arithmeticRuleValidationProps, ...props.subPanelContext }"
            orientation="HORIZONTAL">
        </aw-server-visibility-toolbar>
    </div>
    <div class="sw-row aw-cfg-topTreeHeight">
        <div class="sw-column w-12">
            <pca0-grid-editor pca0-grid-props="data.topGrid" parent-data="data.parentNode"
                variability-data="{{data.variabilityProps}}" grid-settings-data="{{data.gridSettings}}"
                grid-editor-mode="{{props.subPanelContext.gridEditorMode}}"
                pca0-grid-options="props.pca0GridOptions" use-tree="true"
                exist-when="conditions.isVariabilityDataLoaded"></pca0-grid-editor>
        </div>
    </div>
    <hr />
    <div class="sw-row aw-cfg-bottomTreeHeight" id="bottomTreeTableContainer">
        <div class="sw-column w-12">
            <aw-splm-table gridid="bottomConstraintsGrid" use-tree="true"
                exist-when="conditions.isVariabilityDataLoaded">
            </aw-splm-table>
        </div>
    </div>
    </div>
</aw-panel-body>
