<!-- It will be exist when revision rule updated by Pca0VariabilityExplorerHeaderView using sync strategy -->
<div class="aw-layout-column aw-layout-flexbox">
    <aw-guidance-message message="ShowFailedRowsAfterSaveMessage" visible-when="conditions.showFailedGuidance" closable="false" banner-style="true" show-icon="true" show-type="true" icon="indicatorError" >
        <aw-button action="goToNextFailure" visible-when="conditions.showNext">{{i18n.Pca0ShowNextFailedRowMessage}}</aw-button>
    </aw-guidance-message>
    <!--Guidance message for Reuse mode -->
    <aw-guidance-message message="showReuseModeGuidanceMessage" exist-when="conditions.showReuseModeGuidance" closable="true" show-type="false">
        <aw-button enable-when="conditions.isNotInlineAuthoringMode" action="updateReuseModeFlag">{{i18n.exitReuseMode}}</aw-button>
    </aw-guidance-message>
    <aw-splm-table gridid="variabilityExplorerGrid" command-context="subPanelContext.provider" use-tree="true" show-decorators="true" show-check-box="subPanelContext.showCheckBox"
     show-context-menu="ctx.sublocation.clientScopeURI === 'Pca0VariabilityExplorerFeatures'|| ctx.sublocation.clientScopeURI === 'Pca0VariabilityExplorerProducts'"></aw-splm-table>
</div>
