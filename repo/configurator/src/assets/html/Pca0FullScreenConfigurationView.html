<aw-panel-body class="aw-layout-column" aw-class="{'aw-cfg-panelWithPadding' : !conditions.isOpenedFromConfiguratorCtx}" id="fscPanelBody">
    <aw-full-screen exist-when="!conditions.isOpenedFromConfiguratorCtx" include-component-name="Pca0FullScreenConfigurationContent" header-title="{{props.subPanelContext.viewTuple.name || props.subPanelContext.activeTab.name}}" header-context-title="{{props.subPanelContext.context.showObjectContext.displayName}}" context="props.subPanelContext"></aw-full-screen>
    <pca0-full-screen-configuration-content exist-when="conditions.isOpenedFromConfiguratorCtx" sub-panel-context="props.subPanelContext"/>
    </pca0-full-screen-configuration-content>
</aw-panel-body>
