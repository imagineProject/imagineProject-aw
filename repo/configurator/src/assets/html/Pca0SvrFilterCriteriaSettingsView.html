<div class="sw-section aw-cfg-readOnly" exist-when="conditions.showProductHierarchyDepth">
    <aw-listbox prop="data.productHierarchyDepth"></aw-listbox>
</div>
<div class="sw-section">
    <aw-property-label prop="data.revisionRule"></aw-property-label>
    <pca0-revision-rule sub-panel-context="{...props.subPanelContext}"></pca0-revision-rule>
</div>
<aw-break></aw-break>

<!-- Display Date range followed by unit range -->
<div class="sw-section">
    <aw-property-label prop="data.effectivity"></aw-property-label>
    <div exist-when="ctx.preferences.PCA_effectivity_shown_columns[ 0 ] !== 'UnitOnly'">
        <pca0-date-effectivity sub-panel-context="{...props.subPanelContext}" />
    </div>
    <div exist-when="ctx.preferences.PCA_effectivity_shown_columns[ 0 ] !== 'DateOnly'">
        <pca0-unit-effectivity sub-panel-context="{...props.subPanelContext}"></pca0-unit-effectivity>
    </div>
</div>

<aw-break></aw-break>
<div class="sw-section">
    <aw-property-label prop="data.ruleDate"></aw-property-label>
    <pca0-rule-date sub-panel-context="{...props.subPanelContext}"></pca0-rule-date>
</div>
