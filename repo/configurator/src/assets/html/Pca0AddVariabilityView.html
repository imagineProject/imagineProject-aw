
<aw-command-panel caption="i18n.addPanelTitle" context="subPanelContext">
    <aw-panel-body>
   <pca0-show-variability sub-panel-context="{ ...subPanelContext}"
   selection-data="data.selectionData" selected-variability="data.selectedVariability" selected-families="data.selectedFamilies"
   display-properties="{ viewMode: 'constraintsGridEditor' }"
   feature-client-scope="Pca0VariabilityExplorerFeatures"
   models-client-scope="Pca0VariabilityExplorerProducts"></pca0-show-variability>
</aw-panel-body>
    <aw-panel-footer>
        <aw-button action="addVariabilityOrLoadFeaturesFromServer" enable-when="conditions.selectedVariabilityChanged">
            {{i18n.addButtonTitle}}
        </aw-button>
    </aw-panel-footer>
</aw-command-panel>
