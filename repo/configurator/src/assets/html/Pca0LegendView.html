<!-- Image/Icon + label-->
<aw-panel-body class="aw-cfg-tooltipLegendPanel aw-layout-flexRowContainer"
    exist-when="['ConfigurationModuleTreeHeader', 'SelectionSummaryDialogTreeHeader'].includes(subPanelContext.legendType)">
    <div aw-repeat="legendItem: subPanelContext.legendItems" class="aw-clsadmin-objectNamesList">
        <!-- padding-bottom: 5px-->
        <div class="sw-flex-row">
            <aw-icon class="aw-cfg-LegendImage" icon-id="{{legendItem.icon}}"></aw-icon>
            <label class="aw-cfg-tooltipLegendLabel" title="{{legendItem.label}}">{{legendItem.label}}</label>
        </div>
    </div>
</aw-panel-body>

<!--Constraints header Or Non-Gridable Expression Tooltip or Selection Summary Selection count tooltip-->
<div class="aw-extended-tooltipTitle" exist-when="conditions.containsLegendItemsInTooltip">
    <!-- font-weight: 600;-->
    <div class="sw-column w-12">
        <div aw-repeat="legendItem : subPanelContext.legendItems">
            <aw-label prop="legendItem"></aw-label>
        </div>
    </div>
</div>

<!--Matrix LOV legend-->
<div exist-when="subPanelContext.legendType === 'MatrixLOVLegend' "
    aw-repeat="legendItem : subPanelContext.legendItems">
    <div class="aw-cfg-matrixLegendItemContainer">
        <div class="sw-column h-12 aw-cfg-matrixLegendKeyElementStyle">{{legendItem.legendItemKey}}</div>
        <div class="sw-column h-12">: {{legendItem.legendItemValue}}</div>
        <span class="aw-cfg-matrixLegendSpanElementSeparator" exist-when="legendItem.hasMoreValues">, </span>
    </div>
</div>
