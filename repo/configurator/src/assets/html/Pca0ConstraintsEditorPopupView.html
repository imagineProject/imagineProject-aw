<aw-panel-body scrollable="false" class="h-10">
    <pca0-formula-suggester formula="fields.formula" editor-object="data.editorObject" config-perspective-uid="{{props.subPanelContext.popupOptions.configPerspective}}" ></pca0-formula-suggester>
</aw-panel-body>
<aw-panel-footer class="h-2">
    <aw-button button-type="base" action="closeConstraintsEditorPopup" size="auto" visible-when="data.editorObject.editContext === 'readOnly'">{{i18n.close}}</aw-button>
    <aw-button button-type="accent-mid-contrast" action="StartEditConstraintFormula" size="auto" visible-when="data.editorObject.editContext === 'readOnly'">{{i18n.edit}}</aw-button>
    <aw-button button-type="base" action="cancelConstraintFormulaEditing" size="auto" visible-when="data.editorObject.editContext !== 'readOnly'">{{i18n.cancel}}</aw-button>
    <aw-button button-type="accent-mid-contrast" action="saveConstraintFormula" size="auto" visible-when="data.editorObject.editContext !== 'readOnly'">{{i18n.saveButtonText}}</aw-button>
</aw-panel-footer>
