<div aw-class="[conditions.inVerticalMode ? 'sw-row aw-cfg-variantgridHeaderMaxHeight' : 'sw-column']" >
    <!-- isTreeNavigation: show displayName and column menu icon -->
    <div exist-when="props.column.isTreeNavigation">
        <aw-icon icon-id="cmdMoreVertical24" class="aw-cfg-variantgridHeaderMenuIcon"></aw-icon>
        {props.column.displayName}
    </div>
    <!-- isPropertyColumn: show displayName -->
    <div exist-when="props.column.isPropertyColumn">
        {props.column.displayName}
    </div>

    <!-- SVR column: displayName, status ( complete, incomplete, invalid, icon tooltip (for Violations) -->
    <div aw-class="[conditions.inVerticalMode ? 'sw-column aw-cfg-textEndJustified aw-cfg-variantgridHeaderMaxHeight' : 'sw-row aw-cfg-gridHeaderTextContainer']"
    exist-when="!props.column.isTreeNavigation && !props.column.isPropertyColumn">
        <div class="aw-cfg-gridHeaderText" aw-class="[conditions.inVerticalMode ? 'sw-row aw-cfg-variantgridHeader' : 'sw-column']">
        {props.column.displayName}
        </div>
        <div class="aw-cfg-gridEditorHeaderIcon" exist-when="(conditions.hasCompletnessStatus && (!conditions.InValid || !conditions.hasViolationsToDisplay)) || (conditions.InValid && conditions.hasViolationsToDisplay)">
            <img src="{{data.tooltipInfo.tooltipIconUrl}}" title="{{data.tooltipInfo.tooltipIconText}}" alt="{{data.tooltipInfo.tooltipIconText}}"
            exist-when="conditions.hasCompletnessStatus && (!conditions.InValid || !conditions.hasViolationsToDisplay)" class="aw-cfg-completenessStatus"></img>
            <img src="{{data.tooltipInfo.tooltipIconUrl}}" exist-when="conditions.InValid && conditions.hasViolationsToDisplay" class="aw-cfg-completenessStatus"
            extended-tooltip-context="data.violationMessages" extended-tooltip="data.violationMessagesTT"></img>
        </div>
        <div exist-when="data.tooltipInfo.showExpressionNonGridableTooltip" class="aw-cfg-constraintsGridHeaderIcon">
            <img src="{{data.tooltipInfo.expressionNonGridableTooltipDetails.attentionIconUrl}}" alt="" extended-tooltip-context="data.tooltipInfo"
                extended-tooltip="Pca0NonGridableExpressionTooltip">
            </img>
        </div>
        <div>
            <aw-icon icon-id="cmdMoreVertical24" class="aw-cfg-variantgridHeaderMenuIcon"></aw-icon>
        </div>
    </div>

    <!-- 2nd row for Completness Status as a text - disabled for now until we finalize the UX design-->
    <!-- <div aw-class="[conditions.inVerticalMode ? 'sw-column aw-cfg-textEndJustified' : 'sw-row']">
        <div class="aw-cfg-gridHeaderText"
            aw-class="[
            {'sw-row aw-cfg-variantgridHeader' : conditions.inVerticalMode },
            {'sw-column' : !conditions.inVerticalMode },
            {'aw-cfg-validAndComplete': data.completenessStatus.completenessStatusId === 'ValidAndComplete'},
            {'aw-cfg-inValid': data.completenessStatus.completenessStatusId === 'InValid'},
            {'aw-cfg-validAndIncomplete': data.completenessStatus.completenessStatusId === 'ValidAndInComplete'} ]">
        {{data.completenessStatus.completenessStatusLabel}}
        </div>
    </div>  -->
</div>
