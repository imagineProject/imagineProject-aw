
<aw-panel-section caption="i18n.options">
    <aw-togglebutton prop="data.showCompressedData" action="changeFeatureStyle"></aw-togglebutton>
    <aw-togglebutton prop="data.showGroupsAsTab" action="changeFeatureStyle"></aw-togglebutton>
    <aw-togglebutton prop="data.showFeatureSideBySide" action="changeFeatureStyle"></aw-togglebutton>
    
    <div class="aw-cfg-featureWidth" exist-when="data.showFeatureSideBySide.dbValue">
        <aw-radiobutton prop="data.featureWidth" list="data.featureWidthValues.dbValue" action="changeFeatureStyle"></aw-radiobutton>
    </div>
</aw-panel-section>
