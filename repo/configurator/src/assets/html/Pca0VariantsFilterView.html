<aw-command-panel caption="i18n.filters" context="subPanelContext">
    <div exist-when="conditions.showSelectedFilterChips">
        <div class="sw-row aw-layout-wrap" visible-when="conditions.showFeaturesFilterCategoryChip">
            <aw-label prop="data.selectedFilters"></aw-label>
            <aw-chip chip="props.subPanelContext.searchState.featuresFilterChipData" ui-icon-action="removeFeaturesFilter"></aw-chip>
            <aw-button class='small' aw-class="{'disabled': data.disabledButtonChk.dbValue}" button-type='chromeless' action="clearFilters">{i18n.clear}</aw-button>
        </div>
    </div>
    <aw-separator exist-when="conditions.showSelectedFilterChips" class="aw-cfg-constraintsFilterPanelSeparator" visible-when="conditions.showFeaturesFilterCategoryChip"></aw-separator>
    <aw-panel-body>
        <pca0-variability-filter sub-panel-context="props.subPanelContext" exist-when="!conditions.showFeatureSelectorView"></pca0-variability-filter>
        <div class="sw-column" exist-when="conditions.showFeatureSelectorView">
            <aw-navigate-panel title="i18n.advancedFeatureSelector" pre-panel-id="Pca0VariantsFilter" panel-id="Pca0SelectFeaturesSubPanel" sub-panel-context="{selectionData : props.subPanelContext.searchState.selectionData,
                    selectedVariability : props.subPanelContext.searchState.selectedVariability}" action="navigateToSubView"></aw-navigate-panel>
        </div>
    </aw-panel-body>
    <aw-panel-footer exist-when="!conditions.showFeatureSelectorView">
        <aw-button action="applyVariantsFilter" enable-when="conditions.enableFilterApply">
            {i18n.filter}
        </aw-button>
    </aw-panel-footer>
</aw-command-panel>
