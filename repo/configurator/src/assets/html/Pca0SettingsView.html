<aw-command-panel name="Pca0SettingsPanel" caption="i18n.settings" context="subPanelContext">
    <div class="aw-layout-flexColumn" show-when="data.activeView ==='Pca0SettingsContent'">
        <pca0-settings-content sub-panel-context="{ ...props.subPanelContext}" />
    </div>
    <div class="aw-layout-flexColumn" exist-when="data.activeView ==='Pca0DateRangeEffectivityCommandSub'">
        <aw-navigate-panel title="i18n.effectivity" pre-panel-id="Pca0SettingsContent"
            panel-id="Pca0DateRangeEffectivityCommandSub" action="setActiveView"
            sub-panel-context="{ contextKey: 'fscContext'}">
        </aw-navigate-panel>
    </div>
    <div class="aw-layout-flexColumn" exist-when="data.activeView ==='Pca0RuleDateSub'">
        <aw-navigate-panel title="i18n.ruleDateSubPanelTitle" pre-panel-id="Pca0SettingsContent"
            panel-id="Pca0RuleDateSub" action="setActiveView" sub-panel-context="{ contextKey: 'fscContext'}">
        </aw-navigate-panel>
    </div>
    <div class="aw-layout-flexColumn" exist-when="ctx.showFileUploadPanel===true">
</aw-command-panel>
