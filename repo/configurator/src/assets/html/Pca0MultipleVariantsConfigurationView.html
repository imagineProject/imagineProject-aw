<aw-panel-body>
    <div class="sw-row flex-shrink">
        <aw-server-visibility-toolbar id="MultiSvrEditorToolbar" first-anchor="aw_altPWADisplay,aw_variantConfigurationGridCommandBar,aw_MultiSVREditorCommandBar" second-anchor="aw_toolbarRight,aw_fullScreen,aw_MultiSVREditorCommandBarRight"
        context="{fscState: props.subPanelContext.fscstate, variantRuleData: props.subPanelContext.variantRuleData, variabilityProps: data.variabilityProps, gridSettings: props.subPanelContext.gridSettings, displayMode: data.displayMode, singleSVRViewMode: props.subPanelContext.singleSVRViewMode, hasSplitColumns: data.postProcessSuccessful.hasSplitColumns, ...props.subPanelContext}"
        exist-when="!conditions.isVCVOpenedFromConfigurator"></aw-server-visibility-toolbar>
    </div>
    <aw-guidance-message class="aw-cfg-variantgridGuidanceMessage" message="defaultGridEditModeMessage" closable="false" banner-style="true" show-icon="true" show-type="false"  exist-when="!conditions.isVCVOpenedFromConfigurator">
        <aw-button action="handleCancel" exist-when="!conditions.isVariantTableNotEditing">
            <aw-i18n>i18n.reset</aw-i18n>
        </aw-button>
    </aw-guidance-message>
    <div class="sw-row flex-shrink">
        <aw-server-visibility-toolbar id="MultiSvrEditorToolbar" first-anchor="aw_MultiSVREditorCommandBar"
            second-anchor="aw_MultiSVREditorCommandBarRight"
            context="{ variabilityProps: data.variabilityProps, gridSettings: props.subPanelContext.gridSettings, displayMode: data.displayMode, singleSVRViewMode: props.subPanelContext.singleSVRViewMode, hasSplitColumns: data.postProcessSuccessful.hasSplitColumns, ...props.subPanelContext }"
            orientation="HORIZONTAL" exist-when="conditions.isVCVOpenedFromConfigurator">
        </aw-server-visibility-toolbar>
    </div>
    <div class="sw-row aw-cfg-topTreeHeight" id="multipleVariantsConfigurationGridContainer">
        <div class="sw-column w-12 aw-cfg-multiSVRGrid">
            <aw-splm-table gridid="multipleVariantsConfigGrid" command-context="{ dirtyColumns: data.variabilityProps.dirtyElements, copiedFromColUid: data.copiedFromColUid, displayMode: data.displayMode, ...props.subPanelContext }" use-tree="true">
            </aw-splm-table>
        </div>
    </div>
</aw-panel-body>
