<div aw-class="[conditions.inVerticalMode ? 'sw-row aw-cfg-variantgridHeaderMaxHeight' : 'sw-column']" >
    <!-- isTreeNavigation: show displayName and column menu icon -->
    <div exist-when="props.column.isTreeNavigation">
        <aw-icon icon-id="cmdMoreVertical24" class="aw-cfg-variantgridHeaderMenuIcon"></aw-icon>
        {props.column.displayName}
    </div>
    <!-- isSplitColumn: show column menu icon -->
    <div exist-when="props.column.isSplitColumn">
        <div className="sw-widget-iconContainer">
            <aw-icon icon-id="cmdMoreVertical24" class="aw-cfg-variantgridHeaderMenuIcon"></aw-icon>
        </div>
    </div>
    <!-- isPropertyColumn: show displayName -->
    <div exist-when="props.column.isPropertyColumn">
        {props.column.displayName}
    </div>

    <!-- Constraint Rule column: show displayName, icon tooltip (if needed) and column menu icon-->
    <div aw-class="[conditions.inVerticalMode ? 'sw-column aw-cfg-constraintsDisplayName aw-cfg-variantgridHeaderMaxHeight' : 'sw-row aw-cfg-constraintsGridHeaderTextContainer']"
        exist-when="!props.column.isTreeNavigation && !props.column.isSplitColumn && !props.column.isPropertyColumn">
        <div class="aw-cfg-constraintsGridHeaderText" aw-class="[conditions.inVerticalMode ? 'sw-row aw-cfg-variantgridHeader' : 'sw-column']">
            {props.column.displayName}
        </div>
        <div exist-when="data.tooltipInfo.showTooltip" class="aw-cfg-constraintsGridHeaderIcon">
            <img src="{{data.tooltipInfo.tooltipIconUrl}}" alt="" extended-tooltip-context="data.tooltipInfo.extTooltipDetails"
                extended-tooltip="Pca0Legend">
            </img>
        </div>
        <div exist-when="data.tooltipInfo.showExpressionNonGridableTooltip" class="aw-cfg-constraintsGridHeaderIcon">
            <img src="{{data.tooltipInfo.expressionNonGridableTooltipDetails.attentionIconUrl}}" alt="" extended-tooltip-context="data.tooltipInfo"
                extended-tooltip="Pca0NonGridableExpressionTooltip">
            </img>
        </div>
        <div aw-class="[conditions.inVerticalMode ? 'sw-row' : 'sw-column']" exist-when="data.constraintType.parentAbstractClass === 'Cfg0AbsMatrixRule' && data.violationsInColumn">
            <img class="aw-cfg-constraintsGridHeaderIcon" alt="i18n.error"
                src="{{data.errorIconUrl}}" extended-tooltip-context="data.violationTooltipDetails"
                extended-tooltip="Pca0VariantColumnExtTooltip"></img>
        </div>
        <div className="sw-widget-iconContainer">
            <aw-icon icon-id="cmdMoreVertical24" class="aw-cfg-variantgridHeaderMenuIcon"></aw-icon>
        </div>
    </div>

    <!-- 2nd row for Constraint Rule column and Violations-->
    <div aw-class="[conditions.inVerticalMode ? 'sw-column aw-cfg-constraintsDisplayName' : 'sw-row']">
        <div class="aw-cfg-constraintsGridHeaderText"
            exist-when="!props.column.isTreeNavigation && !props.column.isSplitColumn && !props.column.isPropertyColumn"
            aw-class="[
            {'sw-row aw-cfg-variantgridHeader' : conditions.inVerticalMode },
            {'aw-cfg-constraintsRuleAndViolation' : conditions.inVerticalMode && !data.violationsInColumn && data.tooltipInfo.showTooltip },
            {'sw-column' : !conditions.inVerticalMode },
            {'aw-cfg-inclusionRule': data.constraintType.parentAbstractClass === 'Cfg0AbsIncludeRule'},
            {'aw-cfg-exclusionRule': data.constraintType.parentAbstractClass === 'Cfg0AbsExcludeRule'},
            {'aw-cfg-exceptionRule': data.constraintType.parentAbstractClass === 'Cfg0AbsExceptionRule'},
            {'aw-cfg-availabilityRule': data.constraintType.parentAbstractClass === 'Cfg0AbsAvailabilityRule'},
            {'aw-cfg-defaultRule': data.constraintType.parentAbstractClass === 'Cfg0AbsDefaultRule'} ]">
            {{data.constraintType.propDisplayValue}}
        </div>
        <div aw-class="[conditions.inVerticalMode ? 'sw-row' : 'sw-column']" exist-when="data.constraintType.parentAbstractClass !== 'Cfg0AbsMatrixRule' && data.violationsInColumn">
            <img aw-class="[conditions.inVerticalMode ? 'aw-cfg-constraintsGridHeaderIcon aw-cfg-constraintsGridVerticalHeaderViolationIcon' : 'aw-cfg-constraintsGridHeaderViolationIcon']" alt="i18n.error"
                src="{{data.errorIconUrl}}" extended-tooltip-context="data.violationTooltipDetails"
                extended-tooltip="Pca0VariantColumnExtTooltip"></img>
        </div>
    </div>
</div>
