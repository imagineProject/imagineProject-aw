<div class="sw-row">
    <div class="sw-column">
        <aw-command-bar anchor="aw_SummaryCommandBar" alignment="HORIZONTAL" overflow='true' context="{fscState: props.summarystate}"></aw-command-bar>
    </div>
    <aw-separator is-vertical="true" exist-when="conditions.isProductHierarchyDepth"></aw-separator>
    <div class="sw-column aw-cfg-summaryBreadcrumb" exist-when="conditions.showModuleHierarchyBreadcrumb">
        <aw-navigate-breadcrumb crumbs="data.crumbs"></aw-navigate-breadcrumb>
    </div>
    <aw-separator is-vertical="true" exist-when="conditions.showModuleHierarchyBreadcrumb"></aw-separator>
    <div class="sw-column aw-cfg-showIndicator">
        <div class="sw-row">
            <div exist-when="data.variantsSectionExpand">
                <!-- we need to keep 2 chips around as the FSC in variants tab shouls not contain a removal button -->
                <aw-chip-list dataprovider="data.dataProviders.variantRuleChipWithRemoveButtonDataProvider" exist-when="conditions.showRemoveSavedVariants && !conditions.isExpressionNonGridable" ui-icon-action="removeSavedVariants"></aw-chip-list>
                <aw-chip-list dataprovider="data.dataProviders.variantRuleChipWithoutRemoveButtonDataProvider" exist-when="!conditions.showRemoveSavedVariants && !conditions.isExpressionNonGridable" ></aw-chip-list>
                <!-- In case of non-gridable expression, show the following chips ( which are similar to above, but with different icon + tooltip )-->
                <aw-chip-list dataprovider="data.dataProviders.variantRuleChipWithRemoveButtonDataProvider" exist-when="conditions.showRemoveSavedVariants && conditions.isExpressionNonGridable" ui-icon-action="removeSavedVariants" extended-tooltip="data.nonGridableExpressionDetailsTooltipView" extended-tooltip-context="data.nonGridableExpressionTooltipInfo"></aw-chip-list>
                <aw-chip-list dataprovider="data.dataProviders.variantRuleChipWithoutRemoveButtonDataProvider" exist-when="!conditions.showRemoveSavedVariants && conditions.isExpressionNonGridable" extended-tooltip="data.nonGridableExpressionDetailsTooltipView" extended-tooltip-context="data.nonGridableExpressionTooltipInfo"></aw-chip-list>
            </div>
            <div>
                <aw-chip chip="data.validAndIncompletenessStatusChipData" exist-when="conditions.ValidAndInComplete" button-type="caution" class="aw-cfg-completenessStatus" extended-tooltip="data.completenessStatusTooltip" extended-tooltip-context="data.completenessStatusValidAndInComplete" action="openSelectionSummaryFromChip"></aw-chip>
                <aw-chip chip="data.validAndCompletenessStatusChipData" exist-when="conditions.ValidAndComplete" button-type="positive" class="aw-cfg-completenessStatus" extended-tooltip="data.completenessStatusTooltip" extended-tooltip-context="data.completenessStatusValidAndComplete" action="openSelectionSummaryFromChip"></aw-chip>
                <aw-chip chip="data.invalidStatusChipData" button-type="negative" exist-when="conditions.InValid" class="aw-cfg-completenessStatus" extended-tooltip="data.violationMessagesTT" extended-tooltip-context="data.violationMessages" action="openSelectionSummaryFromChip"></aw-chip>
            </div>
        </div>
    </div>
</div>
