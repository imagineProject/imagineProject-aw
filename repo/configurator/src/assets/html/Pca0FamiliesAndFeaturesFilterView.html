<div class="sw-row aw-layout-wrap">
    <div class="sw-column w-8">
        <aw-widget prop="data.featureNamesList" action="updateStateForUnreferencedFiltering"></aw-widget>
    </div>
    <div class="sw-column justify-center">
        <aw-link prop="data.advancedFeatureSelectorLink" action="setSelectionsInPickAndChooseGrid"></aw-link>
    </div>
</div>
<br />
<aw-radiobutton enable-when="conditions.multipleFeatureFacetsSelected" prop="data.operationRadioProp"
    list="data.operationRadioPropValues.dbValue" action="handleAndOrSelectionChange"></aw-radiobutton>
<aw-label prop="data.selectionsLabel" exist-when="conditions.enableFilterApply"></aw-label>
<pca0-filter-category-content exist-when="conditions.enableFilterApply" category="props.subPanelContext.searchState.featuresFilterCategory"
    sub-panel-context="{...props.subPanelContext}"></pca0-filter-category-content>
