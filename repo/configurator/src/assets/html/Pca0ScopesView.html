<aw-panel-body scrollable="false" exist-when="!conditions.showTabAsGroup && !conditions.showCompressedData">
    <aw-list-filter exist-when="conditions.isfilterBoxVisible" prop="data.filterBox" dataprovider="data.dataProviders.scopesListDataProvider" show-decorators="false">
        <aw-default-cell vmo="item"></aw-default-cell>
    </aw-list-filter>
    <aw-list exist-when="!conditions.isfilterBoxVisible" dataprovider="data.dataProviders.scopesListDataProvider">
        <aw-default-cell vmo="item"></aw-default-cell>
    </aw-list>
</aw-panel-body>
<aw-panel-body scrollable="false" exist-when="!conditions.showTabAsGroup && conditions.showCompressedData">
    <aw-list-filter exist-when="conditions.isfilterBoxVisible" prop="data.filterBox" dataprovider="data.dataProviders.scopesListDataProvider" show-decorators="false">
        <aw-default-cell-content vmo="item"></aw-default-cell-content>
    </aw-list-filter>
    <aw-list exist-when="!conditions.isfilterBoxVisible" dataprovider="data.dataProviders.scopesListDataProvider">
        <aw-default-cell-content vmo="item"></aw-default-cell-content>
    </aw-list>
</aw-panel-body>
<aw-tab-bar tabs="data.scopeInfo.scopesList" max-tab-width="250px" tab-selection-data="data.selectedTab" exist-when="conditions.showTabAsGroup"></aw-tab-bar>
