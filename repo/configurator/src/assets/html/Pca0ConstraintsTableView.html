<!-- It will exist when revision rule set by pca0VariabilityExplorerHeaderView in configurator context-->
<aw-column width="fill">
    <aw-guidance-message message="selectedConstraintsMessage" closable="true" banner-style="true" show-icon="true" show-type="false" visible-when="conditions.Pca0IsCfgSelectedItemsOnPage" >
        <aw-button action="constraintsTableRefreshCommandBatchAction">{{i18n.refresh}}</aw-button>
    </aw-guidance-message>
    <aw-splm-table gridid="pca0ConstraintsGrid"
        exist-when="!conditions.showEmptyWorkarea" use-tree="false"
        show-decorators="false" show-check-box="subPanelContext.showCheckBox">
    </aw-splm-table>
    <aw-empty-workarea
        exist-when="conditions.showEmptyWorkarea"
        image="graEmptyProductConfigurator128"
        title="i18n.emptyWorkAreaTitle"
        hint="i18n.showNoConstraintsHint"
        command-id="Pca0ConstraintsPWATableAdd"
        command-context="{...subPanelContext}"
        link-text="i18n.addCmd">
    </aw-empty-workarea>
</aw-column>
