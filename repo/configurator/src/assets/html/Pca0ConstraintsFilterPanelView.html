<aw-command-panel caption="i18n.filters" context="subPanelContext">
    <div exist-when="conditions.showSelectedFilterChips">
        <div class="sw-row">
            <aw-label prop="data.selectedFilters"></aw-label>
        </div>
        <div class="sw-row aw-layout-wrap">
            <aw-chip visible-when="conditions.showConstraintTypeFilterCategoryChip" chip="props.subPanelContext.searchState.typesFilterChipData" ui-icon-action="removeConstraintTypesFilter"></aw-chip>
            <aw-chip visible-when="conditions.showFeaturesFilterCategoryChip" chip="props.subPanelContext.searchState.featuresFilterChipData" ui-icon-action="removeFeaturesFilter"></aw-chip>
            <aw-chip visible-when="conditions.showUnreferencedConstraintsFilterCategoryChip" chip="props.subPanelContext.searchState.unreferencedConstraintsFilterChipData" ui-icon-action="removeUnreferencedConstraintsFilter"></aw-chip>
            <aw-button class='small' aw-class="{'disabled': data.disabledButtonChk.dbValue}" button-type='chromeless' action="clearFilters">{i18n.clear}</aw-button>
        </div>
    </div>
    <aw-separator exist-when="conditions.showSelectedFilterChips" class="aw-cfg-constraintsFilterPanelSeparator"></aw-separator>
    <aw-panel-body>
        <aw-panel-section exist-when="!conditions.showFeatureSelectorView" caption="i18n.constraintType" name="WorkspaceObject.object_type" toggle-action="toggleConstraintTypeCategoryPanelState" collapsed="{{conditions.constraintTypesPanelCollapsedState}}">
            <pca0-filter-category-content exist-when="conditions.showConstraintTypeFilterCategory" category="props.subPanelContext.searchState.constraintTypeFilterCategory" sub-panel-context="{...props.subPanelContext}"></pca0-filter-category-content>
        </aw-panel-section>
        <pca0-variability-filter sub-panel-context="props.subPanelContext" exist-when="!conditions.showFeatureSelectorView"></pca0-variability-filter>
        <pca0-unreferenced-filter sub-panel-context="props.subPanelContext" exist-when="!conditions.showFeatureSelectorView"></pca0-unreferenced-filter>
        <div class="sw-column" exist-when="conditions.showFeatureSelectorView">
            <aw-navigate-panel title="i18n.advancedFeatureSelector" pre-panel-id="Pca0ConstraintsFilterPanel" panel-id="Pca0SelectFeaturesSubPanel" sub-panel-context="{selectionData : props.subPanelContext.searchState.selectionData,
                    selectedVariability : props.subPanelContext.searchState.selectedVariability}" action="navigateToSubView"></aw-navigate-panel>
        </div>
    </aw-panel-body>
    <aw-panel-footer exist-when="!conditions.showFeatureSelectorView">
        <aw-button action="applyConstraintsFilter" enable-when="conditions.enableFilterApply">
            {i18n.filter}
        </aw-button>
    </aw-panel-footer>
</aw-command-panel>
