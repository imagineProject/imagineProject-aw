<aw-tab-set exist-when="data.tabModels" tabs="data.tabModels">
    <aw-panel-body visible-when="conditions.showFeatures">
        <pca0-variability-picker
            sub-panel-context="{ ...subPanelContext, tabKey : data.selectedTab.tabKey,
            showMultiSelectOnLoad: 'true', selectionModel: selectionModels.variabilitySelectionModel }"
            selection-data="props.selectionData"
            selected-variability="props.selectedVariability"
            selected-families="props.selectedFamilies"
            display-properties="props.displayProperties"
            client-scope="{{props.featureClientScope}}"
            config-perspective="props.configPerspective">
        </pca0-variability-picker>
    </aw-panel-body>
    <aw-panel-body visible-when="conditions.showModels">
        <pca0-variability-picker
            sub-panel-context="{ ...subPanelContext, tabKey : data.selectedTab.tabKey,
            showMultiSelectOnLoad: 'true', selectionModel: selectionModels.variabilitySelectionModel }"
            selection-data="props.selectionData"
            selected-variability="props.selectedVariability"
            selected-families="props.selectedFamilies"
            display-properties="props.displayProperties"
            client-scope="{{props.modelsClientScope}}"
            config-perspective="props.configPerspective">
        </pca0-variability-picker>
    </aw-panel-body>
</aw-tab-set>
