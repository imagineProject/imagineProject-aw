<aw-command-panel caption="i18n.cmdLoadSavedVariantsTitle" context="subPanelContext">
    <aw-panel-header>
        <div>
            <aw-column width="5f">
                <aw-property-label prop="data.searchByLabel"></aw-property-label>
            </aw-column>
            <aw-column width="fill">
                <aw-link-with-popup-menu prop="data.searchCriteriaLink" dataprovider="data.dataProviders.searchCriteriaProvider" link-popup-menu-id="searchCriteriaLink"></aw-link-with-popup-menu>
            </aw-column>
        </div>
    </aw-panel-header>
    <aw-panel-body>
        <aw-tab-set tabs="data.tabsModel.dbValue" tab-set-id="Pca0LoadSVRSearchTab">
            <aw-command-sub-panel panel-id="Pca0LoadSVRSearchInputTab" visible-when="conditions.showInputPage" sub-panel-context="{...data.tabData, popupId: props.subPanelContext.popupOptions.popupId, searchState: data.searchState, advancedSearchState: data.advancedSearchState, ootbSavedQueryUID: data.ootbSavedQueryUID, formula: data.formula, editorObject: data.editorObject, ...props.subPanelContext }"></aw-command-sub-panel>
            <aw-command-sub-panel panel-id="Pca0LoadSVRSearchResultsTab" visible-when="conditions.showResultsPage" sub-panel-context="{...props.subPanelContext, searchCriteriaObj: data.searchCriteriaObj, searchState: data.searchState, advancedSearchState: data.advancedSearchState, ootbSavedQueryUID: data.ootbSavedQueryUID, formula: data.formula}"></aw-command-sub-panel>
        </aw-tab-set>
    </aw-panel-body>
    <aw-panel-footer class="sw-column">
        <div class="sw-row sw-component" exist-when=" !conditions.isTreeMode && conditions.showLoadButton">
            <div class="sw-column demo-w-3f">
                <aw-pic exist-when="!conditions.areMultipleItemsSelected" class="aw-widget-thumbnail" icon-id="data.indicatorInfo"></aw-pic>
                <aw-pic exist-when="conditions.areMultipleItemsSelected" class="aw-widget-thumbnail" icon-id="data.indicatorWarning"></aw-pic>
            </div>
            <div class="sw-column">
                <span>
                    <aw-i18n class="svr-selection-msg" exist-when="!conditions.areMultipleItemsSelected">i18n.singleSVRSelectionMsg</aw-i18n>
                    <aw-i18n class="svr-selection-msg" exist-when="conditions.areMultipleItemsSelected">i18n.multipleSVRSelectionMsg</aw-i18n>
                </span>

            </div>
        </div>
        <div class="sw-row sw-component" exist-when=" !conditions.isTreeMode && conditions.showLoadButton && conditions.showLoadInGuidedModeMessage">
            <div class="sw-column demo-w-3f">
                <aw-pic class="aw-widget-thumbnail" icon-id="data.indicatorInfo"></aw-pic>
            </div>
            <div class="sw-column">
                  <span>
                    <aw-i18n class="svr-selection-msg">i18n.loadInGuidedModeMsg</aw-i18n>
                </span>
            </div>
        </div>
        <div class="sw-row sw-component" exist-when="conditions.isTreeMode && conditions.showLoadButton">
            <aw-checkbox prop="data.appendSVRElement">
            </aw-checkbox>
        </div>

        <div class="sw-row sw-component">
            <!-- this is the checkbox to allow/disallow loading in guided mode. -->
            <div class="sw-column w-6">
                <aw-checkbox exist-when="conditions.showLoadButton && !conditions.isTreeMode && conditions.isGuidedMode" prop="data.loadInManualMode" enable-when="!conditions.areMultipleItemsSelected">
                </aw-checkbox>
            </div>
            <div class="sw-column w-6 sw-button-group justify-right align-right">
                <aw-button action="loadSavedVariantsBatch" visible-when="conditions.showLoadButton && !conditions.isDirty">
                    <aw-i18n>i18n.load</aw-i18n>
                </aw-button>
                <aw-button action="showConfirmationMessageForLoad" visible-when="conditions.showLoadButton && conditions.isDirty">
                    <aw-i18n>i18n.load</aw-i18n>
                </aw-button>
            </div>
        </div>
    </aw-panel-footer>
</aw-command-panel>
