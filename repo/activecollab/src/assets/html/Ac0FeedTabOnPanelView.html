<aw-flex-row height="4f" exist-when="!conditions.inProductGalleryLocation && !conditions.isSnapshotSelected || conditions.isSnapshotSelected && conditions.hasNoDiscussions ">
    <aw-flex-column width="4" justify="center" align-content="stretch">
        <aw-command-bar context="{sharedData: props.subPanelContext.sharedData}" anchor="ac0_onObjectTabNewCmd" alignment="HORIZONTAL"></aw-command-bar>
    </aw-flex-column>
</aw-flex-row>
<aw-panel-body>
    <aw-list
        visible-when="!data.dataProviders.conversationDataProvider.noResults"
        dataprovider="data.dataProviders.conversationDataProvider" class="aw-activecollab-shadow">
        <ac0-discussion-tile conv-item="{discussionItem: item}" shared-data-obj='{sharedData: props.subPanelContext.sharedData}' contents="{switch: { meta: { showMeta: true, clickableLinks: true }, showDetails: true, showList: true, showReply: true, showActions: true, showMoreCommands: subPanelContext.showMoreCommands, showMoreCommentCommands: true } }"></ac0-discussion-tile>
    </aw-list>
    <aw-empty-workarea
        visible-when="data.dataProviders.conversationDataProvider.noResults"
        image="graEmptyDiscussion" title="i18n.emptyStateOnObjectPanel"
        hint="i18n.emptyStateOnObjectHostedLocation">
    </aw-empty-workarea>
</aw-panel-body>
