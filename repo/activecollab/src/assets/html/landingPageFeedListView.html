<aw-panel-body>
    <aw-list
        visible-when="!data.dataProviders.conversationDataProvider.noResults"
        dataprovider="data.dataProviders.conversationDataProvider" class="aw-activecollab-shadow">
        <ac0-discussion-tile conv-item="{discussionItem: item}" shared-data-obj='{sharedData: data.sharedData}' contents="{switch: { meta: { showMeta: true, clickableLinks: true }, showDetails: true, showList: true, showReply: true, showActions: true, showMoreCommands: false, showMoreCommentCommands: true } }"></ac0-discussion-tile>
    </aw-list>
    <aw-empty-workarea
        visible-when="data.dataProviders.conversationDataProvider.noResults"
        image="graEmptyDiscussion" title="i18n.emptyStateOnObjectPanel"
        hint="i18n.emptyStateFeedTrackedPrimary">
    </aw-empty-workarea>
</aw-panel-body>
