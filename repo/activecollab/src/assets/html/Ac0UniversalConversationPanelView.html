<aw-command-panel caption="i18n.conversation" context="subPanelContext" hide-title="conditions.isHostedComponent">
    <aw-command-sub-panel panel-id="Ac0UnivConvPanelSub" exist-when="data.sharedData.value.activeView === 'Ac0UnivConvPanelSub'" sub-panel-context='{sharedData:data.sharedData, selectionData:props.subPanelContext.selectionData, occmgmtContext:props.subPanelContext.occContext ? props.subPanelContext.occContext : subPanelContext.occmgmtContext, subpanelCtx: props.subPanelContext}'></aw-command-sub-panel>

    <aw-navigate-panel title="i18n.newDiscussion" exist-when="data.sharedData.value.activeView === 'Ac0CreateNewCollabObj' && !conditions.isEditDiscussion && !conditions.hideDiscussionBackButton" panel-id='Ac0CreateNewCollabObj' sub-panel-context='{sharedData: data.sharedData, selectionData:props.subPanelContext.selectionData, createNewConversation: true, occmgmtContext:props.subPanelContext.occContext ? props.subPanelContext.occContext : subPanelContext.occmgmtContext, subpanelCtx: props.subPanelContext}' action='backToDiscussionsAction'>
    </aw-navigate-panel>
    <!--Hide Disucsion back button in Create Panel in Disucussion Location-->
    <aw-command-sub-panel title="i18n.newDiscussion" exist-when="data.sharedData.value.activeView === 'Ac0CreateNewCollabObj' && !conditions.isEditDiscussion && conditions.hideDiscussionBackButton" panel-id='Ac0CreateNewCollabObj' sub-panel-context='{sharedData: data.sharedData, selectionData:props.subPanelContext.selectionData, createNewConversation: true, occmgmtContext:props.subPanelContext.occContext ? props.subPanelContext.occContext : subPanelContext.occmgmtContext, subpanelCtx: props.subPanelContext}'>
    </aw-command-sub-panel>

    <aw-navigate-panel title="i18n.editHeaderDiscussion" exist-when="data.sharedData.value.activeView === 'Ac0CreateNewCollabObj' && conditions.isEditDiscussion && !conditions.hideDiscussionBackButton" panel-id='Ac0CreateNewCollabObj' sub-panel-context='{sharedData: data.sharedData, selectionData:props.subPanelContext.selectionData, createNewConversation: true, occmgmtContext:props.subPanelContext.occContext ? props.subPanelContext.occContext : subPanelContext.occmgmtContext, subpanelCtx: props.subPanelContext}' action='backToDiscussionsAction'>
    </aw-navigate-panel>
    <!--Hide Disucsion back button in Edit Panel in Disucussion Location-->
    <aw-command-sub-panel title="i18n.editHeaderDiscussion" exist-when="data.sharedData.value.activeView === 'Ac0CreateNewCollabObj' && conditions.isEditDiscussion && conditions.hideDiscussionBackButton" panel-id='Ac0CreateNewCollabObj' sub-panel-context='{sharedData: data.sharedData, selectionData:props.subPanelContext.selectionData, createNewConversation: true, occmgmtContext:props.subPanelContext.occContext ? props.subPanelContext.occContext : subPanelContext.occmgmtContext, subpanelCtx: props.subPanelContext}'>
    </aw-command-sub-panel>

    <aw-navigate-panel title="i18n.addSource"  exist-when="data.sharedData.value.activeView === 'Ac0AddSourceObjectsSub'" panel-id='Ac0AddSourceObjectsSub' sub-panel-context='{sharedData:data.sharedData}' action='backToCreateAction'>
    </aw-navigate-panel>
    <aw-navigate-panel title="i18n.discussPanelUpdatePanelSelectedObject"  exist-when="data.sharedData.value.activeView === 'Ac0UpdateOnObjSelectedObjSub'" panel-id='Ac0UpdateOnObjSelectedObjSub' sub-panel-context='{sharedData: data.sharedData, panelData: props.subPanelContext}' action='backToDiscussionsAction'>
    </aw-navigate-panel>
    <aw-navigate-panel title="i18n.addParticipant" exist-when="data.sharedData.value.activeView === 'AwPeoplePicker'"
    panel-id="AwPeoplePicker" sub-panel-context="{ ...subPanelContext, sharedData:data.sharedData, addUserPanelState : data.addUserPanelState }" action='backToCreateAction'>
    </aw-navigate-panel>
    <aw-navigate-panel title='i18n.editProductSnapshot' exist-when="data.sharedData.value.activeView === 'ProductSnapshotEditSub'" panel-id='ProductSnapshotEditSub' sub-panel-context='{...subPanelContext, viewId:props.viewId, snapshotPanelData:data.sharedData}' action='backToCreateAction'>
    </aw-navigate-panel>
</aw-command-panel>
