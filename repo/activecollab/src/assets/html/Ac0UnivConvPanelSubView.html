<aw-tab-set tabs="data.tabsModel.dbValue" >
</aw-tab-set>
<aw-panel-body scrollable="true">
    <ac0-panel-on-object-tab exist-when="data.selectedTab.tabKey==='Ac0PanelOnObjectTab'" object-tab-data='{objData: props.subPanelContext, occmgmtContext:props.subPanelContext.occmgmtContext, subPanelContext:props.subPanelContext.subpanelCtx}'></ac0-panel-on-object-tab>
    <ac0-feed-tab-on-panel exist-when="data.selectedTab.tabKey==='feedList'" sub-panel-context='{showMoreCommands: true, sharedData:props.subPanelContext.sharedData, selectionData:props.subPanelContext.selectionData, selectedTab: data.selectedTab.tabKey}'></ac0-feed-tab-on-panel>
</aw-panel-body>
