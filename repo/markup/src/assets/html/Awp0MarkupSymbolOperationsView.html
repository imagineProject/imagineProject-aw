<aw-panel-header>
    <div class="sw-column">
        <div class="sw-row" justify="left">
            <aw-command-bar anchor="aw_markupSymbolOperationsCommands" alignment="HORIZONTAL"></aw-command-bar>
        </div>
    </div>
</aw-panel-header>
<aw-panel-body>
    <div>
        <aw-textbox prop="data.symbolFilter" action="filterSymbols"></aw-textbox>
        <aw-listbox prop="data.sizeValue" list="data.sizeList.dbValue" action="symbolSizeChanged"></aw-listbox>
        <aw-markup-symbol prop="data.sizeValue" list="data.symbolList" draggable="true" selectable="single" action="getSelectedSymbolDetails"></aw-markup-symbol>
    </div>
</aw-panel-body>
<aw-panel-footer>
</aw-panel-footer>
