<aw-panel-header>
    <aw-tab-set tabs="data.tabsModel.dbValue"></aw-tab-set>
    <aw-textbox class="sw-noDirtyStyle aw-markup-find" prop="data.filterBox" action="filterEntered"></aw-textbox>
</aw-panel-header>
<aw-panel-body>
    <aw-list visible-when="!data.dataProviders.visibleMarkups.noResults"
        show-drop-area="false" dataprovider="data.dataProviders.visibleMarkups">
        <aw-markup-cell vmo="item"></aw-markup-cell>
    </aw-list>
    <aw-empty-workarea visible-when="data.dataProviders.visibleMarkups.noResults && data.filterBox.dbValue"
        image="graEmptySearch" title="i18n.noResultsFound" hint="i18n.noResultsFoundHint">
    </aw-empty-workarea>
    <aw-empty-workarea visible-when="data.dataProviders.visibleMarkups.noResults && !data.filterBox.dbValue"
        image="graEmptyGeneric" title="i18n.noMarkups" hint="i18n.noMarkupsHint">
    </aw-empty-workarea>
</aw-panel-body>
