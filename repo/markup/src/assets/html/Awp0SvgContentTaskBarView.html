
<div class="sw-row aw-taskbar-container afx-accent-background aw-layout-fill"  exist-when="subPanelContext.subLocationTabCond.currentTab === 'SvgEdit'">
    <div class="sw-column flex-auto">
        <div class='sw-row sw-button-group sw-button-wrapper justify-left' exist-when="subPanelContext.subLocationTabCond.currentTab === 'SvgEdit'">
            <div class='sw-row sw-button-group justify-right align-right w-12' exist-when="subPanelContext.subLocationTabCond.currentTab === 'SvgEdit'">
                <aw-button action="showWarningOnCancelSvgEdit">{{i18n.cancel}}</aw-button>
                <aw-button enable-when="ctx.saveSvgButtonState" action="saveSVGContent">{{i18n.save}}</aw-button>
            </div>
        </div>
    </div>
    <div class="sw-column justify-center" exist-when="subPanelContext.subLocationTabCond.currentTab === 'SvgEdit'">
        <aw-command-bar anchor="toolbarRightSlot" alignment="HORIZONTAL"></aw-command-bar>
    </div>
</div>
