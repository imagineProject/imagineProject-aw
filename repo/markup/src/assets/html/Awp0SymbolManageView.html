<aw-panel-header>
</aw-panel-header>
<aw-panel-body>
    <div>
        <aw-widget prop="data.symbolGroup" enable-when="conditions.atLeastOneSymbolSelected" action="symbolGroupOrNameChanged"></aw-widget>
        <aw-textbox prop="data.symbolUserName" enable-when="conditions.atLeastOneSymbolSelected" visible-when="conditions.userIsAdmin"></aw-textbox>
        <aw-textbox prop="data.symbolName" enable-when="conditions.onlyOneSymbolSelected"></aw-textbox>
        <aw-markup-symbol list="data.symbolList" selectable="multiple" promotable="false" action="manageSymbolSelected"></aw-markup-symbol>
    </div>
</aw-panel-body>
<aw-panel-footer>
    <aw-button show-when="data.modifiable" action="modifySymbols"><aw-i18n>i18n.modify</aw-i18n></aw-button>
</aw-panel-footer>
