<aw-panel-header>
</aw-panel-header>
    <aw-panel-body>
        <aw-command-panel-section caption="i18n.properties" collapsed="false" context="data">
            <aw-textbox prop="data.groupName"></aw-textbox>
        </aw-command-panel-section>
        <aw-command-panel-section caption="i18n.upload" collapsed="false" context="data">
            <aw-file-upload type-filter=".svg" file-change-action="fileChanged" multiple="true" selection-data="data.uploadFileSelectionData"></aw-file-upload>
            <aw-break></aw-break>
            <aw-markup-symbol list="data.fileSymbolList"></aw-markup-symbol>
        </aw-command-panel-section>
        <aw-break></aw-break>
        <aw-command-panel-section caption="i18n.existingSymbol" collapsed="false" context="{data,...subPanelContext}">
            <aw-markup-symbol list="data.symbolList" selectable="multiple" promotable="false" action="manageSymbolSelected"></aw-markup-symbol>
        </aw-command-panel-section>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button size="auto" action="createSymbolGroup" enable-when="formProp.attributes.valid && (data.selectedSymbols || data.uploadable)">
            <aw-i18n>i18n.create</aw-i18n>
        </aw-button>
    </aw-panel-footer>
