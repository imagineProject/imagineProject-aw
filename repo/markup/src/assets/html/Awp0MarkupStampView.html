<aw-panel-header>
    <aw-textbox class="sw-noDirtyStyle aw-markup-find" prop="data.filterStamp" action="filterEntered"></aw-textbox>
</aw-panel-header>
<aw-panel-body>
    <aw-list visible-when="!data.dataProviders.visibleStamps.noResults"
        show-drop-area="false" dataprovider="data.dataProviders.visibleStamps">
        <aw-markup-stamp vmo="item"></aw-markup-stamp>
    </aw-list>
    <aw-empty-workarea visible-when="data.dataProviders.visibleStamps.noResults && data.filterStamp.dbValue"
        image="graEmptySearch" title="i18n.noResultsFound" hint="i18n.noResultsFoundHint">
    </aw-empty-workarea>
    <aw-empty-workarea visible-when="data.dataProviders.visibleStamps.noResults && !data.filterStamp.dbValue"
        image="graEmptyGeneric" title="i18n.noStamps" hint="i18n.noStampsHint">
    </aw-empty-workarea>
</aw-panel-body>
