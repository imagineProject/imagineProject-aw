<aw-panel-header>
    <aw-tab-set tabs="data.tabsSymbolModel.dbValue"></aw-tab-set>
</aw-panel-header>
<aw-panel-body>
    <div exist-when="data.selectedTab.tabKey==='upload'">
        <aw-file-upload type-filter=".svg" file-change-action="fileChanged" multiple="true"></aw-file-upload>
        <aw-break></aw-break>
        <aw-widget prop="data.symbolGroupList"></aw-widget>
        <aw-break></aw-break>
        <aw-markup-symbol list="data.symbolList"></aw-markup-symbol>
    </div>
    <div exist-when="data.selectedTab.tabKey==='manage'">
        <aw-widget prop="data.symbolGroup" enable-when="data.selectedSymbols.length>0" action="symbolGroupOrNameChanged"></aw-widget>
        <aw-textbox prop="data.symbolName" enable-when="data.selectedSymbols.length===1"></aw-textbox>
        <aw-markup-symbol list="data.symbolList" selectable="multiple" action="manageSymbolSelected"></aw-markup-symbol>
    </div>
    <div exist-when="data.selectedTab.tabKey==='apply'">
        <aw-textbox prop="data.symbolFilter" action="filterSymbols"></aw-textbox>
        <aw-listbox prop="data.sizeValue" list="data.sizeList.dbValue" action="symbolSizeChanged"></aw-listbox>
        <aw-markup-symbol prop="data.sizeValue" list="data.symbolList" draggable="true"></aw-markup-symbol>
    </div>
    <div exist-when="data.selectedTab.tabKey==='newGroup'">
      <aw-textbox prop="data.newGroupName"></aw-textbox>
    </div>
</aw-panel-body>
<aw-panel-footer>
    <aw-button action="addNewGroupAction" show-when="data.selectedTab.tabKey==='newGroup' && formProp.attributes.valid"><aw-i18n>i18n.ADD_BUTTON_TITLE</aw-i18n></aw-button>
    <aw-button show-when="data.uploadable" action="uploadSymbols"><aw-i18n>i18n.upload</aw-i18n></aw-button>
    <aw-button show-when="data.modifiable" action="modifySymbols"><aw-i18n>i18n.modify</aw-i18n></aw-button>
    <aw-button show-when="data.deletable" action="deleteSymbols"><aw-i18n>i18n.del</aw-i18n></aw-button>
</aw-panel-footer>
