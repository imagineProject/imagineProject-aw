<div class="aw-layout-flexColumn">
<div class="aw-layout-flexRowContainer aw-layout-alignItemsTop aw-schedulemanager-searchPanel">
    <aw-listbox class="aw-schedulemanager-searchCriteriaList" prop="data.additionalContext" list="data.additionalContextList" action="setSelectedContext" is-select-only="true"></aw-listbox>
    <div class="aw-search-inContentSearchBox" exist-when="false">
        <aw-in-content-search-box class="aw-search-searchBox" prop="data.searchBox" action="doSearchKeepFilter"></aw-in-content-search-box>
    </div>
</div>

<div class="aw-layout-flexbox">
    <aw-splm-table gridid="gridView" show-context-menu="true" show-when="props.subPanelContext.searchState.totalFound > 0"/>
</div>
<div class="aw-base-scrollPanel">
    <aw-empty-workarea
        exist-when="!subPanelContext.searchState.criteria.searchString && (!subPanelContext.searchState.totalFound || subPanelContext.searchState.totalFound === 0) && subPanelContext.provider.emptyWorkareaConfig"
        image="{{subPanelContext.provider.emptyWorkareaConfig.image}}"
        title="{{subPanelContext.provider.emptyWorkareaConfig.title}}"
        hint="{{subPanelContext.provider.emptyWorkareaConfig.hint}}"
        command-id="{{subPanelContext.provider.emptyWorkareaConfig.commandId}}"
        link-visibility="{{!props.viewModel.ctx.awSidenavConfig.globalSidenavContext.aw_navigation.open || props.viewModel.ctx.awSidenavConfig.globalSidenavContext.aw_navigation === null}}"
        link-text="{{subPanelContext.provider.emptyWorkareaConfig.linkText}}">
    </aw-empty-workarea>
    <aw-empty-workarea
        exist-when="subPanelContext.searchState.criteria.searchString && (!subPanelContext.searchState.totalFound || subPanelContext.searchState.totalFound === 0) && subPanelContext.provider.emptyWorkareaConfigNoResults"
        image="{{subPanelContext.provider.emptyWorkareaConfigNoResults.image}}"
        title="{{subPanelContext.provider.emptyWorkareaConfigNoResults.title}}"
        hint="{{subPanelContext.provider.emptyWorkareaConfigNoResults.hint}}"
        command-id="{{subPanelContext.provider.emptyWorkareaConfigNoResults.commandId}}"
        link-visibility="{{!props.viewModel.ctx.awSidenavConfig.globalSidenavContext.aw_navigation.open || props.viewModel.ctx.awSidenavConfig.globalSidenavContext.aw_navigation === null}}"
        link-text="{{subPanelContext.provider.emptyWorkareaConfigNoResults.linkText}}">
    </aw-empty-workarea>
</div>
