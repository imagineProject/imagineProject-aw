<div class="aw-scheduleManager-kanban">
    <aw-kanban visible-when="data.kanbanState.kanbanColumnObject" kanban-id="SMKanban" selection-data="props.subPanelContext.selectionData" kanban-state="data.kanbanState"></aw-kanban>
    <aw-empty-workarea
        exist-when="!subPanelContext.searchState.totalFound && !subPanelContext.searchState.totalLoaded && !subPanelContext.searchState.criteria.searchString && (!subPanelContext.searchState.totalFound || subPanelContext.searchState.totalFound === 0) && subPanelContext.provider.emptyWorkareaConfig"
        image="{{subPanelContext.provider.emptyWorkareaConfig.image}}"
        title="{{subPanelContext.provider.emptyWorkareaConfig.title}}"
        hint="{{subPanelContext.provider.emptyWorkareaConfig.hint}}"
        command-id="{{subPanelContext.provider.emptyWorkareaConfig.commandId}}"
        link-visibility="{{!props.viewModel.ctx.awSidenavConfig.globalSidenavContext.aw_navigation.open || props.viewModel.ctx.awSidenavConfig.globalSidenavContext.aw_navigation === null}}"
        link-text="{{subPanelContext.provider.emptyWorkareaConfig.linkText}}">
    </aw-empty-workarea>
    <aw-empty-workarea
        exist-when="!subPanelContext.searchState.totalFound && !subPanelContext.searchState.totalLoaded && subPanelContext.searchState.criteria.searchString && (!subPanelContext.searchState.totalFound || subPanelContext.searchState.totalFound === 0) && subPanelContext.provider.emptyWorkareaConfigNoResults"
        image="{{subPanelContext.provider.emptyWorkareaConfigNoResults.image}}"
        title="{{subPanelContext.provider.emptyWorkareaConfigNoResults.title}}"
        hint="{{subPanelContext.provider.emptyWorkareaConfigNoResults.hint}}"
        command-id="{{subPanelContext.provider.emptyWorkareaConfigNoResults.commandId}}"
        link-visibility="{{!props.viewModel.ctx.awSidenavConfig.globalSidenavContext.aw_navigation.open || props.viewModel.ctx.awSidenavConfig.globalSidenavContext.aw_navigation === null}}"
        link-text="{{subPanelContext.provider.emptyWorkareaConfigNoResults.linkText}}">
    </aw-empty-workarea>
</div>
