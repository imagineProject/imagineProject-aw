<aw-show-object-page header-title="subPanelContext.showObjectContext.displayName" browser-sub-title="subPanelContext.showObjectContext.displayName">
    <aw-show-object-header headerVMO="subPanelContext.openedObject" header-data="subPanelContext.headerData" header-props="subPanelContext.showObjectContext.xrtViewModel.data._headers">
        <div class="sw-row w-12">
            <div>{{subPanelContext.openedObject.props.object_string.uiValues[0]}}</div>
        </div>
        <aw-global-search></aw-global-search>
        <aw-logo></aw-logo>
    </aw-show-object-header>
    <aw-tab-container tab-container-model="subPanelContext.showObjectContext.subLocationTabs" callback="subPanelContext.showObjectContext.api" tab-set-id="primary">
    </aw-tab-container>
    <div class="aw-schedule-navigation-sublocation">
        <aw-standard-sublocation sub-panel-context="{...subPanelContext, scheduleNavigationContext: data.scheduleNavigationContext }" provider="data._sublocation" search-state="data.searchState" base-selection="subPanelContext.openedObject" selection-model="selectionModels.schNavSelectionModel" selection-data="data.selectionData">
            <saw1-schedule-navigation-breadcrumb sub-panel-context="{baseSelection:data._sublocation && data._sublocation.baseSelection ? data._sublocation.baseSelection : subPanelContext.openedObject}" vmo="data.objNavState.pwaSelection[0]" selections="data.objNavState.pwaSelection" obj-nav-state="data.objNavState">
            </saw1-schedule-navigation-breadcrumb>
        </aw-standard-sublocation>
    </div>
</aw-show-object-page>
