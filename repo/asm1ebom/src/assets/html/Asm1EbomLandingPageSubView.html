<div class="sw-column w-12 afx-content-background">
    <div class="sw-row mx-large aw-ebom-landingPage h-12">
        <!-- C1 - First Column for tiles-->
        <div class="sw-column my-large aw-ebom-landingPageTileColumn">
            <div class="sw-row afx-alt-content-background aw-ebom-myStuffSection">
                <div class="sw-column aw-ebom-landingPageTile">
                    <aw-label class="justify-left align-center" prop="data.myStuffLabel"></aw-label>
                    <aw-scrollpanel>
                        <aw-tile-group tile-group="data.ebmTileGroups[0]"></aw-tile-group>
                    </aw-scrollpanel>
                </div>
            </div>
            <div class="sw-row afx-alt-content-background aw-ebom-commonTileSection">
                <div class="sw-column aw-ebom-landingPageTile">
                    <aw-label class="justify-left align-center" prop="data.miscLabel"></aw-label>
                    <aw-scrollpanel>
                        <aw-tile-group tile-group="data.tileGroups[0]" exist-when="data.tileGroups[0]"></aw-tile-group>
                        <aw-tile-group tile-group="data.tileGroups[1]" exist-when="data.tileGroups[1]"></aw-tile-group>
                    </aw-scrollpanel>
                </div>
            </div>
        </div>
        <!-- C2 - Second Column for other views-->
        <div class="sw-column my-large w-6">
            <!--C2 - R1 - INBOX - slot -->
            <div class="sw-row h-6 afx-alt-content-background">
                <div class="aw-ebom-listLabel">
                    <aw-link prop="data.inboxTitle" action="navigationInboxAction"></aw-link>
                </div>
                <div class="sw-column aw-ebom-listSection">
                    <div class="aw-ebom-scrollSection" exist-when="data.inboxTotalCount===0">
                        <aw-empty-workarea
                            image='graEmptyInbox128'
                            title="i18n.noTasksInInbox"
                            hint="i18n.noTasksInInboxHint">
                        </aw-empty-workarea>
                    </div>
                    <aw-list dataprovider="data.dataProviders.inboxDataProvider" show-decorators="true">
                        <aw-default-cell vmo="item"></aw-default-cell>
                    </aw-list>
                </div>
            </div>
            <!-- C2 - R2 -RECENT - slot -->
            <div class="sw-row h-6 afx-alt-content-background">
                <div class="aw-ebom-listLabel">
                    <aw-link prop="data.recentTitle" action="navigationRecentAction"></aw-link>
                </div>
                <div class="sw-column aw-ebom-listSection">
                    <div class="aw-ebom-scrollSection" exist-when="data.recentTotalCount===0">
                        <aw-empty-workarea
                            image='graEmptyFavorites'
                            title="i18n.noRecentsFound"
                            hint="i18n.noRecentsFoundHint">
                        </aw-empty-workarea>
                    </div>
                    <aw-list dataprovider="data.dataProviders.recentObjDataProvider">
                        <aw-default-cell vmo="item"></aw-default-cell>
                    </aw-list>
                </div>
            </div>
        </div>
        <!-- C3 - Third Column for other views-->
        <div class="sw-column my-large w-6">
            <!-- C3 - R1 - CHANGE - slot -->
            <div class="sw-row h-6 afx-alt-content-background">
                <div class="aw-ebom-listLabel">
                    <aw-link prop="data.changeTitle" action="navigationChangeAction"></aw-link>
                </div>
                <div class="sw-column aw-ebom-listSection">
                    <div class="aw-ebom-scrollSection" exist-when="data.changeTotalFound===0">
                        <aw-empty-workarea
                            image='graEmptyGeneric128'
                            title="i18n.noChanges"
                            hint="i18n.noChangesHint">
                        </aw-empty-workarea>
                    </div>
                    <aw-list dataprovider="data.dataProviders.myChangesDataProvider">
                        <aw-default-cell vmo="item"></aw-default-cell>
                    </aw-list>
                </div>
            </div>
            <!-- C3 - R2 - SUBSCRIPTION - slot -->
            <div class="sw-row h-6">
                <div class="sw-column w-12 afx-alt-content-background" exist-when="ctx.preferences.Create_Subscription_mru_max">
                    <div class="sw-row h-12">
                        <div class="aw-ebom-listLabel">
                           <aw-link prop="data.subscriptionTitle" action="navigationSubscriptionAction"></aw-link>
                        </div>
                        <div class="sw-column aw-ebom-listSection">
                            <div class="aw-ebom-scrollSection" exist-when="data.subscriptionTotalCount===0">
                                <aw-empty-workarea
                                    image='graEmptyGeneric128'
                                    title="i18n.noNewsFeed"
                                    hint="i18n.noNewsFeedHint">
                                </aw-empty-workarea>
                            </div>
                            <aw-list dataprovider="data.dataProviders.subscriptionDataProvider">
                                <aw-default-cell vmo="item"></aw-default-cell>
                            </aw-list>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
