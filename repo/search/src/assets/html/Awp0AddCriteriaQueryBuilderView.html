<aw-command-panel panel-id="Awp0AddCriteriaQueryBuilder" caption="i18n.AddClause" context="subPanelContext">
    <aw-navigate-panel sub-panel-context="{...subPanelContext.context.searchState.selectTypeContext}" title="{{data.selectTypeTitleName}}" pre-panel-id="Awp0AddCriteriaQueryBuilder" action="actions.changeActiveViewToAddClause" panel-id="AwSavedQueryTypeSelectionPopup" visible-when="props.subPanelContext.context.searchState.activeView === 'selectType'"></aw-navigate-panel>
    <aw-panel-body show-when="props.subPanelContext.context.searchState.activeView === 'addClause'">
        <aw-panel-section class="aw-addClause-panelSection">
            <div class="sw-column">
                <aw-radiobutton class="sw-column" prop="data.clauseType" list="data.clauseTypeValues.dbValue"></aw-radiobutton>
                <aw-include name="AwSavedQueryStandardClause" exist-when="data.clauseType.dbValue === 'standard'" sub-panel-context="{workspaceObjectSubTypes: data.workspaceObjectSubTypes, activeView: data.activeView, ...subPanelContext}"></aw-include>
                <aw-include name="AwSavedQueryRelationsClause" exist-when="data.clauseType.dbValue === 'relations'" sub-panel-context="{workspaceObjectSubTypes: data.workspaceObjectSubTypes, activeView: data.activeView, ...subPanelContext}"></aw-include>
                <aw-include name="AwSavedQueryClassificationClause" exist-when="data.clauseType.dbValue === 'classification'" sub-panel-context="{...subPanelContext, activeState: fields.activeState}"></aw-include>
            </div>
        </aw-panel-section>
    </aw-panel-body>
    <aw-panel-footer show-when="props.subPanelContext.context.searchState.activeView === 'addClause'">
        <aw-button size='auto' enable-when="conditions.isValidToAdd" action="addClauseAction"><aw-i18n>i18n.addCommandTitle</aw-i18n></aw-button>
    </aw-panel-footer>
</aw-command-panel>
