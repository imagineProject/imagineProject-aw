<div class="aw-layout-flexColumn">
    <aw-panel-section caption="{{data.contentsText}}" anchor-position="RIGHT" anchor="search_folder_contents" class="aw-results-section" context="{{{...subPanelContext, searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox, selectionModel: selectionModels.projectSelectionModel}}}">
        <aw-project-data-folder-contents-table exist-when="data.currentDisplayField.activeDisplay === 'tableDisplay'" sub-panel-context="{...subPanelContext, searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox,selectionModel: selectionModels.projectSelectionModel}"></aw-project-data-folder-contents-table>
        <aw-project-data-folder-contents-list exist-when="data.currentDisplayField.activeDisplay === 'listDisplay'" sub-panel-context="{...subPanelContext, searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox,selectionModel: selectionModels.projectSelectionModel}"></aw-project-data-folder-contents-list>
        <aw-project-data-folder-contents-image exist-when="data.currentDisplayField.activeDisplay === 'thumbnailDisplay'" sub-panel-context="{...subPanelContext, searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox,selectionModel: selectionModels.projectSelectionModel}"></aw-project-data-folder-contents-image>
    </aw-panel-section>
</div>
