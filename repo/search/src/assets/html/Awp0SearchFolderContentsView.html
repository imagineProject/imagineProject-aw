<div class="aw-search-savedSearchAndMyActiveFolderContents sw-column">
    <aw-panel-section caption="{{data.contentsText}}" anchor-position="RIGHT" anchor="search_folder_contents,aw_searchFolderContentsSelectionSet,aw_searchFolderContentsExportSet" class="aw-results-section" context="{{{...subPanelContext, searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox, selectionModel: selectionModels.searchFolderSelectionModel }}}">
        <aw-include name="Awp0SearchFolderContentsTable" exist-when="data.currentDisplayField.activeDisplay === 'tableDisplay'" sub-panel-context="{...subPanelContext, searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox, selectionModel: selectionModels.searchFolderSelectionModel}"></aw-include>
        <aw-include name="Awp0SearchFolderContentsList" exist-when="data.currentDisplayField.activeDisplay === 'listDisplay'" sub-panel-context="{...subPanelContext, searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox, selectionModel: selectionModels.searchFolderSelectionModel}"></aw-include>
        <aw-include name="Awp0SearchFolderContentsImage" exist-when="data.currentDisplayField.activeDisplay === 'thumbnailDisplay'" sub-panel-context="{...subPanelContext, searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox, selectionModel: selectionModels.searchFolderSelectionModel}"></aw-include>
        <aw-include name="Awp0SearchFolderContentsCompare" exist-when="data.currentDisplayField.activeDisplay === 'compareDisplay'" sub-panel-context="{...subPanelContext, searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox, selectionModel: selectionModels.searchFolderSelectionModel}"></aw-include>
    </aw-panel-section>
</div>
