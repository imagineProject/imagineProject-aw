<aw-command-panel  caption="i18n.createNewQuery" context="subPanelContext">
    <aw-panel-body>
        <aw-panel-section caption="i18n.properties">
            <aw-textbox   prop="data.createQueryName" hint="textarea" aria-label='{{i18n.Name}}'></aw-textbox>
            <aw-widget   prop="data.createQueryProperty1" hint="textarea" aria-label='{{i18n.Property1}}'></aw-widget >
            <aw-widget prop="data.typeListProp" aria-label='{{i18n.SearchType}}'></aw-widget>
        </aw-panel-section>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button size='auto' action="createQuery" enable-when="conditions.isValidToCreateQuery"><aw-i18n>i18n.Create</aw-i18n></aw-button>
    </aw-panel-footer>
</aw-command-panel>
