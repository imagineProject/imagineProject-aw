<div class="aw-widgets-propertyContainer">
    <aw-widget prop="data.savedSearchesListProp"></aw-widget>
</div>
<aw-widget exist-when="conditions.fullTextSavedSearchType" prop="data.fullTextCriteria"></aw-widget>
<aw-search-breadcrumb-chips search-object="subPanelContext.searchState" exist-when="conditions.fullTextSavedSearchType && conditions.populatedSearchString">
</aw-search-breadcrumb-chips>
<awp0-search-filter exist-when="conditions.fullTextSavedSearchType && subPanelContext.searchState.categories && subPanelContext.searchState.categories.length > 0" hide-title="true" sub-panel-context="{'searchState':subPanelContext.searchState}"></awp0-search-filter>
<awp0-review-and-execute-advanced-saved-search exist-when="conditions.advancedSavedSearchType" saved-search-object="subPanelContext.searchState.savedSearchObject" execute-advanced-saved-search="true" sub-panel-context="{...subPanelContext, 'searchState':subPanelContext.searchState}" hide-title="true"></awp0-review-and-execute-advanced-saved-search>
