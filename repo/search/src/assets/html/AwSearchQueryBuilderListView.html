<aw-empty-workarea class="aw-base-scrollPanel"
    exist-when="data.totalFound === 0"
    image="graEmptySearch"
    title="i18n.NoQueriesText"
    hint="i18n.NoQueriesHintText"
    action="actions.activateCreateQueryDialog"
    link-text="i18n.Awp0CreateQuery">
</aw-empty-workarea>
<aw-list dataprovider="data.dataProviders.queryBuildListProvider" has-floating-cell-commands="true" show-decorators="true"
    exist-when="data.totalFound > 0" show-context-menu="true"
    show-check-box="subPanelContext.showCheckBox">
    <div class='sw-column w-12'>
        <aw-search-cell vmo="item" sub-panel-context="subPanelContext"></aw-search-cell>
    </div>
</aw-list>
