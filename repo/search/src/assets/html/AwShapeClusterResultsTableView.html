<div class="aw-base-scrollPanel" exist-when="!subPanelContext.searchState.totalFound && !subPanelContext.searchState.totalLoaded">
    <aw-empty-workarea
        image="graEmptySearch"
        title="{{ subPanelContext.searchState.criteria.searchString ? i18n.noPartsFound : i18n.nothingFound}}"
        hint="{{ subPanelContext.searchState.criteria.searchString ? i18n.noPartsSearchAreaHint : i18n.emptySearchAreaClusterHint}}"
        action="actions.shapeClusterSearchLinkCommand"
        link-visibility="{{!props.subPanelContext.searchState.clusterSearchPopupId}}"
        link-text="i18n.SS1ClusterTarget">
    </aw-empty-workarea>
</div>
<span class="aw-widgets-propertyNonEditValue aw-search-inContentSearchBox"
    exist-when="subPanelContext.searchState.totalFound===0 && !(subPanelContext.searchState.thresholdExceeded === 'true')">{{i18n.noFiltersFound}}</span>
<span class="aw-widgets-propertyNonEditValue aw-search-inContentSearchBox"
    exist-when="subPanelContext.searchState.totalFound===0 && subPanelContext.searchState.thresholdExceeded === 'true'">{{ctx.searchInfo.noResultsFound}}</span>

<div class="aw-layout-column aw-layout-flexbox" show-when="subPanelContext.searchState.totalFound>0" exist-when="subPanelContext.searchState.criteria !== undefined &&
    subPanelContext.searchState.criteria.searchString !== ''">
    <aw-guidance-message message="clusterSearchHeader" closable="true" banner-style="true" show-icon="true" show-type="false"></aw-guidance-message>
    <aw-splm-table gridid="clusterSearchGridView" show-context-menu="true"
    show-check-box="subPanelContext.showCheckBox" />
</div>
