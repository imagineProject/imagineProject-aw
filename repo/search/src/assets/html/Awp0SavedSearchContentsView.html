<div class="aw-search-savedSearchAndMyActiveFolderContents sw-column">
    <aw-panel-section caption="{{data.contentsText}}" class="aw-results-section" anchor-position="RIGHT" anchor="search_folder_contents,aw_savedSearchContentsSelectionSet,aw_savedSearchContentsExportSet" context="{{{...subPanelContext, searchState: data.searchState, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplayField.activeDisplay,showCheckBox:data.showCheckBox, selectionModel: selectionModels.savedSearchSelectionModel}}}">
        <aw-include name="Awp0SavedSearchContentsTable" exist-when="data.currentDisplayField.activeDisplay === 'tableDisplay'" sub-panel-context="{...subPanelContext, searchState: data.searchState, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplayField.activeDisplay,showCheckBox:data.showCheckBox, selectionModel: selectionModels.savedSearchSelectionModel}"></aw-include>
        <aw-include name="Awp0SavedSearchContentsList" exist-when="data.currentDisplayField.activeDisplay === 'listDisplay'" sub-panel-context="{...subPanelContext, searchState: data.searchState, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplayField.activeDisplay,showCheckBox:data.showCheckBox, selectionModel: selectionModels.savedSearchSelectionModel}"></aw-include>
        <aw-include name="Awp0SavedSearchContentsImage" exist-when="data.currentDisplayField.activeDisplay === 'thumbnailDisplay'" sub-panel-context="{...subPanelContext, searchState: data.searchState, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplayField.activeDisplay,showCheckBox:data.showCheckBox, selectionModel: selectionModels.savedSearchSelectionModel}"></aw-include>
    </aw-panel-section>
</div>
