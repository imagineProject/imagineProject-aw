<aw-panel-section caption="i18n.properties">
    <div class="sw-row">
        <div class="sw-column aw-search-propertyFlex">
            <aw-textbox prop="data.queryName"></aw-textbox>
            <aw-widget prop="data.queryDescription"></aw-widget>
        </div>
        <div class="aw-search-splitter"></div>
        <div class="sw-column aw-search-propertyFlex">
            <aw-iman-query-search-type sub-panel-context="{queryState: data.queryState, ...subPanelContext}" is-editing="conditions.inEditMode"></aw-iman-query-search-type>
        </div>
    </div>
</aw-panel-section>
<awp0-saved-query-criteria-table sub-panel-context="{queryState: data.queryState, ...subPanelContext}"></awp0-saved-query-criteria-table>
