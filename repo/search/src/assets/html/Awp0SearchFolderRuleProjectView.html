<div class="aw-search-projectLabel">
    <aw-column align-content="start">
        <aw-label prop="data.projectLabel"></aw-label>
    </aw-column>
    <div class="sw-column" align-content="end">
        <div class="aw-requirements-matrixTypeHelpIcon aw-aria-border" tabindex="0" extended-tooltip="data.projectListToolTip">
            <aw-icon icon-id="homehelp"></aw-icon>
        </div>
    </div>
</div>
<aw-widget class="aw-widgets-propertyContainer" prop="data.projectListProp"></aw-widget>
<aw-search-breadcrumb-chips search-object="subPanelContext.searchState" exist-when="conditions.populatedSearchString">
</aw-search-breadcrumb-chips>
<awp0-search-filter exist-when="subPanelContext.searchState.categories && subPanelContext.searchState.categories.length > 0" hide-title="true" sub-panel-context="subPanelContext"></awp0-search-filter>
