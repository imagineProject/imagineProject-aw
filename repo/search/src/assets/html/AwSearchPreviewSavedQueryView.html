<aw-command-panel class="aw-create-fillAvailable" caption="{{i18n.Awp0PreviewQuery}}"  context="subPanelContext">
    <!-- Advanced Search Panel View with Results Section-->
    <div class="sw-column aw-create-fillAvailable aw-search-previewQuerySingleView" exist-when="conditions.isMobileMode" >
        <aw-panel-section caption="{{data.inputText}}" class='aw-attributes-section aw-results-section aw-input-section' aw-class="[{ 'h-12': !data._isInputSectionCollapsed }]"  name='inputSection' collapsed="{{data._isInputSectionCollapsed}}" >
            <aw-scrollpanel class="aw-search-previewQuerySingleViewScrollPanel">
                <aw-advanced-search-attributes attributes="fields.awp0AdvancedQueryAttributes" call-back-action="clearAll" enter-key-action="doAdvancedSearch"></aw-advanced-search-attributes>
            </aw-scrollpanel>
        </aw-panel-section>
        <aw-panel-section caption="{{data.resultsText}}" class="aw-results-section aw-create-fillAvailable" show-when="data._isInputSectionCollapsed" include-component-name="AwSearchBreadcrumbUnreadableCount" context="{{props.subPanelContext.searchState.additionalSearchInfoMap.unReadableCount[0]}}" key="{{data.resultSectionID}}">
            <aw-include name="AwAdvancedSearchList" sub-panel-context="{...props.subPanelContext, selectionData: data.selectionData, preFilterContext: subPanelContext, searchState: fields.searchState}"></aw-include>
        </aw-panel-section>
    </div>
 <!-- Advanced Search Panel 2x View with Results Section-->
    <div class="sw-row aw-create-fillAvailable" exist-when="conditions.nonMobileMode">
        <div class="sw-column aw-create-fillAvailable w-6">
            <aw-panel-section collapsed="disabled" caption="{{data.inputText}}" class='aw-attributes-section aw-input-section aw-create-fillAvailable aw-search-left-panel-view' name='inputSection'>
                <aw-scrollpanel>
                    <aw-advanced-search-attributes attributes="fields.awp0AdvancedQueryAttributes" enter-key-action="doAdvancedSearch" call-back-action="clearAll" ></aw-advanced-search-attributes>
                </aw-scrollpanel>
                <aw-panel-footer class="aw-search-footer">
                    <aw-button button-type='base' size='auto' action="doAdvancedSearch">
                        <aw-i18n>i18n.searchBtn</aw-i18n>
                    </aw-button>
                </aw-panel-footer>
            </aw-panel-section>
        </div>
        <aw-splitter></aw-splitter>
        <aw-panel-section collapsed="disabled" caption="{{data.resultsText}}" class="aw-results-section aw-create-fillAvailable w-6" include-component-name="AwSearchBreadcrumbUnreadableCount" context="{{props.subPanelContext.searchState.additionalSearchInfoMap.unReadableCount[0]}}" key="{{data.resultSectionID}}">
            <aw-include name="AwAdvancedSearchList" sub-panel-context="{...props.subPanelContext, selectionData: data.selectionData, preFilterContext: subPanelContext, searchState: fields.searchState}"></aw-include>
        </aw-panel-section>
    </div>
    <aw-panel-footer exist-when="conditions.isMobileMode && !data._isInputSectionCollapsed" >
        <aw-button button-type="base" size='auto' action="doAdvancedSearch">
            <aw-i18n>i18n.searchBtn</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-command-panel>
