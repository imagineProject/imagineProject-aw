<aw-command-panel caption="i18n.SS1Shapes" context="{...data,...subPanelContext}" >
    <aw-panel-body scrollable="false">
        <aw-tab-set tabs="data.tabModels">
            <aw-search-objects sub-panel-context="{preFilterContext: props.subPanelContext, showContextMenu: false}" selection-data="data.selectionData" selection-model="selectionModels.resultTabModel" search-state-for-keyword="data.searchState" supports-advanced-search="false" exist-when="data.selectedTab.tabKey === 'searchPage'"></aw-search-objects>
            <palette-tab-page-sub sub-panel-context="{searchFilterTabModels: data.searchFilterTabModels.dbValue,addPanelState: data.addPanelState}" exist-when="data.selectedTab.tabKey === 'palettePage'"></palette-tab-page-sub>
        </aw-tab-set>
    </aw-panel-body>
    <aw-panel-footer visible-when="conditions.isSearchCandidateSelected">
        <aw-button size='auto' action="performShapeSearch">
            <aw-i18n>i18n.SS1ShapeSearchTitleAction</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-command-panel>
