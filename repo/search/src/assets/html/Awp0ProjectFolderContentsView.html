<div class="aw-layout-flexColumn">
    <aw-panel-section caption="{{data.contentsText}}" class="aw-results-section" anchor-position="RIGHT" anchor="aw_searchFolderContentsSelectionSet,aw_searchFolderContentsExportSet,search_folder_contents"  context="{{{...props.ctx.context[0], searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox, selectionModel: selectionModels.projectSelectionModel}}}">
        <aw-project-folder-contents-table exist-when="data.currentDisplayField.activeDisplay === 'tableDisplay'" sub-panel-context="{...subPanelContext, searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox,selectionModel: selectionModels.projectSelectionModel}"></aw-project-folder-contents-table>
        <aw-project-folder-contents-list exist-when="data.currentDisplayField.activeDisplay === 'listDisplay'" sub-panel-context="{...subPanelContext, searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox,selectionModel: selectionModels.projectSelectionModel}"></aw-project-folder-contents-list>
        <aw-project-folder-contents-image exist-when="data.currentDisplayField.activeDisplay === 'thumbnailDisplay'" sub-panel-context="{...subPanelContext, searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox,selectionModel: selectionModels.projectSelectionModel}"></aw-project-folder-contents-image>
        <aw-project-folder-contents-compare exist-when="data.currentDisplayField.activeDisplay === 'compareDisplay'" sub-panel-context="{...subPanelContext, searchFolder: data.searchFolder, currentDisplayField:data.currentDisplayField, displayModes:data.displayModes, displayModesCount:data.displayModesCount,currentDisplay: data.currentDisplay,showCheckBox:data.showCheckBox,selectionModel: selectionModels.projectSelectionModel}"></aw-project-folder-contents-compare>
    </aw-panel-section>
</div>
