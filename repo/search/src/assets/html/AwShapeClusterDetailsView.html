<aw-panel-body>
    <aw-panel-section caption="i18n.clusterSearchGraphPropertiesLabel" name="SS1ClusterDetailsChartSection" collapsed="true">
        <div class="sw-row" exist-when="data.allGraphProps.length > 0">
            <aw-cluster-prop-chart aw-repeat="eachProp : data.allGraphProps" prop="{{eachProp}}" objects="{{data.searchResults}}"></aw-cluster-prop-chart>
        </div>
    </aw-panel-section>
    <aw-panel-section caption="i18n.clusterSearchReplacementsLabel" name="SS1ReplacementTableSection">
        <aw-splm-table gridid="clusterDetailsGridView" />
    </aw-panel-section>
</aw-panel-body>
