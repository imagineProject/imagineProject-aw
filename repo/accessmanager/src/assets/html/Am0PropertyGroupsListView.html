<div class="aw-base-scrollPanel" exist-when="subPanelContext.searchState.criteria.searchString ==='' && subPanelContext.searchState.totalFound === 0">
    <aw-empty-workarea
        image="graEmptyGenericList128"
        title="i18n.propertyGroupsPwaTitle"
        hint="i18n.propertyGroupsPwaHint"
        action="actions.dialogAction"
        link-visibility="true"
        link-text="i18n.Am0AddPropertyGroupTitle">
    </aw-empty-workarea>
    <aw-dialog action="dialogAction"></aw-dialog>
</div>
<div class="aw-base-scrollPanel" exist-when="subPanelContext.searchState.criteria.searchString !=='' && subPanelContext.searchState.totalFound === 0">
    <aw-empty-workarea
        image="graNoGenericResult128"
        title="i18n.noResultsFound"
        hint="i18n.noResultsSearchKeywordHint">
    </aw-empty-workarea>
</div>
    <aw-scrollpanel exist-when="subPanelContext.searchState.totalFound>0">
    <aw-list dataprovider="data.dataProviders.propertyGroupsListProvider">
       <aw-default-cell vmo="item"></aw-default-cell>
    </aw-list>
  </aw-scrollpanel>
