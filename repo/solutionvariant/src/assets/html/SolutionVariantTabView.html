<aw-panel>
    <aw-panel-body>
    <aw-command-sub-panel panel-id="solutionVariantObjectSet" exist-when="conditions.bomLineUIDAvailable"
    sub-panel-context="{...subPanelContext, selectionData: subPanelContext.selectionData, inputSelection:data.inputSelection, selectionModel : selectionModels.svSelectionModel, objectSetSolutionVariants : data.objectSetSolutionVariants, sectionName:i18n.solutionVariants}"></aw-command-sub-panel>
    <aw-command-panel-section class="aw-layout-tableSection" caption="{{i18n.variantRules}}" collapsed="true">
        <variant-rule-section sub-panel-context="{selectionData: subPanelContext.selectionData}"></variant-rule-section>
    </aw-command-panel-section>    
</aw-panel-body>
</aw-panel>
