
<aw-panel-section caption="{{props.subPanelContext.sectionName}}">
    <aw-object-set objsetdata="props.subPanelContext.objectSetSolutionVariants.objsetdata"
        selection-data="props.subPanelContext.selectionData"
        selection-model="props.subPanelContext.selectionModel"
        operation-type="union"
        key="{{props.subPanelContext.objectSetSolutionVariants.triggerReloadKey}}"
        obj-set-uri="{{props.subPanelContext.objectSetSolutionVariants.objectSetUri}}"
        edit-context-key="{{data.editContextKey}}"
        object-set-info="data._objectSetInfo"
        titlekey="{{props.subPanelContext.objectSetSolutionVariants.titlekey}}"
        dp-ref="data.dpRef"
        columns="{{props.subPanelContext.objectSetSolutionVariants.attributesToInflate}}"
        reload="true"
        vmo="subPanelContext.selected"
        grid-info="data.gridInfo"
        sub-panel-context="subPanelContext"
        parent-uid="{{ctx.SVContext.bomLineUID}}">
    </aw-object-set>
</aw-panel-section>
