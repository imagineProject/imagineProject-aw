<aw-command-panel caption="i18n.addVariantRule" context="subPanelContext">
    <aw-panel-body>
        <aw-xrt type="CREATE" object-type="{{data.variantRuleObjectType}}" xrt-state="data.xrtState"></aw-xrt>
    </aw-panel-body>

    <aw-panel-footer>
        <aw-button action="createVariantRuleObject" enable-when="formProp.attributes.valid">
            <aw-i18n>i18n.add</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-command-panel>
