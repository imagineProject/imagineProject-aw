<aw-popup2>
    <aw-panel-body>
        <div class="sw-reverse">
            <aw-label prop='data.generateCreateSVMessage' visible-when="conditions.isCreate && !conditions.isObjectSelected"></aw-label>
            <aw-label prop='data.generateUpdateSVMessage' visible-when="conditions.isUpdate && !conditions.isObjectSelected"></aw-label>
            <aw-label prop='data.generateSelectedUpdateSVMessage' visible-when="conditions.isUpdate && conditions.isObjectSelected"></aw-label>
            <aw-label prop='data.generateSelectedCreateSVMessage' visible-when="conditions.isCreate && conditions.isObjectSelected"></aw-label>

        </div>
        <div class="sw-row">
            <aw-checkbox prop="data.runInBackground"></aw-checkbox>
        </div>
        <div class="sw-button-group justify-right align-right">
            <aw-button button-type="base" action="hidePopup" size="auto" >{{i18n.actionContinueNo}}</aw-button>
            <aw-button action="createSolutionVariant" size="auto" visible-when="conditions.isCreate">{{i18n.actionContinueYes}}</aw-button>
            <aw-button action="updateSolutionVariant" size="auto" visible-when="conditions.isUpdate">{{i18n.actionContinueYes}}</aw-button>
        </div>
    </aw-panel-body>
</aw-popup2>
