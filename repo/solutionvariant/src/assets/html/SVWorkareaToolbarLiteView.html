<aw-flex-row height="4f" align-content="center"
    class="aw-taskbar-container afx-accent-background aw-layout-justifyFlexEnd aw-layout-headerContribution">
    <div class="aw-layout-flexbox aw-layout-headerProperty align-center">
        <span class="aw-solutionvariantjs-buttonSeparator"></span>
        <aw-label prop="data.product" visible-when="!conditions.isProductBeingOpenedAsRoot">
        </aw-label>
        <aw-link prop="data.rootProduct" visible-when="!conditions.isProductBeingOpenedAsRoot"
            action="goBack"></aw-link>
        <span class="aw-solutionvariantjs-labelSeparator" visible-when="!conditions.isProductBeingOpenedAsRoot"></span>
        <aw-label class="aw-layout-headerProperty"prop="data.sourceStructure"></aw-label>
        <aw-link prop="data.selectedSourceStructure" action="openSourceStructure"></aw-link>
        <span class="aw-solutionvariantjs-labelSeparator"></span>
        <aw-label class="aw-layout-headerProperty" prop="data.revRuleLabel"></aw-label>
        {{ctx.aceActiveContext.context.productContextInfo.props.awb0CurrentRevRule.uiValues[0]}}
        <span class="aw-solutionvariantjs-labelSeparator"></span>
        <aw-label class="aw-layout-headerProperty" prop="data.variantRuleLabel"></aw-label>
        {{ctx.aceActiveContext.context.variantLabel}}
    </div>
    <aw-button button-type="accent-high-contrast" action="cancelPreview"
        aw-class="{'disabled': ctx.aceActiveContext.context.disabledButtonChk}" size="auto">
        <aw-i18n>i18n.cancelPreview</aw-i18n>
    </aw-button>
    <span class="aw-solutionvariantjs-buttonSeparator"></span>
    <aw-button button-type="accent-mid-contrast" action="createSolutionVariant"
        visible-when="!conditions.showRunInBackground"
        aw-class="{'disabled': ctx.aceActiveContext.context.disabledButtonChk}" size="auto">
        <aw-i18n>i18n.createSolutionVariant</aw-i18n>
    </aw-button>
    <aw-popup-wrapper popup="createPopup">
        <aw-button button-type="base" action="createPopup" visible-when="conditions.showRunInBackground"
            aw-class="{'disabled': ctx.aceActiveContext.context.disabledButtonChk}" size="auto">
            <aw-i18n>i18n.createPopup</aw-i18n>
        </aw-button>
    </aw-popup-wrapper>
    <div class="sw-row">
        <aw-separator is-vertical="true"></aw-separator>
        <aw-command-bar anchor="solutionvarianttoolbarRightSlot" context='props.subPanelContext' alignment="HORIZONTAL"></aw-command-bar>
        <aw-separator is-vertical="true"></aw-separator>
        <span class="aw-taskbasedpage-headerTitleSeparator"></span>
        <aw-command-bar anchor="toolbarRightSlot" alignment="HORIZONTAL"></aw-command-bar>
    </div>
</aw-flex-row>
