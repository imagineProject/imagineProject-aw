<aw-column class="sw-ddsAdminObjdataIndexer-diagnosticResults">
    <aw-column class="sw-ddsAdminObjdataIndexer-diagnosticMessages" exist-when="(!conditions.isSearchPerformed || conditions.isNoResultsFound) && !conditions.zeroResultValue && !conditions.isStatusSelectedInStatusSummary">
        <div class="sw-ddsAdminObjdataIndexer-diagnosticDefaultMessage" exist-when="!conditions.isSearchPerformed">
            <aw-i18n>i18n.defaultMessage</aw-i18n>
        </div>
        <div class="sw-ddsAdminObjdataIndexer-diagnosticNoresultsFoundMessage" exist-when="conditions.isNoResultsFound">
            <aw-i18n>i18n.noresultsfoundMessage</aw-i18n>
        </div>
    </aw-column>
    <aw-column class="sw-ddsAdminObjdataIndexer-diagnosticResultsData" exist-when="conditions.isResultsFound || conditions.isStatusSelectedInStatusSummary">
        <aw-command-panel-section caption="{{data.diagnosticResultTitle}}" collapsed="false" context="props.subPanelContext" exist-when="data.resultStatusSummaryRadioValues.length !== 0">
            <div class="sw-ddsadminobjdataindexer-diagnosticresultradio" exist-when="data.resultStatusSummaryRadioValues" width="1f">
                <aw-radiobutton class="sw-column" prop="data.resultStatusSummaryRadio" list="data.resultStatusSummaryRadioValues.dbValue" action="selectedStatusActionInStatusResult" extended-tooltip="tooltipStatusSummary" extended-tooltip-options="data.tooltipStatusSummaryPlacement"></aw-radiobutton>
            </div>
            <div class="{{ conditions.zeroResultValue ? 'sw-ddsAdminObjdataIndexer-diagnosticsEmptyTable' : 'sw-ddsAdminObjdataIndexer-diagnosticsTable' }}" show-when="data.searchResponsePending === false">
                <aw-panel-section caption="{{data.diagnosticResultStatusTitle}}" anchor="indexingStatusExportToExcel" anchor-position="RIGHT"
                context="{{{columns:data.dataProviders.resultGridDataProvider.columnConfig.columns,
                    exportOptions:data.exportOptions,
                    providerName:'Dds0ObjdataSearchProvider',
                    searchCriteria:data.searchCriteria,
                    searchFilterMap:data.searchFilterMap}}}">
                    <div class="sw-ddsAdminObjdataIndexer-diagnosticSplmTable">
                        <aw-splm-table gridid="resultGridView" show-context-menu="true"></aw-splm-table>
                    </div>
                </aw-panel-section>
            </div>
        </aw-command-panel-section>
    </aw-column>
</aw-column>
