<aw-balloon-popup-panel>
    <aw-panel class="aw-arrange-viewColumnConfigsContainer">
        <aw-flex-column>
            <aw-list exist-when="!conditions.isUserNamedColumnConfigsEmpty" dataprovider="data.dataProviders.dataProviderUserNamedColumnConfigs"
                    list-options="data.listOptions">
                <div class="aw-arrange-popupItem" title="{{item.tooltipDisplayName}}">{{item.propertyDisplayName}}</div>
            </aw-list>
            <aw-separator exist-when="conditions.showSeparator"></aw-separator>
            <aw-list exist-when="!conditions.isAdminNamedColumnConfigsEmpty" dataprovider="data.dataProviders.dataProviderAdminNamedColumnConfigs"
                    list-options="data.listOptions">
                <div class="aw-arrange-popupItem" title="{{item.tooltipDisplayName}}">{{item.propertyDisplayName}}</div>
            </aw-list>
            <div exist-when="conditions.showNoArrangements" title="{{i18n.arrangeNoColumnConfigs}}">{{i18n.arrangeNoColumnConfigs}}</div>
        </aw-flex-column>
    </aw-panel>
</aw-balloon-popup-panel>
