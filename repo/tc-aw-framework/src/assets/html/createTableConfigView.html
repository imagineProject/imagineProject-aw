<aw-panel>
    <aw-panel-body>
        <aw-guidance-message exist-when="!conditions.columnConfigIdExists" message="noColumnConfigIdBanner" closable="false" banner-style="true" show-icon="true" show-type="true"></aw-guidance-message>
        <aw-panel-section exist-when="!conditions.columnConfigIdExists">
            <aw-widget prop="data.columnConfigId"></aw-widget>
        </aw-panel-section>
        <aw-column-config-scope column-config-scope="data.scopeState" column-config-id="data.columnConfigIdValue"></aw-column-config-scope>
        <aw-panel-section exist-when="conditions.isSiteScopeSelected">
            <aw-widget enable-when="conditions.columnConfigIdExists" prop="data.tableConfigName"></aw-widget>
        </aw-panel-section>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="createTableConfigBatch" enable-when="conditions.enableButton">
            <aw-i18n exist-when="conditions.isAddTableConfig">i18n.add</aw-i18n>
            <aw-i18n exist-when="!conditions.isAddTableConfig">i18n.saveEditsGroupPWATitle</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel>
