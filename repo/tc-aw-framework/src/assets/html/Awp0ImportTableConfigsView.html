<aw-panel>
    <aw-panel-body class="aw-layout-flexColumnContainer">
        <aw-panel-section caption="i18n.Awp0ImportTableConfigsTitle" collapsed="disabled">
            <aw-file-upload type-filter=".xml" is-required="true" file-change-action="fileChangeAction"></aw-file-upload>
        </aw-panel-section>
        <aw-panel-section>
            <div class="sw-row w-12">
                <div class="sw-column w-11">
                    <aw-radiobutton class="aw-importTableConfigsActionsRadioButton" prop="data.importAction" list="data.importActionValues.dbValue"></aw-radiobutton>
                </div>
                <div class="sw-column w-1 aw-importTableConfigs-iconContainer">
                    <div class="aw-importTableConfigs-infoIcon">
                        <aw-icon size="xxsmall" icon-id="cmdInfo16" extended-tooltip="importActionsTooltip"></aw-icon>
                    </div>
                </div>
            </div>
        </aw-panel-section>
        <aw-column-config-scope column-config-scope="data.scopeState" column-config-id="data.columnConfigIdValue"></aw-column-config-scope>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="Awp0ImportTableConfigsAction" size="auto" enable-when="conditions.showImportButton">
            <aw-i18n>i18n.Awp0ImportTableConfigsTitle</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel>
