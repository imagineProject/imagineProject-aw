<aw-panel>
    <aw-panel-body class="aw-layout-flexColumnContainer">
        <aw-panel-section>
            <aw-label prop="data.exporting"></aw-label>
            <aw-i18n exist-when="conditions.showAllSelected">i18n.allConfigurations</aw-i18n>
            <aw-label exist-when="!conditions.showAllSelected" prop="data.selectedObj"></aw-label>
            <aw-radiobutton class="sw-column" prop="data.exportSelectedAsDefault" list="data.exportSelectedOrAll.dbValue" visible-when="conditions.showOnSingleSelection"></aw-radiobutton>
        </aw-panel-section>
        <aw-column-config-scope visible-when="conditions.showAllSelected" column-config-scope="data.scopeState" column-config-id="data.columnConfigIdValue"></aw-column-config-scope>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="exportToXMLFile" enable-when="conditions.showExportButton">
            <aw-i18n>i18n.Awp0ExportTableConfigsTitle</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel>
