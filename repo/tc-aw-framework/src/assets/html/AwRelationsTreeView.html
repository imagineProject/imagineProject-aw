<div class="aw-relations-tree sw-column w-12" exist-when="props.selections">
    <div class="flex-shrink sw-row"
        aw-class="[conditions.isObjectSetTreeVisible ? '' : 'aw-relations-treeHeaderBorder']" exist-when="conditions.isHeaderVisible">
        <aw-server-visibility-command-bar class="sw-switcher" anchor="aw_summaryHeaderDisplay" alignment="HORIZONTAL"
            context="props.subPanelContext"></aw-server-visibility-command-bar>
        <div visible-when="conditions.isSingleSelection" class="aw-relations-treeHeaderTitle"
            title="{{props.vmo.props.object_string.uiValues[0]}}">
            {{props.vmo.props.object_string.uiValues[0]}}
        </div>
        <div visible-when="!conditions.isSingleSelection" class="aw-relations-treeHeaderTitle"
            title="{{data.selectionCountMessage}}">
            <span>{{data.selectionCountMessage}}</span>
        </div>
    </div>
    <div exist-when="conditions.isSingleSelection" class="aw-flex-row">
        <aw-object-set-tree show-when="conditions.isObjectSetTreeVisible" vmo="{{props.vmo}}"
            parent-uid="{{props.vmo.uid}}" columns="{{data._columns}}" show-relations="allLevels"
            object-set-data="data._objectSetData" selection-data="data.selectionData" selection-model="props.selectionModel" show-check-box="{{props.subPanelContext.showCheckBox}}" show-root-node="{{props.showRootNode}}" object-set-uri="AwRelationsSublocation" object-set-state="props.objectSetState">
        </aw-object-set-tree>
    </div>
    <div exist-when="conditions.isEmptyViewVisible" class="h-12 w-12">
        <aw-empty-workarea image="graNoGenericSelection128" hint="{{conditions.isSingleSelection? data.relationsNotAvailableMessage : i18n.MultiSelectMessage}}">
        </aw-empty-workarea>
    </div>
</div>
