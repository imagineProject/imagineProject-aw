<aw-panel>
    <aw-panel-body>
        <aw-widget prop="data.sortBy" depend-on="sortDirection" on-change="clearSortBy"></aw-widget>
        <aw-widget enable-when="conditions.enableSortDirection" prop="data.sortDirection" depend-on="sortBy" on-change="setSortDirection"></aw-widget>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="updateStateAndClosePanel">
            <aw-18n>i18n.apply</aw-18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel>
