<aw-row>
    <aw-command-panel-section class="arrangeAvailableColumnsSection" caption="i18n.availableColumnsTitle" name="arrangeAvailableColumnsSection" collapsed="disabled">
        <aw-list-filter dataprovider="subPanelContext.dataProviderAvailableColumnConfigs" prop="subPanelContext.filterAvailableBox">
            <span class="columnName" title="{{item.tooltipDescription}}">{{item.displayName}}</span>
        </aw-list-filter>
        <aw-command-bar class="aw-arrange-moreColumns" anchor="arrangeMoreColumnsAnchor" alignment="HORIZONTAL" label-position="SIDE-NOWRAP" overflow="true" reverse="true" reverse-second="true" show-command-labels="true" context="subPanelContext"></aw-command-bar>
        <aw-empty-workarea
            hint="i18n.NoColumnsTitle" visible-when="subPanelContext.dataProviderAvailableColumnConfigs.vmCollectionObj.totalFound == 0 && subPanelContext.arrangeData.isLoadingAdditionalColumns">
        </aw-empty-workarea>
    </aw-command-panel-section>
</aw-row>
