<aw-personalized-launcher exist-when="data.launcherState.activeView === 'pinnedTools' && data.allApps" context="{...props.subPanelContext, runActionWithViewModel: props.runActionWithViewModel, launcherState: data.launcherState, allData: data.allData}"></aw-personalized-launcher>
<aw-all-tools exist-when="data.launcherState.activeView === 'allTools' && data.allApps" context="{...props.subPanelContext, runActionWithViewModel: props.runActionWithViewModel, launcherState: data.launcherState, allApplications: data.allApps}"></aw-all-tools>
