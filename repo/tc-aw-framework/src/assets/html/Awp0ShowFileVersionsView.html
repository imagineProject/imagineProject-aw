<aw-command-panel caption="{{i18n.FileVersionsPanelHeader}}" context="subPanelContext">
    <div class="aw-layout-flexColumn" exist-when="ctx.showFileUploadPanel===true">
        <aw-navigate-panel title="i18n.BACK_BUTTON_TITLE" pre-panel-id="DatasetHistoryWithSummary" panel-id="Awp0ReplaceDataset" action="resetFileUploadState" sub-panel-context="{upload:true, selectionData:subPanelContext.selectionData}" active-state="data.activeState"></aw-navigate-panel>
    </div>
    <dataset-history-with-summary sub-panel-context="{isLatestDatasetVersionSelected: !conditions.isOlderRevisionSelected}" selection-data="data.selectionData" dataset="data.datasetVMO" show-when="ctx.showFileUploadPanel===undefined"></dataset-history-with-summary>
    <aw-panel-footer exist-when="ctx.showFileUploadPanel===undefined">
        <aw-button button-type="base" action="downloadFile" enable-when="data.selectionData.selected.length > 0">
            <aw-i18n>i18n.DownloadVersionButton</aw-i18n>
        </aw-button>
        <aw-button action="restoreVersionHandler" enable-when="conditions.isPanelObjectModifiable && conditions.isOlderRevisionSelected">
            <aw-i18n>i18n.RestoreVersionButton</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-command-panel>
