<aw-command-panel caption="i18n.importLabelTitle" class="aw-excelroundtrip-importOfficePanel" context="subPanelContext">
    <div show-when="data.sharedData.activeView ==='Arm0ExcelImportSub'">
        <aw-include name="Arm0ExcelImportSub" sub-panel-context="{...subPanelContext, sharedData:fields.sharedData}"></aw-include>
    </div>
    <div class="sw-row flex-auto" visible-when="ctx.isArm0ExcelImportSub2PanelActive">
        <aw-command-sub-panel panel-id="Arm0ImportFromExcelSub" show-when="data.sharedData.activeView === 'Arm0ExcelImportSub'" sub-panel-context="{data: data, ...subPanelContext, sharedData:fields.sharedData }"></aw-command-sub-panel>
        <aw-navigate-panel title="i18n.addProperty" show-when="data.sharedData.activeView === 'Arm0AddPropertiesSub'" panel-id='Arm0AddPropertiesSub' sub-panel-context='{data: data, ...subPanelContext, sharedData:data.sharedData}' action='Arm0AddPropertiesSubbackAction'>
    </div>
</aw-command-panel>
