<aw-panel-header>
    <aw-panel-section exist-when="!ctx.occmgmtContext" collapsed="disabled" caption="i18n.locationLabel">
        <div class="aw-splm-tableRow ui-grid-row aw-row-icon">
            <div class="aw-splm-tableTreeCommandCell aw-jswidgets-tablecell">
                <div class="aw-jswidgets-cellTop aw-jswidgets-uiNonEditCell">
                    <div class="aw-widgets-dataGridCellImage aw-excelroundtrip-FolderImg">
                        <aw-pic class="" is-icon="true" source="subPanelContext.baseSelection.typeIconURL" exist-when="subPanelContext.baseSelection != null"></aw-pic>
                    </div>
                    <div class="aw-jswidgets-tableNonEditContainer aw-layout-flexRowContainer aw-excelroundtrip-FolderText" title="{{subPanelContext.value.selected[0].specName}}">
                        <div class="aw-splm-tableCellText">{{subPanelContext.baseSelection.cellHeader1}}</div>
                    </div>
                </div>
            </div>
        </div>
    </aw-panel-section>
    <br>
    <div class="aw-excelroundtrip-importSubViewContainer">
        <div class="sw-row justify-space-between">
            <div class="sw-column" align-content="start">
                <aw-label prop="data.selectFile"></aw-label>
            </div>
            <div class="sw-column" align-content="end">
                <div class="aw-excelroundtrip-matrixTypeHelpIcon aw-aria-border" tabindex="0" extended-tooltip="Arm0ImportHelpTooltip">
                    <aw-icon icon-id="homehelp"></aw-icon>
                </div>
            </div>
        </div>
        <aw-file-upload type-filter=".xlsm, .xlsx" file-change-action="fileChangeAction" is-required="true" upload-model="data.uploadFileProvider" selection-data="data.uploadFileSelectionData" exist-when="!ctx.occmgmtContext"></aw-file-upload>
    </div>
</aw-panel-header>
<br>
