<aw-panel>
    <aw-panel-body>
        <div>{{data.errorMessage}}</div>
        <br>
        <div>{i18n.multiUserSaveOrDiscard}</div>
        <br>
        <div>{i18n.multiUserSaveWarning}</div>
        <br>
        <aw-checkbox prop="data.multiUserCheckboxMessage" action="updatePreferenceFlag"></aw-checkbox>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button button-type="base" action="cancelEditsAndClosePopup" size="auto" enable-when="data.prefValue === false">{i18n.multiUserDiscardEdits}</aw-button>
        <aw-button action="saveEditsAndClosePopup" size="auto">{i18n.multiUserSaveEdits}</aw-button>
    </aw-panel-footer>
</aw-panel>
