<aw-command-panel class="aw-tcPanels-changeOwner" caption="i18n.Awp0ChangeOwner" context="subPanelContext">
    <aw-panel-body scrollable="true">
        <awp0-change-owner-info exist-when="props.subPanelContext.selectionData.selected" selected-objects="props.subPanelContext.selectionData.selected" selected-users="data.addUserPanelState.selectedUsers"></awp0-change-owner-info>
        <aw-panel-section class="aw-results-section" caption="i18n.user">
            <aw-people-picker sub-panel-context="{...props.subPanelContext, addUserPanelState : data.addUserPanelState}"></aw-people-picker>
        </aw-panel-section>
        <aw-panel-section class="aw-results-section" caption="i18n.relatedObjects" collapsed="true">
            <awp0-change-owner-related-objects sub-panel-context="{...props.subPanelContext, addUserPanelState : data.addUserPanelState}" selection-data="data.selectionData"></awp0-change-owner-related-objects>
        </aw-panel-section>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button size='auto' action="changeOwner" enable-when="conditions.isValidToPerformChangeOwnership"><aw-i18n>i18n.change</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-command-panel>
