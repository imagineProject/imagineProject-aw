<div class="aw-launcher">
    <aw-panel-section class="aw-pinnedTools" caption="{{i18n.Awp0PinnedTools}}" context="{{props.context}}" collapsed="disabled" include-component-name="AwAllToolsLink">
        <aw-command-bar exist-when="conditions.isPinnedToolsAvailable" aw-class="[conditions.isExtraSpacingRequiredForScroll ? 'aw-scrollExptySpace' : '']" anchor="aw_pinnedApps" context="props.ctx.pinnedAppsContext[0]" supports-dynamic-commands="{{true}}" label-position="BOTTOM" show-command-labels="true" context-menu-anchor="aw_pinnedApps_contextMenuAnchor"></aw-command-bar>
        <aw-empty-workarea class="aw-emptyWorkarea" exist-when="!conditions.isPinnedToolsAvailable" title="{{i18n.Awp0NoPinnedToolsTitle}}" hint="{{i18n.Awp0NoPinnedToolsHint}}"></aw-empty-workarea>
    </aw-panel-section>
    <aw-separator></aw-separator>
    <aw-panel-section class="aw-pinnedData" caption="{{i18n.Awp0PinnedObjects}}" collapsed="disabled" >
        <aw-command-bar exist-when="conditions.isPinnedDataAvailable"  aw-class="[{ 'aw-TwoEmptyDataCellsSpace': conditions.TwoEmptyDataCellsApplicableForScroll }, { 'aw-OneEmptyDataCellsSpace': conditions.OneEmptyDataCellsApplicableForScroll }]"    anchor="aw_pinnedData" context="props.ctx.pinnedDataContext[0]" supports-dynamic-commands="{{true}}" label-position="BOTTOM" show-command-labels="true" context-menu-anchor="aw_pinnedData_contextMenuAnchor">
            <aw-pinned-data-cell></aw-pinned-data-cell>
        </aw-command-bar>
        <aw-empty-workarea class="aw-emptyWorkarea" exist-when="!conditions.isPinnedDataAvailable" title="{{i18n.Awp0NoPinnedDataTitle}}" hint="{{i18n.Awp0NoPinnedDataHint}}"></aw-empty-workarea>
    </aw-panel-section>
</div>
