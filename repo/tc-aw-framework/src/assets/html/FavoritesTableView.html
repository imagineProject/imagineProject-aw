<div class="aw-base-scrollPanel" exist-when="!subPanelContext.searchState.totalFound && (!subPanelContext.searchState.columnProvider || subPanelContext.searchState.columnProvider.columnFilters.length === 0 || subPanelContext.searchState.criteria.searchString)" >
  <aw-empty-workarea
      image="graEmptyFavorites"
      title="{{subPanelContext.searchState.provider === 'Awp0FavoritesProvider' ? i18n.noFavoritesFound : i18n.noRecentsFound}}"
      hint="{{subPanelContext.searchState.provider === 'Awp0FavoritesProvider' ? i18n.noFavoritesFoundHint : i18n.noRecentsFoundHint}}">
  </aw-empty-workarea>
</div>
<aw-splm-table gridid="gridView" show-context-menu="true" show-check-box="subPanelContext.showCheckBox" show-when="subPanelContext.searchState.totalFound>0 || (subPanelContext.searchState.columnProvider.columnFilters.length > 0 && !subPanelContext.searchState.criteria.searchString)"></aw-splm-table>
