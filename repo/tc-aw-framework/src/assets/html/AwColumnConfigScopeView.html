<div class="sw-column aw-create-fillAvailable">
    <aw-panel-section class="aw-results-section aw-create-fillAvailable">
        <aw-widget enable-when="conditions.enableScopeSelector" prop="data.columnConfigScope" action="changeScope"></aw-widget>
        <div exist-when="conditions.isGroupScope" class="sw-column aw-columnConfigScope-padding">
            <aw-list-filter prop="data.searchGroups" dataprovider="data.dataProviders.searchForGroups">
                <aw-default-cell vmo="item"></aw-default-cell>
            </aw-list-filter>
        </div>
        <div exist-when="conditions.isRoleScope" class="sw-column aw-columnConfigScope-padding">
            <aw-list-filter prop="data.searchRoles" dataprovider="data.dataProviders.searchForRoles">
                <aw-default-cell vmo="item"></aw-default-cell>
            </aw-list-filter>
        </div>
        <div exist-when="conditions.isWorkspaceScope" class="sw-column aw-columnConfigScope-padding">
            <aw-list-filter prop="data.searchWorkspace" dataprovider="data.dataProviders.workspaceNamesProvider">
                <aw-default-cell vmo="item"></aw-default-cell>
            </aw-list-filter>
        </div>
    </aw-panel-section>
</div>
