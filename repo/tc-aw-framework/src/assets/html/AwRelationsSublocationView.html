<aw-show-object-page header-title="subPanelContext.showObjectContext.displayName" class="aw-relationsTreeSublocation"
    browser-sub-title="subPanelContext.showObjectContext.displayName">
    <aw-show-object-header headerVMO="subPanelContext.openedObject" header-data="subPanelContext.headerData"
        header-props="subPanelContext.showObjectContext.xrtViewModel.data._headers">
        <div class='sw-row w-12'>
            <div>{{subPanelContext.showObjectContext.displayName}}</div>
        </div>
        <aw-global-search exist-when="subPanelContext.provider.headerPreference.hideGlobalSearch !== true"
            showsearchbox="{{subPanelContext.showsearchbox}}"></aw-global-search>
        <aw-logo exist-when="subPanelContext.provider.headerPreference.hideLogo !== true"></aw-logo>
    </aw-show-object-header>
    <div></div>
    <aw-standard-sublocation provider="data._sublocation"
        sub-panel-context="subPanelContext" search-state="data.searchState"
        base-selection="subPanelContext.openedObject" selection-model="selectionModels.relationsTreeSelectionModel">
        <aw-relations-tree-breadcrumb selection="data.searchState.pwaSelection" base-selection="subPanelContext.openedObject">
        </aw-relations-tree-breadcrumb>
    </aw-standard-sublocation>
</aw-show-object-page>
