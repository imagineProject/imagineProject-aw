
<aw-panel-body>
    <aw-radiobutton class="sw-column" prop="data.columnComplexity" list="data.columnComplexityOptions.dbValue"></aw-radiobutton>
    <aw-panel-section caption="i18n.addTableConfigColumnTypeTitle">
        <aw-type-selector class-name='aw-objectType-listbox' prop="data.objectTypeListBox" placeholder="i18n.ARRAY_PLACEHOLDER_TEXT" include="BusinessObject" load-sub-types=true override-id="tableConfiguratorTypeSelector" search-input="data.typeSearchInput" show-duplicate-text="true"></aw-type-selector>
    </aw-panel-section>
    <aw-panel-section caption="i18n.addTableConfigColumnPropertyTitle" visible-when="conditions.isPropertyTypeSelected && !conditions.isAdvancedColumnComplexity">
        <aw-widget prop="data.associatedProperties"></aw-widget>
    </aw-panel-section>
    <aw-panel-section caption="i18n.addTableConfigColumnPropertyTitle" visible-when="conditions.isAdvancedColumnComplexity" anchor-position="RIGHT" anchor="aw_TableConfigurator_addPropDCP" hide-commands-when-collapsed="true">
        <aw-widget prop="data.dcpProperty"></aw-widget>
    </aw-panel-section>
    <aw-numeric class="hidden" prop="data.columnWidth"></aw-numeric>
    <aw-widget class="hidden" prop="data.columnHidden"></aw-widget>
    <aw-widget class="hidden" prop="data.columnFiltering"></aw-widget>
</aw-panel-body>
<aw-panel-footer>
    <aw-button action="addColumn" size="auto" enable-when="conditions.isValidForm"><aw-18n>i18n.add</aw-18n></aw-button>
</aw-panel-footer>
