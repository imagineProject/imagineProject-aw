<div exist-when="props.subPanelContext.sortDirection === 'Ascending'">
    <div class="aw-extended-tooltipTitle">
        {{i18n.sortAscendingTitle}}
    </div>
    <br/>
        {{i18n.sortAscendingDescription}}
</div>
<div exist-when="props.subPanelContext.sortDirection === 'Descending'">
    <div class="aw-extended-tooltipTitle">
        {{i18n.sortDescendingTitle}}
    </div>
    <br/>
        {{i18n.sortDescendingDescription}}
</div>
