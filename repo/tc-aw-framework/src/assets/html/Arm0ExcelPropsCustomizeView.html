<aw-panel-body class="aw-excelroundtrip-arrangePanel">
    <div class="sw-column h-12 my-normal aw-arrange-panel">
        <div class="sw-row flex-shrink">
            <div class="sw-column w-5">
                   <aw-label prop="data.columnConfigName" class="aw-arrange-columnConfigLabel"></aw-label>
            </div>
            <div class="sw-column w-2"></div>
            <div class="sw-column w-5">
                <aw-command-bar anchor="arm0ArrangeCommandbar" context="data" alignment="HORIZONTAL"></aw-command-bar>
            </div>
        </div>

        <div class="sw-row aw-arrange-noSelect justify-space-between h-12">
            <div class="sw-column flex-auto w-6">
                <div class="sw-row flex-auto">
                    <!-- Include Available columns list -->
                    <aw-include name="AwArrangeAvailable" sub-panel-context="{
                        filterAvailableBox: fields.filterAvailableBox,
                        dataProviderAvailableColumnConfigs: data.dataProviders.dataProviderAvailableColumnConfigs,
                        arrangeData: data.arrangeData
                    }"></aw-include>
                </div>
            </div>
            <div class="aw-arrange-columnCommandsContainer sw-column justify-center align-center">
                <aw-command-bar anchor="arrangeTwoPanelCommandbar" context="data" alignment="VERTICAL"></aw-command-bar>
            </div>
            <div class="sw-column my-normal flex-auto w-6">
                <div class="sw-row flex-auto">
                    <aw-command-panel-section caption="i18n.tableColumnsTitle" name="arrangeTableColumnsSection" collapsed="disabled">
                        <!-- Include Displayed columns list -->
                        <aw-include name="AwArrangeDisplayed" sub-panel-context="{
                            filterBox: fields.filterBox,
                            dataProviderColumnConfigs: data.dataProviders.dataProviderColumnConfigs,
                            arrangeData: data.arrangeData }"></aw-include>
                    </aw-command-panel-section>
                </div>
                <div class="sw-row flex-shrink">
                    <div class="sw-column my-normal justify-space-around w-12">
                            <aw-checkbox class="export-arrangement-checkbox" prop="data.newColumnConfig" action="markDirty" visible-when="data.arrangeData.columnConfigId" ></aw-checkbox>
                            <aw-textbox prop="data.newColumnConfigName" visible-when="data.newColumnConfig.dbValue" id="arrange_newColumnConfigName"></aw-textbox>
                    </div>
                </div>
            </div>
        </div>
    </div>
</aw-panel-body>
