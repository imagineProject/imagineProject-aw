<aw-panel-body>
    <div class="aw-jswidgets-loadingItem" exist-when="conditions.displayLoading">
        <div class="aw-jswidgets-loading">&nbsp;</div>
    </div>
    <div class="aw-jswidgets-lov-novals" exist-when="conditions.showNoVals">
        i18n.NO_LOV_VALUES
    </div>
    <aw-add-lov-entry is-focused="{{conditions.focusLink}}" exist-when="conditions.showSuggestionLink" entry-value="{{props.subPanelContext.filterString}}" add-entry-callback="props.subPanelContext.addLovEntry"></aw-add-lov-entry>
    <aw-splm-table gridid="lovTableProvier" show-when ="!conditions.displayLoading && !conditions.isEmptyTable" ></aw-splm-table>
</aw-panel-body>
