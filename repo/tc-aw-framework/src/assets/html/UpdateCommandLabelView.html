<aw-panel>
    <aw-panel-body>
        <aw-textbox prop="data.updateLabel" aw-enter="actions.performCommandLabelUpdate"></aw-textbox>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button class='medium' button-type='base' action="cancelUpdateLabel">{{i18n.Awp0Cancel}}</aw-button>
        <aw-button class='medium' aw-class="{'disabled': data.updateLabel.dbValue.length === 0}" action="performCommandLabelUpdate">{{i18n.Awp0Done}}</aw-button>
    </aw-panel-footer>
</aw-panel>
