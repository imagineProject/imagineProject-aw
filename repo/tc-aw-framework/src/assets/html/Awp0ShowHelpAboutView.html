<aw-panel>
    <aw-panel-body visible-when="data.copyrightText">
        <aw-label prop="data.build"></aw-label>
        <aw-label prop="data.buildId"></aw-label>
        <aw-label prop="data.clientBuildTime"></aw-label>
        <aw-label prop="data.sessionLog"></aw-label>
        <div visible-when="data.clientFramework.dbValue">
            <div show-when="data.lessDetails === false">
                <aw-label prop="data.clientFramework" ></aw-label>
                <aw-label prop="data.clientViewer"></aw-label>
            </div>
            <div class="sw-property sw-row justify-justified">
                <aw-link visible-when='data.lessDetails === true' action="getMoreDetails" prop="data.showMore"></aw-link>
                <aw-link visible-when='data.lessDetails === false' action="getLessDetails" prop="data.showLess"></aw-link>
            </div>
        </div>
        <div>{i18n.COPYRIGHT_MESSAGE}</div>
        <div>{i18n.COPYRIGHT_DATE_TEXT} {{data.copyrightText}}</div>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button button-type="base" action="closePopupWindow" size="auto">{i18n.closeText}</aw-button>
    </aw-panel-footer>
</aw-panel>
