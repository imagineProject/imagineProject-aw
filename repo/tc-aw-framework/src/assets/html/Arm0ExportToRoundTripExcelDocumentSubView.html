<aw-panel-body class="aw-layout-flexColumnContainer">
     <!-- Settings section for export options -->
    <aw-panel-section caption="i18n.settingsLabel" name="PanelSectionSettings" visible-when="conditions.showSettingsSection">
        <aw-checkbox prop="data.exportAsStructure" visible-when="conditions.exportAsStructureVisibleCondition" action="revealAceColumnArrangePanel"> </aw-checkbox>
        <!-- Radio buttons for export configuration -->
        <div class="aw-excelroundtrip-radiobuttons">
             <!-- Levels to export selection -->
            <div class="sw-row" visible-when="conditions.exportLevelsVisibleCondition">
                <div class="sw-column w-8">
                    <aw-radiobutton enable-when="conditions.exportLevelsEnableCondition" prop="data.levelsToExport" action="resetLevelsExportOptions"></aw-radiobutton>
                </div>
                <aw-numeric class="aw-excelroundtrip-levelNumericBox" visible-when="conditions.exportLevelNumericBoxVisibleCondition" prop="data.exportLevelsCount"></aw-numeric>
            </div>
            <!-- Export to single or multiple sheet option -->
            <div class="sw-column w-8">
                <aw-radiobutton prop="data.exportToSingleSheet" enable-when="conditions.exportToSingleSheetEnableCondition" visible-when="conditions.exportAsStructureVisibleCondition"></aw-radiobutton>
            </div>
        </div>
        <!-- Checkbox for ID hyperlink option -->
        <aw-checkbox prop="data.idHyperlink"> </aw-checkbox>
    </aw-panel-section>
    <aw-panel-section caption="i18n.selectExportProperties" name="PanelSectionProperties">
        <aw-column width="0.5f"></aw-column>
        <aw-column width="fill">
            <aw-listbox prop="data.excelTemplates" list="props.subPanelContext.excelTemplatesList"></aw-listbox>
        </aw-column>
    </aw-panel-section>
    <aw-command-sub-panel visible-when="data.excelTemplates.dbValue === i18n.customPropertyTitle" sub-panel-context="{...subPanelContext, exportAsStructure:data.exportAsStructure}" class="aw-arrange-columnProperties" panel-id="Arm0ExcelPropsCustomize">
    </aw-command-sub-panel>
</aw-panel-body>
<aw-panel-footer class="aw-excelroundtrip-footer">
    <aw-flex-row>
        <aw-checkbox prop="data.runInBackgroundExcelExport"
            visible-when="conditions.runInBackgroundVisibilityCondition"></aw-checkbox>
    </aw-flex-row>
    <aw-button action="updateCtxAndExportExcel" enable-when="conditions.exportEnableCondition" visible-when="conditions.exportVisibleCondition">
        <aw-i18n>i18n.export</aw-i18n>
    </aw-button>
    <aw-button action="updateCtxAndExportExcel" class="update_or_create_new_arrangement_exportbutton" enable-when="conditions.saveAndExportEnableCondition" visible-when="conditions.saveAndExportVisibleCondition">
        <aw-i18n>i18n.saveAndExport</aw-i18n>
    </aw-button>
</aw-panel-footer>
