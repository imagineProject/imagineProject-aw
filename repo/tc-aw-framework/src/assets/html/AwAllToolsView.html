<div class="aw-allTools">
    <aw-link prop="data.back" action="goBack"></aw-link>
    <aw-search-box prop="data.searchBox" placeholder="data.searchBoxPlaceHolder.dbValue" action="loadAllApps" reset-action="loadAllApps"></aw-search-box>
    <aw-list dataprovider="data.dataProviders.allApps" show-context-menu="true" command-context="props.context">
        <aw-all-tools-cell item="item" sub-panel-context="{popupApi:props.context.popupApi, runActionWithViewModel: props.runActionWithViewModel}"></aw-all-tools-cell>
    </aw-list>
</div>
