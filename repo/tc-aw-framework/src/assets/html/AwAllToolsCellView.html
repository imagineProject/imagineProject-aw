<div class='sw-row aw-list-cell' aw-click="actions.navigateToTool">
    <img class='aw-base-icon aw-type-icon sw-flex-column' src={{props.item.typeIconURL}} alt={{props.item.modelType.displayName}} />
    <div class='sw-column flex-auto sw-cell-header-title-container'>
        <div class='sw-cell-header-title sw-flex-row'>
            <div class='sw-cell-header-text' title="{{props.item.cellHeader1}}" displayVal="{{props.item.cellHeader1}}">{{props.item.cellHeader1}}</div>
        </div>
    </div>
</div>
