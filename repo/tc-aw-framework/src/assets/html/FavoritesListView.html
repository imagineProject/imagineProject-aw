<aw-empty-workarea class="aw-base-scrollPanel"
    exist-when="!subPanelContext.searchState.totalFound"
    image="graEmptyFavorites"
    title="{{subPanelContext.searchState.provider === 'Awp0FavoritesProvider' ? i18n.noFavoritesFound : i18n.noRecentsFound}}"
    hint="{{subPanelContext.searchState.provider === 'Awp0FavoritesProvider' ? i18n.noFavoritesFoundHint : i18n.noRecentsFoundHint}}">
</aw-empty-workarea>

<aw-list show-when="subPanelContext.searchState.totalFound > 0"
  dataprovider="data.dataProviders.listDataProvider"
  show-context-menu="true"
  show-check-box="subPanelContext.showCheckBox">
    <aw-default-cell vmo="item"></aw-default-cell>
</aw-list>
