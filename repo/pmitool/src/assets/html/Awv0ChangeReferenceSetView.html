<aw-panel>
    <aw-panel-body>
        <div class="aw-refSet-change-panel-label">
            <aw-label prop="data.referenceSetLabel"></aw-label>
        </div>
        <div class="aw-refSet-change-panel">
            <aw-list dataprovider="data.dataProviders.dataProviderListReferenceSets">
                <aw-default-cell vmo="item" hideoverlay="true"></aw-default-cell>
            </aw-list>
        </div>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="closePopupWindow" size="auto">i18n.cancel</aw-button>
        <aw-button action="applyPreferenceSet" enable-when="conditions.isDifferentRefSet" size="auto">i18n.apply</aw-button>
    </aw-panel-footer>
</aw-panel>
