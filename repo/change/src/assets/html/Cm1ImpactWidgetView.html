<aw-panel>
    <aw-panel-header>
        <div class="aw-change-affectedItemsTableLabel">
            <aw-label prop="data.impactAnalysisOverviewLabel"></aw-label>
        </div>
        <aw-row>
            <aw-listbox class="aw-change-impactedAnalysisListBox" prop="data.selectedProblemItem" list="data.problemItems" action="handleProblemItemSelection"></aw-listbox>
        </aw-row>
    </aw-panel-header>
    <aw-panel-body>
        <div class="sw-row">
            <div class="sw-column w-6">
                <aw-panel-section caption="{{data.selectionDisplayName}}">
                    <div exist-when="ctx.ImpactsViewMode === 'TableView' && data.problemItemLOVLoaded === true">
                        <cm1-parent-traversal sub-panel-context="{selectionModel:selectionModels.impactCandidatesSelModel,selectionData:data.candidateTable,
                                        configState: data.configurationState}" change-object="subPanelContext.selected" selected-problem-item="data.selectedProblemItem.dbValue" cm1-impact-widget-state="data.cm1ImpactWidgetState"></cm1-parent-traversal>
                    </div>
                    <div class="sw-row" exist-when="ctx.ImpactsViewMode === 'RelationView' && data.problemItemLOVLoaded === true">
                        <div class="sw-column w-13">
                            <div class="sw-row">
                                <aw-command-bar anchor="cm1_addImpactedItemCommandsLeftFirst" alignment="HORIZONTAL">
                                </aw-command-bar>
                            </div>
                            <div class="sw-row flex-auto">
                                <div class="aw-change-relationView-layout">
                                    <rv1-relations-browser sub-panel-context="{...subPanelContext, selected:data.selectedObj}"></rv1-relations-browser>
                                </div>
                            </div>
                        </div>
                        <div class="sw-column flex-auto justify-right align-right w-2">
                            <div class="aw-change-impactedAnalysisRBArrows w-12">
                                <aw-command-bar class="w-12" anchor="cm1_addImpactedItemCommandsClick" context="data.cm1ImpactWidgetState"></aw-command-bar>
                            </div>
                        </div>
                    </div>
                </aw-panel-section>

                <div class="sw-row" exist-when="ctx.ImpactsViewMode === 'TableView' && data.problemItemLOVLoaded === true">
                    <cm1-related-object sub-panel-context="{selectionModel:selectionModels.relatedItemsSelModel,selectionData:data.relatedTable}" change-object="subPanelContext.selected" cm1-impact-widget-state="data.cm1ImpactWidgetState"></cm1-related-object>
                </div>
            </div>
            <aw-splitter direction="VERTICAL" is-primary-splitter="true" splitter-id="cm1ImpactAnalysisSplitter"></aw-splitter>
            <div class="sw-column w-6">
                <aw-panel-section caption="i18n.persistedImpactesTitle">
                    <cm1-persisted-impacted sub-panel-context="{selectionModel:selectionModels.impactItemsSelMoel,selectionData:data.impactedItemsTable}" change-object="subPanelContext.selected" cm1-impact-widget-state="data.cm1ImpactWidgetState"></cm1-persisted-impacted>
                </aw-panel-section>
            </div>
        </div>
    </aw-panel-body>
</aw-panel>
