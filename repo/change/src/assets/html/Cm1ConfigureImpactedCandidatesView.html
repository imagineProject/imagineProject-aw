<aw-command-panel caption="i18n.Configuration" context="subPanelContext">
    <aw-panel-body>
        <aw-panel-section caption="i18n.revRule">
            <aw-link-with-popup prop="data.revRule" dataprovider="data.dataProviders.revisionRules">
                <cm1-filterable-revision-rules></cm1-filterable-revision-rules>
            </aw-link-with-popup>
        </aw-panel-section>
        <aw-panel-section caption="i18n.effectivity"
            visible-when="conditions.doesEffectivitySingleSelectExist">
            <aw-widget prop="data.effectivity"></aw-widget>
        </aw-panel-section>
        <aw-panel-section caption="i18n.effectivity"
            visible-when="conditions.doesEffectivityMultiSelectExist">
            <aw-widget prop="data.effListBox" action="doUpdateEffectivityListBox1"></aw-widget>
        </aw-panel-section>
        <aw-panel-section caption="i18n.parentId"
            visible-when="conditions.isSmartDiscoveryEnabled && conditions.doesProdIDSingleSelectExist">
            <aw-widget prop="data.productIDSingle"></aw-widget>
        </aw-panel-section>
        <aw-command-panel-section caption="i18n.parentId"
            visible-when="conditions.isSmartDiscoveryEnabled && conditions.doesProdIDMultiSelectExist">
            <aw-widget prop="data.productIDLOV" action="doUpdateProductIDListBox1"></aw-widget>
        </aw-command-panel-section>
            <label class="aw-change-impactAnalysisConfigNote">{{i18n.Cm1ConfigurePanelNote}}</label>
            <aw-panel-footer class="aw-change-impactAnalysisConfigBtn">  
                <div class="sw-row justify-right align-right">
                    <aw-button class='medium' action="updateConfigStateAndReloadImpactedCandidates">{{i18n.Configure}}</aw-button>
                </div>
        </aw-panel-footer>
    </aw-panel-body>
</aw-command-panel>
