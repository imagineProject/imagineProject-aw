<div class="sw-column w-12">
    <aw-panel-section caption="{{data.selectionDisplayName}}">
        <div class="aw-change-impactedItemsEmptySectionImage aw-change-emptySection" visible-when="conditions.noRelatedItemsLoaded">
            <aw-empty-workarea
                title="i18n.noRelatedItemsFound"
                hint="i18n.noRelatedItemsImageHintTitle">
            </aw-empty-workarea>
        </div>
        <div class="aw-change-impactedItemsEmptySectionImage aw-change-emptySection" visible-when="conditions.noSelectionInProbableVMOs">
            <aw-empty-workarea
                title="i18n.noSelection"
                hint="i18n.noRelatedItemsImageHintTitle">
            </aw-empty-workarea>
        </div>
        <div class="sw-row">
                <div class="sw-column" visible-when="conditions.hasLoadedRelatedVMOs">
                        <div class="aw-change-legendContainer">
                            <div class="aw-change-imageLabel">i18n.legendTitle</div>
                            <div class="aw-change-imageLabel">
                                <img class="aw-charts-chartColor2"/>i18n.Impacted
                            </div>
                            <div class="aw-change-imageLabel">
                                <img class="aw-charts-chartColor7"/>i18n.NotImpacted
                            </div>
                        </div>
                </div>
                <div class="sw-column flex-auto justify-right align-right">
                    <div class="aw-xrt-objectSetToolbar" visible-when="conditions.hasLoadedRelatedVMOs">
                        <aw-command-bar class="aw-commands-commandBarHorizontalLeft" anchor="cm1_relatedObjNotImpactedCommand,cm1_addImpactedItemCommandsLeft" context="{dataProvider: data.dataProviders.relationImpactedDataProvider}"
                            alignment="HORIZONTAL"></aw-command-bar>
                    </div>
                </div>
            </div>
        <div class="sw-row">
            <div class="aw-base-scrollPanel aw-splm-table-overflow-visible aw-layout-fill" visible-when="conditions.hasLoadedRelatedVMOs">
                <aw-splm-table gridid="relationProbableImpactedGrid" use-tree="false" show-check-box="data.dataProviders.relationImpactedDataProvider.selectionModel.multiSelectEnabled"></aw-splm-table>
            </div>
        </div>
    </aw-panel-section>
</div>
