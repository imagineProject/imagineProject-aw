<aw-header-contribution
    exist-when="(props.subPanelContext.occContext.currentState.incontext_uid != undefined) && (props.subPanelContext.occContext.currentState.incontext_uid != null)">
    <ace-override-context sub-panel-context="props.subPanelContext.occContext.currentState.incontext_uid"></ace-override-context>
</aw-header-contribution>

<aw-header-contribution>
    <aw-property-label prop="data.revisionRule"></aw-property-label>
    <awb0-revision-rule sub-panel-context="props.subPanelContext" ></awb0-revision-rule>
</aw-header-contribution>

<aw-header-contribution>
    <aw-property-label prop="data.effectiveDate"></aw-property-label>
    <awb0-date-effectivity location="aw_navigation" sub-panel-context="props.subPanelContext"></awb0-date-effectivity>
    <div>&nbsp;&nbsp;</div>
    <aw-property-non-edit-val prop="data.effectivityEndItem" exist-when="data.effectivityEndItem.uiValue && props.subPanelContext.occContext.supportedFeatures.Awb0DateEffectivityConfigFeature && !props.subPanelContext.occContext.supportedFeatures.Awb0UnitEffectivityConfigFeature">
    </aw-property-non-edit-val>
</aw-header-contribution>

<aw-header-contribution exist-when="props.subPanelContext.occContext.supportedFeatures.Awb0UnitEffectivityConfigFeature">
    <aw-property-label prop="data.units" class="effectivityUnitLink"></aw-property-label>
    <awb0-unit-effectivity location="aw_navigation" sub-panel-context="{configUnitEndItem: fields.configUnitEndItem, ...subPanelContext, activeView: data.activeView}"></awb0-unit-effectivity>
    <div>&nbsp;&nbsp;</div>
    <aw-property-non-edit-val prop="data.effectivityEndItem" exist-when="data.effectivityEndItem.uiValue">
    </aw-property-non-edit-val>
</aw-header-contribution>
