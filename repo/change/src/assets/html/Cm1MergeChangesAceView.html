<aw-panel-body class="aw-layout-flexColumnContainer aw-change-aceSplitView">
    <div class="sw-row afx-layout-header-container" exist-when="subPanelContext.openedObject && subPanelContext.provider">
        <aw-model-icon vmo="subPanelContext.openedObject" ></aw-model-icon>
        <div class="sw-column" >
            <div class="sw-row aw-layout-breadCrumbContainer">
                <label class="aw-change-mergeDisplayLabel"> {{subPanelContext.provider.displayLabel.text}} </label>
                <span class="aw-change-mergeDisplayLabel"> {{subPanelContext.provider.displayLabel.separator}} </span>
                <occmgmt-breadcrumb occ-context="subPanelContext.occContext ? subPanelContext.occContext : data.occContext">
                </occmgmt-breadcrumb>
            </div>
            <div class="sw-row mx-large flex-wrap">
                <aw-visual-indicator vmo="subPanelContext.openedObject"></aw-visual-indicator>
                <aw-logo exist-when="!subPanelContext.provider.headerPreference.hideLogo"></aw-logo>
                <ace-split-header sub-panel-context="{...subPanelContext,occContext:subPanelContext.occContext ? subPanelContext.occContext : data.occContext,  provider: subPanelContext.provider ? subPanelContext.provider : data._sublocation, contextKey: subPanelContext.provider && subPanelContext.provider.contextKey ? subPanelContext.provider.contextKey : data._sublocation.contextKey}"></ace-split-header>
            </div>
        </div>
    </div>
    <ace-data-navigator sub-panel-context="{...subPanelContext, occContext: subPanelContext.occContext, selectionQueryParamKey : subPanelContext.provider.selectionQueryParamKey }"
        provider="subPanelContext.provider" contextKey="subPanelContext.provider.contextKey" baseSelection="subPanelContext.baseSelection">
    </ace-data-navigator>
    <aw-splitter direction="horizontal">
    </aw-splitter>
    <div class="aw-layout-flexibleWorkarea sw-row h-6 flex-auto" visible-when="subPanelContext.occContext.pwaSelectionSource === 'primary' && subPanelContext.occContext.pwaSelection[0]">
        <aw-panel-section>
            <aw-xrt type="SUMMARY" vmo="subPanelContext.occContext.pwaSelection[0]" xrt-state="data.xrtState" sub-panel-context="{context : {occContext : subPanelContext.occContext}}"></aw-xrt>
        </aw-panel-section>
    </div>
</aw-panel-body>
