<div class="sw-column">
    <div visible-when="conditions.isEmptyPersistedVMOs" class="aw-change-impactedItemsEmptySectionImage">
        <aw-empty-workarea image="graEmptyGeneric" title="i18n.noImpactedItemAddedImgTitle" hint="i18n.noImpactedItemAddedImgHintTitle">
        </aw-empty-workarea>
    </div>
    <div class="aw-xrt-objectSetToolbar" visible-when="conditions.isEmptyPersistedVMOs === false">
        <aw-command-bar anchor="cm1_addImpactedItemCommandsLeft,cm1_removeImpactedItemCommands" context="{dataProvider: data.dataProviders.persistedImpactedDataProvider}" class="aw-commands-commandBarHorizontalRight"
            alignment="HORIZONTAL"></aw-command-bar>
        <div class="aw-xrt-objectSetCommandPanel">
            <aw-command-bar anchor="cm1_addImpactedItemCommandsRight" context="data" class="aw-commands-commandBarHorizontalLeft" alignment="HORIZONTAL"></aw-command-bar>
        </div>
    </div>
    <div class="aw-layout-flexColumn aw-base-scrollPanel aw-splm-table-overflow-visible" show-when="conditions.isEmptyPersistedVMOs === false">
        <aw-splm-table gridid="persistedImpactedGrid" use-tree="false" show-check-box="data.dataProviders.persistedImpactedDataProvider.selectionModel.multiSelectEnabled"></aw-splm-table>
    </div>
</div>
