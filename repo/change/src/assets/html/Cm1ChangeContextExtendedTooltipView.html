<div exist-when="conditions.activeChange">
    <div class="aw-extended-tooltipTitle">{{i18n.activeChangeTitle}}</div>
    <p>{{data.activeChangeDisplayString}}</p>
    <br/>
    <p>{{i18n.activeChangeDesc}}</p>
</div>
<div exist-when="conditions.noActiveChange">
    <div class="aw-extended-tooltipTitle">{{i18n.noActiveChangeTitle}}</div>
    <p>{{i18n.noActiveChange}}</p>
    <br/>
    <p>{{i18n.noActiveChangeDesc}}</p>
</div>
