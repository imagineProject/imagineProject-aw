    <aw-panel-body>
        <aw-xrt class="sw-section-alignLabelsDefault" type="INFO" vmo="subPanelContext.selectionData.selected[0]" xrt-state="data.xrtState" active-page-id="{{subPanelContext.selectedTab.dbValue}}"

    </aw-panel-body>
