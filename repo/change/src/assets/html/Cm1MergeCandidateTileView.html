<div aw-class="[conditions.isMergeConflict ? 'aw-change-mergeCandidateConflictTileBorder aw-change-mergeCandidateTileBorder' : 'aw-change-mergeCandidateTileBorder']" class="sw-row flex-auto">
    <div class="sw-column justify-left aw-change-mergeTileTitleBorder">
        <aw-default-cell vmo="props.mergeItem.mergeCandidateItem.objectToBeMerged"></aw-default-cell>
    </div>
    <div class="sw-column flex-grow" >
        <div class="sw-row justify-right aw-change-mergeCandidatesTile">
            <h6 class="{{props.mergeItem.mergeCandidateItem.mergeAction.internalName}}">{{props.mergeItem.mergeCandidateItem.mergeAction.displayName}}</h6>
        </div>

        <div class="sw-row justify-right aw-change-mergeTileMergeBtnBorder">
            <aw-button class="small aw-change-mergeButton" button-type="base" action="callMergeChangeSoa" visible-when="conditions.isNotAlreadyMerged">
                <aw-i18n>i18n.Cm1MergeChangesTitle</aw-i18n>
            </aw-button>
        </div>
        <div class="sw-row align-self-right aw-change-mergeButton" visible-when="!conditions.isNotAlreadyMerged">
            <aw-label class="font-semi-bold" prop="data.mergeCompleteLabel"></aw-label>
        </div>
    </div>
</div>
