<aw-dialog action="detailsOfChangeDialogAction"
    sub-panel-context="{selectionData: fields.changeSummarySelectionData, detailsOfChangesState: fields.detailsOfChangesState, selectedTab: fields.selectedTab}">
</aw-dialog>
<div class="aw-viewer-gallery aw-change-changeSummary2Viewer">
    <div class="aw-layout-panelSection">
        <div class="aw-commands-commandBar">
            <div class="aw-change-detailsOfChangesContainer sw-row">
                <div class="aw-commandBar-container sw-column w-12">
                    <div class="aw-change-changeSummaryTableSection">
                        <aw-command-panel-section caption="{{ subPanelContext.fullScreenState.value === true ? '' : i18n.aw_changeSummary }}" collapsed="false">
                            <div class="sw-row justify-justified">
                                <div class="sw-column">
                                    <div class="sw-row flex-wrap aw-change-impactedItemsLovContainer">
                                        <aw-widget prop="data.impactedItemsLov" placeholder="ALL" options="data.bulkSelect"></aw-widget>
                                        <aw-command-bar anchor="aw_changeSummaryViewer" show-command-labels="true" hide-more="true" context="{...subPanelContext.context, fullScreenState: subPanelContext.fullScreenState, selectionData: subPanelContext.selectionData, detailsOfChangeDialogAction: actions.detailsOfChangeDialogAction, detailsOfChangesState: fields.detailsOfChangesState, selectedMergeFilter: data.selectedMergeFilter }"></aw-command-bar>
                                    </div>
                                </div>
                                <div class="sw-column">
                                    <aw-server-visibility-command-bar anchor="aw_changeSummaryViewerRight,aw_fullScreen" hide-more="true" context="{...subPanelContext.context, fullScreenState: subPanelContext.fullScreenState, selectionData: fields.changeSummarySelectionData, detailsOfChangeDialogAction: actions.detailsOfChangeDialogAction, detailsOfChangesState: fields.detailsOfChangesState, selectedTab: fields.selectedTab }"></aw-server-visibility-command-bar>
                                </div>
                            </div>
                            <aw-splm-table class="aw-change-changeSummaryTable" use-tree="true" gridid="changeSummaryGrid2" ></aw-splm-table>
                        </aw-command-panel-section>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
