<aw-command-panel caption="i18n.addPanelTitle" context="{ ...data, ...subPanelContext }">
    <div class="aw-layout-flexColumn" show-when="data.activeState.value.activeView==='AddObjectPrimarySub'">
        <aw-add visible-when="data.activeView!='AssignProjectSub' && data.activeView!='addReferenceSub'"
            target-object="ctx.xrtSummaryContextObject"
            relations="CMHasImpactedItem"
            auto-select-on-unique-type="true"
            include-types="Item"
            type-filter="ItemRevision,Mdl0ModelElement,Cfg0AbsConfiguratorWSO,Bom0ConfigurableBomElement,Fnd0AbstractOccRevision"
            visible-tabs="palette,search"
            add-panel-state="fields.addPanelState"
            sub-panel-context="{ triggerCreate: data.triggerCreate, addObject: { refreshFlag: true }, ...subPanelContext, triggerAddACopy: data.triggerAddACopy }"
            active-state="data.activeState"
            project-state="data.projectState"
            xrt-state="data.xrtState"
            edit-handler="editHandlers.addPanelEditHandler"></aw-add>
        <aw-panel-footer>
            <!-- Button to add a copy from the Palette or Search tab -->
            <div visible-when="(conditions.isAddInPaletteTabPage || conditions.isAddInSearchTabPage)">
                <aw-button size="auto" button-type="base" default="true" action="isObjSelectedForAddACopyAction" enable-when="conditions.isPaletteSearchTabAddButtonEnabled && conditions.isPaletteSearchTabAddACopyButtonEnable" visible-when="!conditions.isPaletteSearchTabAddACopyCancelButtonVisible">
                    <aw-i18n>i18n.addACopy</aw-i18n>
                </aw-button>
            </div>
            <!-- Button to cancel the 'Add a Copy' action -->
            <aw-button size="auto" button-type="base" default="true" action="toggleAddACopy" visible-when="conditions.isPaletteSearchTabAddACopyCancelButtonVisible" >
                <aw-i18n>i18n.cancelText</aw-i18n>
            </aw-button>
            <!-- panel-footer button for Add, Add a Copy sub Panel -->
            <div visible-when="(conditions.isAddInPaletteTabPage || conditions.isAddInSearchTabPage)">
                <!-- Button to confirm adding a copy when the 'Add a Copy' mode is active -->
                <aw-button size="auto" default="true" action="addACopyObject" visible-when="conditions.isPaletteSearchTabAddACopyCancelButtonVisible">
                    <aw-i18n>i18n.addButtonTitle</aw-i18n>
                </aw-button>
                <!-- Button to add a selected object (when not in 'Add a Copy' mode) -->
                <aw-button size="auto" default="true" action="IsSelectedObjAssociatedWithDiffChange" enable-when="conditions.isPaletteSearchTabAddButtonEnabled" visible-when="!conditions.isPaletteSearchTabAddACopyCancelButtonVisible">
                    <aw-i18n>i18n.addButtonTitle</aw-i18n>
                </aw-button>
            </div>
        </aw-panel-footer>
    </div>
    <aw-add-navigate active-state="data.activeState" project-state="data.projectState" action="actions.setActiveView"></aw-add-navigate>
</aw-command-panel>
