<div class="sw-column">
    <div class="sw-row aw-change-impactAnalysisConfig">
        <aw-label prop="data.selectedRevRule"></aw-label>
        <aw-label class="aw-change-impactAnalysisConfigLabel" prop="data.selectedEffectivity"></aw-label>
        <aw-popup-wrapper popup="selectedEffectivitiesPopup">
            <aw-button button-type='chromeless' class='small-linkButton' visible-when="subPanelContext.configState.displayValues.selectedEffectivities.length > 0" action="selectedEffectivitiesPopup">{{i18n.Cm1DisplayMoreConfig}}</aw-button>
        </aw-popup-wrapper>
        <aw-label class="aw-change-impactAnalysisConfigLabel" prop="data.selectedParentId"></aw-label>
        <aw-popup-wrapper popup="selectedParentIdsPopup">
            <aw-button button-type='chromeless' class='small-linkButton' visible-when="subPanelContext.configState.displayValues.selectedProductIDs.length > 0" action="selectedParentIdsPopup">{{i18n.Cm1DisplayMoreConfig}}</aw-button>
        </aw-popup-wrapper>
    </div>
    <div class="sw-row">
        <div class="sw-column">
                <div class="aw-change-legendContainer">
                    <div class="aw-change-imageLabel">i18n.legendTitle</div>
                    <div class="aw-change-imageLabel">
                        <img class="aw-charts-chartColor2"/>i18n.Impacted
                    </div>
                    <div class="aw-change-imageLabel">
                        <img class="aw-charts-chartColor7"/>i18n.NotImpacted
                    </div>
                </div>
        </div>
        <div class="sw-column flex-auto justify-right align-right">
            <div class="sw-row flex-auto">
                <div class="aw-xrt-objectSetToolbar">
                    <aw-command-bar class="aw-commands-commandBarHorizontalRight aw-change-impactedCandidateHorizontalRightCommandBar" anchor="cm1_configure,cm1_notImpactedCommand,cm1_addImpactedItemCommandsLeft,cm1_addImpactedItemCommandsRightFirst,cm1_addImpactedItemCommandsLeftFirst" context="{dataProvider: data.dataProviders.probableImpactedDataProvider, configurationState: props.subPanelContext.configState}" alignment="HORIZONTAL"></aw-command-bar>
                </div>
            </div>
        </div>
    </div>
    <div class="sw-row">
        <aw-splm-table gridid="probableImpactedGrid" use-tree="true" show-check-box="data.dataProviders.probableImpactedDataProvider.selectionModel.multiSelectEnabled"></aw-splm-table>
    </div>
</div>
