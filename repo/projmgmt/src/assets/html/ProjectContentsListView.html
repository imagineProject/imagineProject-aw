<div class="aw-base-scrollPanel" exist-when="(subPanelContext.searchState.searchStringSecondary ==='' || subPanelContext.searchState.searchStringSecondary ==='*') && subPanelContext.searchState.totalFound === 0">
    <aw-empty-workarea
        image="graEmptyGeneric128"
        title="i18n.noContent"
        hint="i18n.noContentHint">
    </aw-empty-workarea>
</div>
<div class="aw-base-scrollPanel" exist-when="subPanelContext.searchState.searchStringSecondary !=='' && subPanelContext.searchState.searchStringSecondary !=='*' && subPanelContext.searchState.totalFound === 0">
    <aw-empty-workarea
        image="graEmptyGeneric128"
        title="i18n.noResultsFound"
        hint="i18n.noResultsSearchKeywordHint">
    </aw-empty-workarea>
</div>
  <aw-scrollpanel exist-when="subPanelContext.searchState.totalFound>0">
  <aw-list dataprovider="data.dataProviders.listDataProvider">
     <aw-default-cell vmo="item"></aw-default-cell>
  </aw-list>
</aw-scrollpanel>
