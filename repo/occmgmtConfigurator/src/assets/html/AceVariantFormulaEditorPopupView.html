<aw-panel-body scrollable="false" class="h-10">
    <pca0-formula-suggester formula="fields.formula" editor-object="data.editorObject" config-perspective-uid="{{props.subPanelContext.popupOptions.configPerspective.uid}}" ></pca0-formula-suggester>
</aw-panel-body>
<aw-panel-footer class="h-2">
    <aw-button button-type="base" action="closeVariantFormulaEditorPopup" size="auto" visible-when="data.editorObject.editContext === 'readOnly'">{{i18n.close}}</aw-button>
    <aw-button button-type="accent-mid-contrast" action="StartEditVariantFormula" size="auto" visible-when="data.editorObject.editContext === 'readOnly'">{{i18n.edit}}</aw-button>
    <aw-button button-type="base" action="cancelVariantFormulaEditing" size="auto" visible-when="data.editorObject.editContext !== 'readOnly'">{{i18n.cancel}}</aw-button>
    <aw-button button-type="accent-mid-contrast" action="saveVariantFormula" size="auto" visible-when="data.editorObject.editContext !== 'readOnly'">{{i18n.saveButtonText}}</aw-button>
</aw-panel-footer>
