<%  var columnPropertyName = _.get( column, 'propertyName' );
    var imagePath = basePath + '/image/';
    var altText = _.get(column, 'displayName');
    switch( columnPropertyName ){
        case "bl_property_overrides":
            imagePath += "indicatorHasContextOverides16.svg"
            break
        default:
            imagePath += ""
    }%>

    <img class="aw-visual-indicator" src="<%=imagePath%>" alt="<%=altText%>">
