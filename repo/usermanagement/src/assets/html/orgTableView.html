<div class="aw-base-scrollPanel" exist-when="data.totalFound ===0 && subPanelContext.searchState.criteria.groupUID && !subPanelContext.searchState.criteria.roleUID">
    <aw-empty-workarea
        image="graEmptyGeneric128"
        title="i18n.nothingHere"
        hint="i18n.noSubGroupOrRoleHint">
   </aw-empty-workarea>
</div>
<div class="aw-base-scrollPanel" exist-when="data.totalFound ===0 && subPanelContext.searchState.criteria.groupUID && subPanelContext.searchState.criteria.roleUID">
    <aw-empty-workarea
        image="graEmptyGeneric128"
        title="i18n.nothingHere"
        hint="i18n.noUserHint"
        action="actions.showAddObjectsUser"
        link-visibility="true"
        link-text="i18n.addUserTitle">
   </aw-empty-workarea>
</div>
<aw-splm-table gridid="gridView" show-check-box="subPanelContext.showCheckBox" show-context-menu="true" exist-when="data.totalFound !== 0"
command-context="{dialogAction: actions.dialogAction , ...subPanelContext}">
</aw-splm-table>
<aw-dialog action="dialogAction"></aw-dialog>
