<div class="aw-base-scrollPanel" exist-when="subPanelContext.searchState.criteria.searchString !=='' && data.totalFound === 0">
    <aw-empty-workarea
        image="graEmptyGeneric128"
        title="i18n.noResultsFound"
        hint="i18n.noResultsSearchKeywordHint">
    </aw-empty-workarea>
</div>
    <aw-scrollpanel exist-when="data.totalFound>0">
  <aw-list dataprovider="data.dataProviders.listDataProvider" show-check-box="subPanelContext.showCheckBox">
     <aw-default-cell vmo="item"></aw-default-cell>
  </aw-list>
</aw-scrollpanel>
