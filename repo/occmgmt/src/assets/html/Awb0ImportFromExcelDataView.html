<aw-panel-body>
    <aw-panel-section caption="i18n.importOptions" visible-when="data.showImportOptions">
        <aw-label prop="data.scopeHeader"></aw-label>
        <aw-checkbox prop="data.structureScope" enable-when="conditions.enableStructureScope"></aw-checkbox>
        <aw-checkbox prop="data.relationsScope" enable-when="conditions.enableRelationsScope"></aw-checkbox>
        <aw-checkbox prop="data.partsScope" enable-when="conditions.enablePartsScope"></aw-checkbox>
        <aw-radiobutton prop="data.structureOptions" list="data.importActionValues.dbValue"></aw-radiobutton>
    </aw-panel-section>
    <aw-panel-section caption="i18n.mapProperties" visible-when="data.showPropertiesMap">
        <aw-widget prop="data.mappingGroup"></aw-widget>
        <div visible-when="data.showPropertiesMap">
            <aw-label prop="data.headerMapping" class="aw-importexport-header"></aw-label>
            <aw-widget prop="header" class="aw-importexport-headerLabel" aw-repeat="header:data.viewModelPropertiesForHeader"></aw-widget>
        </div>
    </aw-panel-section>
</aw-panel-body>
<aw-panel-footer>
    <div class="sw-flex-row">
        <aw-checkbox prop="data.runInBackgroundExcel"></aw-checkbox>
    </div>
    <aw-button size="auto" visible-when="!data.showImportOptions" enable-when="conditions.enablePreviewButton" action="setContextAndPreview" button-type="base">
        <aw-i18n>i18n.preview</aw-i18n>
    </aw-button>
    <aw-button size="auto" visible-when="!data.showImportOptions" enable-when="conditions.enableImportButton" action="getExcelImportInput">
        {{data.importButtonTitle}}
    </aw-button>
    <aw-button size="auto" visible-when="data.showImportOptions" enable-when="conditions.enableAwp0PreviewButton" action="setContextAndPreview" button-type="base">
        <aw-i18n>i18n.preview</aw-i18n>
    </aw-button>
    <aw-button size="auto" visible-when="data.showImportOptions" enable-when="conditions.enableAwp0ImportButton" action="getExcelImportInput">
        {{data.importButtonTitle}}
    </aw-button>
</aw-panel-footer>
