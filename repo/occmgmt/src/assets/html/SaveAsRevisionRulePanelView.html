<aw-panel-body>
    <div>
        <aw-textbox prop="data.saveAsRevRuleName"></aw-textbox>        
        <aw-textarea prop="data.saveAsRevRuleDesc" hint="textarea"></aw-textarea>
    </div>

    <aw-panel-section caption="i18n.clauses">
        <div aw-repeat="item : subPanelContext.nestedNavigationState.clauses" class="aw-revRule-clausesSections" aw-class="[{'aw-revRule-clauseModify-indicator': item.modified == true }, {'aw-clauseName-background': item.selected == true },{'aw-revRule-disableMouseClick': (subPanelContext.nestedNavigationState.exactlySameClauseWarning === true) }]">
            <label class="aw-change-mergeUsageProps" exist-when="((item.entryType !== subPanelContext.nestedNavigationState.groupUsageTypeEntryType)&&(item.entryType !== subPanelContext.nestedNavigationState.groupItemTypeEntryType))">{{item.displayText}}</label>
            <label class="aw-change-mergeUsageProps" exist-when="((item.entryType === subPanelContext.nestedNavigationState.groupUsageTypeEntryType)||(item.entryType === subPanelContext.nestedNavigationState.groupItemTypeEntryType))">
                {{item.displayText}}<br/><p>&emsp;{{item.clauseLines[item.clauseLines.length - 1].value}}</p>}
            </label>
        </div>
    </aw-panel-section>
</aw-panel-body>

<aw-panel-footer>
    <aw-button action="saveRevisionRuleAction">
        <aw-i18n>i18n.save</aw-i18n>
    </aw-button>
</aw-panel-footer>
