 <aw-flex-row>
    <aw-flex-column width="12">
        </br>
        <!--
            1. For Add Effectivities: Based on the values in preference, show respective view
                a. If "Awb0DateEffectivityConfigFeature" and "Awb0UnitEffectivityConfigFeature" value available in preference then show
                    radio button and selected button view
                b. If only "Awb0DateEffectivityConfigFeature" value is available in prefernce then donot show radio button and show only Date Effectivity View
                b. If only "Awb0UnitEffectivityConfigFeature" value is available in prefernce then donot show radio button and show only Unit Effectivity View
            2. For Edit Effectivity: Effectivity panels continue to show existing effectivity data and user is allowed to edit if they have write access
        -->
        <aw-radiobutton exist-when="(props.subPanelContext.sharedData.dateEffectivityEnable.dbValue && props.subPanelContext.sharedData.unitEffectivityEnable.dbValue) || (props.subPanelContext.sharedData.activeView === 'EditEffectivities')"
            prop="data.dateOrUnitEffectivityTypeRadioButton" action="updateDateOrUnitEffectivityBatchJob"></aw-radiobutton>
        <aw-flex-row exist-when="(props.subPanelContext.sharedData.dateOrUnitEffectivityTypeRadioButton.dbValue && (props.subPanelContext.sharedData.dateEffectivityEnable.dbValue || props.subPanelContext.sharedData.activeView === 'EditEffectivities'))">
            <aw-flex-column width="12">
                <awb0-ace-date-effectivity sub-panel-context='subPanelContext'></awb0-ace-date-effectivity>
            </aw-flex-column>
        </aw-flex-row>
        <aw-flex-row exist-when="(!props.subPanelContext.sharedData.dateOrUnitEffectivityTypeRadioButton.dbValue && (props.subPanelContext.sharedData.unitEffectivityEnable.dbValue || props.subPanelContext.sharedData.activeView === 'EditEffectivities'))">
            <aw-flex-column width="12">
                <awb0-ace-unit-effectivity sub-panel-context='subPanelContext'></awb0-ace-unit-effectivity>
            </aw-flex-column>
        </aw-flex-row>
    </aw-flex-column>
</aw-flex-row>
