<div class="aw-widgets-propertyContainer" aw-repeat="variantRule : data.appliedVariantRules ">
    <aw-link-with-popup prop="variantRule"  visible-when="!props.subPanelContext.occContext.readOnlyFeatures.Awb0VariantFeature && !props.subPanelContext.occContext.supportedFeatures.Awb0SupportsFullScreenVariantConfiguration || !conditions.isInAce">
        <ace-variant-rule-popup-content sub-panel-context="{...subPanelContext,'indexOfRule':$index,'variantRule':variantRule,'appliedVariantRules':data.appliedVariantRules}"></ace-variant-rule-popup-content>
    </aw-link-with-popup>
    <aw-link-with-popup prop="variantRule"  visible-when="!props.subPanelContext.occContext.readOnlyFeatures.Awb0VariantFeature && props.subPanelContext.occContext.supportedFeatures.Awb0SupportsFullScreenVariantConfiguration && conditions.isInAce">
        <aw-include name="AcePcaVariantRulePopupContent" sub-panel-context="{...subPanelContext,'indexOfRule':$index,'variantRule':variantRule,'appliedVariantRules':data.appliedVariantRules, defaultVariantRule: data.defaultVariantRule}"></aw-include>
    </aw-link-with-popup>
    <aw-property-non-edit-val prop="variantRule" visible-when="props.subPanelContext.occContext.readOnlyFeatures.Awb0VariantFeature" class="aw-occmgmtjs-savedVariantRuleLink"></aw-property-non-edit-val>
</div>
