<aw-standard-sublocation exist-when="!subPanelContext.occContext.delayLoadSublocation" sub-panel-context="{...subPanelContext, customDialogAction: subPanelContext.customDialogAction ? subPanelContext.customDialogAction : actions.customDialogAction}"
    provider="subPanelContext.provider" search-state="subPanelContext.occContext"
    base-selection="data.alternateSelection" selection-model="selectionModels.occmgmtSelectionModel"
    selection-data="data.selectionData" sublocation-state="props.sublocationState">
    {props.children}
</aw-standard-sublocation>
<aw-dialog exist-when="!subPanelContext.customDialogAction"
        action="actions.customDialogAction"
        sub-panel-context="{...subPanelContext, selectionModel: selectionModels.occmgmtSelectionModel}">
</aw-dialog>
