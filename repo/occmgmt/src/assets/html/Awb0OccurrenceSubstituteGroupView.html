<aw-command-panel caption="i18n.addSubstituteGroup" context="subPanelContext">
    <div class="aw-layout-flexColumn" show-when="data.activeState.value.activeView==='AddObjectPrimarySub'">
        <aw-add include-types="{{data.includeTypes}}"
            visible-tabs="new" load-sub-types="false"
            exist-when="data.allowedTypeInfo"
            max-recent-count="5" type-filter="{{data.allowedTypeInfo.searchTypeName}}"
            preferred-type="{{data.allowedTypeInfo.preferredType}}" add-panel-state="fields.addPanelState"
            active-state="data.activeState" project-state="data.projectState"
            sub-panel-context="{ ...subPanelContext, addElementState:data.addElementState, substituteSetsInfo:data.substituteSetsInfo }"
            xrt-state="data.xrtState" edit-handler="editHandlers.addPanelEditHandler">
        </aw-add>
        <aw-panel-footer>
            <aw-button size="auto" action="createOccurrenceSubstituteGroupSOA" visible-when="conditions.shouldShowAddOnNewTab" enable-when="formProp.attributes.valid && conditions.shouldShowAddOnNewTab">
                <aw-i18n>i18n.createBtn</aw-i18n>
            </aw-button>
        </aw-panel-footer>
    </div>

    <aw-navigate-panel title='i18n.addSubstituteElementsTitle' exist-when="data.activeState.value.activeView==='AceAddSubstituteComponent'" panel-id='AceAddSubstituteComponent'
        sub-panel-context='{...subPanelContext, addElementState:data.addElementState}' action='setActiveView'>
    </aw-navigate-panel>

</aw-command-panel>
