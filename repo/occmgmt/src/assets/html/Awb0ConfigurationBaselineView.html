<aw-command-panel caption="i18n.createConfigurationBaseline" context="subPanelContext">
        <aw-panel-body>
            <aw-panel-header-section header-section-label="i18n.fromTitle" header-section-element="{{data.fromString}}"></aw-panel-header-section>
            <aw-panel-section caption="i18n.properties">
                <aw-widget prop="data.configurationBaselineType"></aw-widget>
                <aw-textbox prop="data.configurationBaselineName"></aw-textbox>
                <aw-textarea prop="data.configurationBaselineDescription"></aw-textarea>
                <!-- <div class="sw-row aw-configBaseline-validationRule">
                    <div class="sw-column">
                        <aw-label prop="data.configBaselineValidationRuleLabel"></aw-label>
                    </div>
                    <div class="sw-column">
                        <div class="aw-configurationBaseline-infoIcon aw-aria-border" tabindex="0" extended-tooltip="data.validationRuleTooltip">
                            <aw-icon icon-id="cmdShowInfoPanel"></aw-icon>
                        </div>
                    </div>
                </div>
                <aw-widget prop="data.configBaselineValidationRule"></aw-widget> -->
                <div class="sw-row align-center aw-configBaseline-checkbox">
                    <aw-checkbox prop="data.configurationBaselineClose"></aw-checkbox>
                    <div class="aw-configurationBaseline-infoIcon aw-aria-border" tabindex="0" extended-tooltip="data.closeTooltipView">
                        <aw-icon icon-id="cmdShowInfoPanel"></aw-icon>
                    </div>
                </div>
                <aw-listbox prop="data.actionOnWorkingContent" list="data.actionOnWorkingContents_list.dbValue" exist-when="data.configurationBaselineClose.dbValue"></aw-listbox>
                <aw-listbox prop="data.closureWorkflow" exist-when="conditions.isClosureWorkflowVisibleInCreatePanel" list="data.configBaselineTemplateList"></aw-listbox>
            </aw-panel-section>
        </aw-panel-body>
        <aw-panel-footer>
            <div class="sw-column w-12" visible-when="conditions.isClientDispatcherInstalled">
                <aw-checkbox prop='data.runInBackground'></aw-checkbox>
            </div>
            <aw-button size="auto" action="createConfigurationBaselineAction" enable-when="conditions.enableConfigurationBaseline">
                <aw-i18n>i18n.createBtn</aw-i18n>
            </aw-button>
        </aw-panel-footer>
</aw-command-panel>
