<aw-popup2 id="AceEditTransformPopup" caption="i18n.editTransformTitle">
    <aw-break></aw-break>
    <div class="aw-occmgmt-transformHeader">
        <aw-panel-header-section header-section-label="i18n.forTitle" header-section-element="{{subPanelContext.selectedObject.props.object_string.uiValues[0]}}"></aw-panel-header-section>
    </div>
    <aw-panel-body>
        <div class='aw-occmgmt-transformContainer aw-occmgmt-transformBorder'>
            <div class='aw-occmgmt-transformRow'>
                <aw-numeric class='aw-occmgmt-transformElement' prop="data.a30"></aw-numeric>
                <aw-numeric class='aw-occmgmt-transformElement' prop="data.rotateX"></aw-numeric>
            </div>
            <div class='aw-occmgmt-transformRow'>
                <aw-numeric class='aw-occmgmt-transformElement' prop="data.a31"></aw-numeric>
                <aw-numeric class='aw-occmgmt-transformElement' prop="data.rotateY"></aw-numeric>
            </div>
            <div class='aw-occmgmt-transformRow'>
                <aw-numeric class='aw-occmgmt-transformElement' prop="data.a32"></aw-numeric>
                <aw-numeric class='aw-occmgmt-transformElement' prop="data.rotateZ"></aw-numeric>
            </div>
        </div>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="editTransform" enable-when="formProp.attributes.valid && formProp.attributes.dirty" size="auto">
            <aw-i18n>i18n.modifyTransform</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-popup2>
