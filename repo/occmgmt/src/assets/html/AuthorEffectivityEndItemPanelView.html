<aw-panel-body >
    <aw-tab-set tabs='data.endItemTabsModel.dbValues'>
        <author-effectivity-end-item-search-tab
            sub-panel-context='subPanelContext'
            exist-when="data.selectedTab.tabKey==='Search'">
        </author-effectivity-end-item-search-tab>
       <palette-tab-page-sub
            sub-panel-context="{...subPanelContext, typeFilter: 'ItemRevision' }"
            exist-when="data.selectedTab.tabKey==='Palette'">
        </palette-tab-page-sub>
    </aw-tab-set>
</aw-panel-body>
