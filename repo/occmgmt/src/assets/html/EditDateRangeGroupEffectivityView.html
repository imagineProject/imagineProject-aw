<aw-panel-body>
    <aw-flex-column width="12">
        <aw-textbox prop="data.nameBox" ></aw-textbox>
        <aw-datetime prop="data.startDateTime" exist-when="data.isTimeEnabled"></aw-datetime>
        <aw-date prop="data.startDateTime" exist-when="!data.isTimeEnabled"></aw-date>
        <aw-listbox prop="data.endDateOptions" list="data.endDateList.dbValue"></aw-listbox>
        <aw-widget prop="data.endDateTime" class="aw-endDate-authorEffectivityPanel" exist-when="conditions.isEndDateVisible && !data.isTimeEnabled"></aw-widget>
        <aw-datetime prop="data.endDateTime" class="aw-endDate-authorEffectivityPanel" exist-when="conditions.isEndDateVisible && data.isTimeEnabled"></aw-datetime>
        <aw-flex-row height="5f" class="aw-occmgmt-elemEffEndItem">
            <aw-label prop="data.endItemLabel"></aw-label>
            <aw-property-non-edit-val prop="data.endItemValForDateRange"></aw-property-non-edit-val>
            <aw-icon-button command="data.navigateAddCommand"  exist-when="data.endItemValForDateRange.dbValue==''" class="aw-commands-commandIconButton aw-jswidgets-rmButton"></aw-icon-button>
            <aw-icon-button command="data.removeCommand"  exist-when="data.endItemValForDateRange.dbValue!==''" class="aw-commands-commandIconButton aw-jswidgets-rmButton"></aw-icon-button>
            <aw-icon-button command="data.navigateReplaceCommand"  exist-when="data.endItemValForDateRange.dbValue!==''" class="aw-commands-commandIconButton aw-jswidgets-rmButton"></aw-icon-button>
        </aw-flex-row>
    </aw-flex-column>
</aw-panel-body>
<aw-panel-footer>
    <aw-button size="auto" action="EditEffectivity" enable-when="conditions.isDateRangeValid">
        <aw-i18n>i18n.apply</aw-i18n>
    </aw-button>
</aw-panel-footer>
