<aw-command-panel caption="i18n.openInView" context="subPanelContext">
    <aw-add visible-tabs="{{data.visibleTabs}}" include-types="{{props.includeTypes}}"
      type-filter="{{props.searchFilters}}" add-panel-state="fields.addPanelState" sub-panel-context="subPanelContext"> </aw-add>
    <aw-panel-footer>
        <aw-button visible-when="conditions.isSingleElementSelected" action="openInViewSelectedElement">
            <aw-i18n>i18n.openInViewBtn</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-command-panel>
