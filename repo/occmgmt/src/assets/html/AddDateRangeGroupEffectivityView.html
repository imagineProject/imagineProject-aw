<aw-panel-body scrollable="false">
    <aw-panel-header-section header-section-label="i18n.configuredBy" header-section-element="{{data.configuredBy.uiValue}}"></aw-panel-header-section>
    <aw-tab-set tabs="data.tabsModel.dbValues" action="updateSelectedTab"></aw-tab-set>
    <author-date-range-group-effectivity show-when="conditions.isNewTabSelected" sub-panel-context='{...subPanelContext}'>
    </author-date-range-group-effectivity >
    <search-date-range-group-effectivity visible-when="!conditions.isNewTabSelected"sub-panel-context='{...subPanelContext}'>
    </search-date-range-group-effectivity>
</aw-panel-body>
