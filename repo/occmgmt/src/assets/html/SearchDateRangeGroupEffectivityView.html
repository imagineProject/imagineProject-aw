<aw-panel-body scrollable="false">
    <aw-list-filter prop="data.filterBox" dataprovider="data.dataProviders.performSearchForSharedEffectivities">
         <aw-default-cell vmo="item"></aw-default-cell>
    </aw-list-filter>
</aw-panel-body>
<aw-panel-footer >
<aw-button size="auto" default="true" enable-when="conditions.isAnyItemSelectedFromSearchPanelList" action="applySearchedGroupEffectivity" >
    <aw-i18n>i18n.apply</aw-i18n>
</aw-button>
</aw-panel-footer>
