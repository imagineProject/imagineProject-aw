<aw-panel-body>
    <aw-flex-column width="12">
        <aw-checkbox prop="data.isShared" enable-when="(data.flag.dbValue ==='AUTHOR' || data.flag.dbValue ==='AUTHORREVISION') || (data.flag.dbValue ==='EDIT' && props.subPanelContext.sharedData.isShared.dbValue !== true)" ></aw-checkbox>
        <aw-textbox prop="data.nameBox" exist-when="fields.isShared.value"></aw-textbox>

        <aw-flex-row aw-init="prop=data.startDate">
            <aw-flex-column width="12">
                <aw-date prop="data.startDate" exist-when="!props.subPanelContext.sharedData.isTimeEnabled.value"></aw-date>
                <aw-datetime prop="data.startDate" exist-when="props.subPanelContext.sharedData.isTimeEnabled.value"></aw-datetime>
            </aw-flex-column>
        </aw-flex-row>
        <aw-flex-row>
            <aw-flex-column width="12">
                <aw-listbox action="clearDate" prop="data.endDateOptions" list="data.endDateList.dbValue"></aw-listbox>
                <aw-widget prop="data.endDate"  exist-when="data.endDateOptions.dbValue=='Date' && props.subPanelContext.occContext === 'undefined'" class="aw-endDate-authorEffectivityPanel"></aw-widget>
                <aw-widget prop="data.endDate"  exist-when="data.endDateOptions.dbValue=='Date' && props.subPanelContext.occContext !== 'undefined'" class="aw-endDate-authorEffectivityPanel"></aw-widget>
            </aw-flex-column>
        </aw-flex-row>
        <br>
        <aw-flex-row height="5f" class="aw-occmgmt-elemEffEndItem">
            <aw-label prop="data.endItemLabel"></aw-label>
            <aw-property-non-edit-val prop="data.endItemValForDate"></aw-property-non-edit-val>
            <aw-icon-button command="data.navigateCommand" class="aw-commands-commandIconButton aw-jswidgets-rmButton"></aw-icon-button>
        </aw-flex-row>
    </aw-flex-column>
</aw-panel-body>
<aw-panel-footer>
    <aw-flex-column width="12">
        <aw-checkbox prop="data.isProtected" action="updateIsProtectedValue"></aw-checkbox>
    </aw-flex-column>
    <div>
        <aw-button size="auto" visible-when="!conditions.isRevisionEffectivity && data.flag.dbValue!=='EDIT'" enable-when="conditions.isValidEffectivityPanel" action="authorEffectivityClicked">
            <aw-i18n>i18n.addElementBtn</aw-i18n>
        </aw-button>
        <aw-button size="auto" visible-when="conditions.isRevisionEffectivity && data.flag.dbValue!=='EDIT'"  enable-when="conditions.isValidEffectivityPanel" action="authorRevisionEffectivity">
            <aw-i18n>i18n.addElementBtn</aw-i18n>
        </aw-button>
        <aw-button size="auto" visible-when="data.flag.dbValue==='EDIT' && ctx.elementEffectivity.currentEffectivityType==='Element'" enable-when="conditions.isValidEffectivityPanel" action="editEffectivityClicked">
            <aw-i18n>i18n.saveButtonText</aw-i18n>
        </aw-button>
        <aw-button size="auto" visible-when="data.flag.dbValue==='EDIT' && ctx.elementEffectivity.currentEffectivityType==='Release'" enable-when="conditions.isValidEffectivityPanel" action="editRevisionEffectivity">
            <aw-i18n>i18n.saveButtonText</aw-i18n>
        </aw-button>
    </div>
</aw-panel-footer>
