<aw-panel-body>
    <div class="aw-toolbar-layout aw-toolbar-horizontal" exist-when="ctx.classicCfgContext.isSavePanelDirty">
        <aw-command-bar anchor="awb_variantConfigurationCommandBar" alignment="HORIZONTAL" context="{...subPanelContext}"></aw-command-bar>
    </div>
    <aw-panel-section exist-when="data.vmpForOptions.length != 0">
        <div aw-repeat="eachOption : data.vmpForOptions">
            <ace-display-lov listData="{{eachOption}}" lov="{{eachOption.lov}}"></ace-display-lov>
        </div>
    </aw-panel-section>
</aw-panel-body>
<aw-panel-footer>
    <aw-button action="selectiveConfigureAction" exist-when="ctx.classicCfgContext.vmpForOptions.length > 0">
        <aw-i18n>i18n.configure</aw-i18n>
    </aw-button>
</aw-panel-footer>
