<aw-panel-body scrollable="false">
    <aw-tab-set tabs="data.tabsModel.dbValues"></aw-tab-set>
    <author-effectivity sub-panel-context='subPanelContext'
        visible-when="data.selectedTab.tabKey==='New'">
    </author-effectivity>
    <search-effectivities sub-panel-context='subPanelContext'
    visible-when="data.selectedTab.tabKey==='Search'">
    </search-effectivities>
</aw-panel-body>
