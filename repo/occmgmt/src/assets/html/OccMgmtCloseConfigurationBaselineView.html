<aw-command-panel caption="i18n.closeConfigurationBaseline" context="subPanelContext">
    <div class="sw-column h-12">
        <aw-panel-section>
            <aw-listbox prop="data.actionOnWorkingContent" list="data.actionOnWorkingContents_list.dbValue"></aw-listbox>
            <aw-listbox prop="data.closureWorkflow" exist-when="conditions.isClosureWorkflowVisible" list="data.configBaselineTemplateList"></aw-listbox>
        </aw-panel-section>
    </div>
    <aw-panel-footer>
        <div class="sw-column w-12">
            <aw-checkbox prop='data.runInBackground'></aw-checkbox>
        </div>
        <div class='sw-button-group justify-right align-right'>
            <aw-button action='closeConfigurationBaselineAction' size='auto'>{{i18n.closeConfigurationBaseline}}</aw-button>
        </div>
    </aw-panel-footer>
</aw-command-panel>
