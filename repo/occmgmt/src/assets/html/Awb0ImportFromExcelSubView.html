<aw-panel-header>
    <aw-label prop="data.selectExcelFile"></aw-label>
    <aw-file-upload file-change-action="updateFormData" type-filter=".xlsx, .xlsm" is-required="true"
        upload-model="data.uploadFileProvider"
        selection-data="data.uploadFileSelectionData"></aw-file-upload>
    <br>
</aw-panel-header>
<awb0-import-from-excel-data
    sub-panel-context="{...subPanelContext,uploadFileSelectionData:data.uploadFileSelectionData}">
</awb0-import-from-excel-data>
