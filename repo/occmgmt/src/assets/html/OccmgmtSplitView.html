<aw-sublocation
    sub-panel-context="{provider : {...ctx.aceActiveContext.key === 'occmgmtContext' ? data.view1 : data.view2},
                        occContext: ctx.aceActiveContext.key === 'occmgmtContext' ? data.occContext : data.occContext2,
                        inactiveContext : ctx.aceActiveContext.key === 'occmgmtContext' ? data.occContext2 : data.occContext,
                        contextKey: ctx.aceActiveContext.key === 'occmgmtContext' ? data.view1.contextKey : data.view2.contextKey,
                        compareContext: data.compareContext,
                        customDialogAction: actions.customDialogAction,
                        leftSublocationState: data.sublocationState,
                        rightSublocationState : data.sublocationState2
                    }"
    sub-location-preference="{}">
    <aw-dialog action="actions.customDialogAction"
        sub-panel-context="{provider : {...ctx.aceActiveContext.key === 'occmgmtContext' ? data.view1 : data.view2},
                            occContext: ctx.aceActiveContext.key === 'occmgmtContext' ? data.occContext : data.occContext2,
                            inactiveContext : ctx.aceActiveContext.key === 'occmgmtContext' ? data.occContext2 : data.occContext,
                            contextKey: ctx.aceActiveContext.key === 'occmgmtContext' ? data.view1.contextKey : data.view2.contextKey,
                            compareContext: data.compareContext}">
    </aw-dialog>
    <div class="sw-row h-12 afx-content-background aw-occmgmt-split">
        <div class="sw-column w-6 aw-occmgmt-split-left" aw-click="actions.activateLeftView">
            <div class="sw-column aw-layout-nowrap flex-auto" exist-when="data.objectsToOpen[0].uid">
                <ace-object-header model-object="data.objectsToOpen[0]" display-label="{{data.occContext.headerDisplayLabelForApplication}}" exist-when="data.occContext.pwaInitialized"></ace-object-header>
                <ace-data-navigator
                    sub-panel-context="{...subPanelContext, occContext: data.occContext, provider : data.view1,
                        selectionQueryParamKey : data.view1.selectionQueryParamKey, contextKey: data.view1.contextKey,
                        selectionData: fields.selectionData, showObjectContext: fields.showObjectContext,
                        openedObject : data.objectsToOpen[0],
                        customDialogAction: actions.customDialogAction}"
                    provider="data.view1" contextKey="{{data.view1.contextKey}}"
                    sublocation-state="data.sublocationState"
                    baseSelection="data.objectsToOpen[0]" key="{{data.objectsToOpen[0].uid}}"> <!--Passing key to div to remount the component on OpenInView case when objectToOpen uid changes-->
                </ace-data-navigator>
            </div>
        </div>
        <aw-splitter min-size-1="0" min-size-2="200" exist-when="data.objectsToOpen.length > 1"></aw-splitter>
        <div class="sw-column w-6 aw-occmgmt-split-right" aw-click="actions.activateRightView">
            <div class="sw-column aw-layout-nowrap flex-auto" exist-when="data.objectsToOpen[1].uid">
                <ace-object-header model-object="data.objectsToOpen[1]" display-label="{{data.occContext2.headerDisplayLabelForApplication}}" exist-when="data.occContext2.pwaInitialized"></ace-object-header>
                <ace-data-navigator
                    sub-panel-context="{...subPanelContext, occContext: data.occContext2, provider : data.view2,
                        selectionQueryParamKey : data.view2.selectionQueryParamKey, contextKey: data.view2.contextKey,
                        selectionData: fields.selectionData2, showObjectContext: fields.showObjectContext2,
                        openedObject : data.objectsToOpen[1],
                        customDialogAction: actions.customDialogAction}"
                    provider="data.view2" contextKey="{{data.view2.contextKey}}"
                    sublocation-state="data.sublocationState2"
                    baseSelection="data.objectsToOpen[1]"  key="{{data.objectsToOpen[1].uid}}"> <!--Passing key to div to remount the component on OpenInView case when objectToOpen uid changes-->
                </ace-data-navigator>
            </div>
        </div>
    </div>
</aw-sublocation>
