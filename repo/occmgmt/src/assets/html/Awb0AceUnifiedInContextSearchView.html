<aw-command-panel caption="{{conditions.hasUnifiedInContextSearchTitle ? data.unifiedInContextSearchTitle : i18n.find}}" context="subPanelContext">
    <aw-flex-row height="auto">
        <aw-flex-column width="fill" visible-when="conditions.isFindInFeatureSupported" aw-class="{'disabled': conditions.isSearchScopeDisable}">
            <aw-checkbox enable-when="data.showFindIn" prop="data.searchScope" action="updateSearchScope"></aw-checkbox>
        </aw-flex-column>
        <aw-flex-column width="3f" align-content="end" exist-when="data.shouldShowFindInfoMessage" >
            <aw-icon-button command="data.findInfoMessage" class="aw-commands-commandIconButton" extended-tooltip="data.tooltipForFindInfo" extended-tooltip-options="data.extendedTooltipOptions" ></aw-icon-button>
        </aw-flex-column>
    </aw-flex-row>

    <div exist-when="data.shouldShowDiscoveryIndexedProductsMessage">
        <aw-guidance-message message="findForDiscoveryIndexedProductsMessage" closable="true" banner-style="true" show-icon="true" show-type="false" close-action="closeFindInfoMessage"></aw-guidance-message>
        <aw-break></aw-break>
    </div>

    <div class="sw-column aw-create-fillAvailable">
        <aw-search-objects  sub-panel-context="{preFilterContext: props.subPanelContext, disableEmptySearch: 'true', showContextMenu: false}" search-state-for-advanced="data.searchStateForFind"
        search-state-for-keyword="data.searchStateForFind" selection-model="selectionModels.findSelectionModel" selection-data="data.selectionData"></aw-search-objects>
    </div>
</aw-command-panel>
