<div class="aw-base-scrollPanel aw-splm-table-overflow-visible" exist-when="!props.subPanelContext.context.contextKey || props.subPanelContext.context.contextKey === data.contextKey">
    <div class="sw-column">
        <div class="aw-xrt-objectSetCommandPanel aw-advanced-bar-horizontal">
            <aw-server-visibility-command-bar anchor="aw_occSubstGroupSection" class="aw-commands-commandBarHorizontalRight" alignment="HORIZONTAL"
            context='{context:subPanelContext.context, selectionData:subPanelContext.selectionData}'exist-when="!conditions.isOneToOneOccurrenceSubstitutes">
            </aw-server-visibility-command-bar>
            <aw-server-visibility-command-bar anchor="aw_substituteOccurrenceSection" class="aw-commands-commandBarHorizontalRight" alignment="HORIZONTAL"
            context='{...subPanelContext.context, selectionData:subPanelContext.selectionData}' exist-when="conditions.isOneToOneOccurrenceSubstitutes">
            </aw-server-visibility-command-bar>
        </div>
        <aw-splm-table gridid="{{data.gridId}}" use-tree="true" show-context-menu="true" command-context="{context:subPanelContext.context, selectionData:subPanelContext.selectionData}"></aw-splm-table>
    </div>
</div>
