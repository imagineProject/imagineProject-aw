<div class="aw-layout-column aw-layout-flexbox aw-occmgmt-tree"  >
    <div>
        <ace-tree-header sub-panel-context="subPanelContext"></ace-tree-header>
    </div>
    <aw-splm-table command-context="{dialogActionForACEContextMenu:
        actions.dialogActionForACEContextMenu , ...subPanelContext.provider}"
        gridid="occTreeTable"
        use-tree="true"
        show-decorators="true"
        show-context-menu="true"
        show-check-box="data.showCheckBox ? data.showCheckBox : subPanelContext.showCheckBox"
        exist-when="!subPanelContext.occContext.hidTreeForEmptyContents"></aw-splm-table>
     <aw-dialog action="dialogActionForACEContextMenu"></aw-dialog>
    <aw-include name={{ctx.occmgmtContext.occMgmtTreeFooterView}} exist-when="ctx.occmgmtContext.occMgmtTreeFooterView"></aw-include>
</div>
