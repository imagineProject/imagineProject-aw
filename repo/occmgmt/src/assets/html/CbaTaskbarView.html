<div class="sw-row aw-taskbar-container aw-cba-taskbarHeight afx-accent-background aw-layout-fill">
    <div class="sw-column flex-auto">
        <div class="sw-row flex-auto">
                <cba-header-title exist-when="ctx.taskbarfullscreen && ctx.taskbarfullscreen === 'true'"></cba-header-title>
                <pma-ecn-indicator-in-cba exist-when="conditions.isImpactAnalysisMode"
                    sub-panel-context="subPanelContext.cbaContext.ImpactAnalysis"></pma-ecn-indicator-in-cba>
        </div>
    </div>
    <div class="sw-column justify-center">
        <aw-command-bar anchor="cbaExitAlignmentSlot" alignment="HORIZONTAL"></aw-command-bar>
    </div>
    <aw-separator is-vertical="true"></aw-separator>
    <aw-togglebutton class="aw-cadbomalignmentjs-taskbarLocationTitle" prop="data.isRedLineMode" action="handleRedLineToggleChange" visible-when="conditions.showChangeCondition"></aw-togglebutton>
    <aw-togglebutton class="aw-cadbomalignmentjs-taskbarLocationTitle" prop="data.alignmentCheckToggle" action='alignmentCheckToggleAction'
    enable-when="conditions.isAlignmentCheckApplicableCondition"></aw-togglebutton>
    <aw-separator enable-when="conditions.isAlignmentCheckApplicableCondition" is-vertical="true"></aw-separator>
    <div class="sw-column justify-center aw-cba-buttonMargin afx-static-size" exist-when="!conditions.isImpactAnalysisMode">
        <aw-button button-type='base' size='auto' exist-when="conditions.enableAlignmentCheck132Onwards"
        enable-when="conditions.isAlignmentCheckApplicableCondition" action="alignmentCheckInBackgroundMode"><aw-i18n>i18n.Awb0EntCBAAlignmentReport</aw-i18n></aw-button>
    </div>
    <aw-separator exist-when="!conditions.isImpactAnalysisMode" is-vertical="true"></aw-separator>
    <div class="sw-column justify-center" exist-when="!conditions.isImpactAnalysisMode">
        <aw-command-bar anchor="alignmentSlot" alignment="HORIZONTAL" context="props.fields.cbaTaskBarContext"></aw-command-bar>
    </div>
    <aw-separator exist-when="!conditions.isImpactAnalysisMode" is-vertical="true"></aw-separator>
    <div class="sw-column justify-center">
        <aw-command-bar anchor="cbaToolbarRightSlot" alignment="HORIZONTAL" context="{...props.subPanelContext,...props.fields.cbaTaskBarContext}"></aw-command-bar>
    </div>
    <aw-separator is-vertical="true"></aw-separator>
    <div class="sw-column justify-center">
        <aw-command-bar anchor="cbaLayoutChooserSlot" alignment="HORIZONTAL" context="props.subPanelContext"></aw-command-bar>
    </div>
    <aw-separator is-vertical="true"></aw-separator>
    <div class="sw-column justify-center">
        <aw-command-bar anchor="toolbarRightSlot" alignment="HORIZONTAL"></aw-command-bar>
    </div>
</div>
