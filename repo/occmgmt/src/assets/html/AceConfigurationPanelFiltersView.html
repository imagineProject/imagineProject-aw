<aw-panel-body>
        <ace-context-feature sub-panel-context="props.subPanelContext"></ace-context-feature>
        <ace-revision-rule-feature sub-panel-context="props.subPanelContext"></ace-revision-rule-feature>
        <awb0-date-effectivity-config-feature sub-panel-context="props.subPanelContext"></awb0-date-effectivity-config-feature>
        <awb0-unit-effectivity-feature sub-panel-context="{ activeView: data.activeView, configUnitEndItem: fields.configUnitEndItem, ...props.subPanelContext}"></awb0-unit-effectivity-feature>
        <awb0-variant-feature sub-panel-context="{configSvrEndItem: fields.configSvrEndItem, ...props.subPanelContext}"></awb0-variant-feature>
        <ace-toggle-index-configuration-feature sub-panel-context="props.subPanelContext"></ace-toggle-index-configuration-feature>
        <ace-closure-rule-feature sub-panel-context="props.subPanelContext"></ace-closure-rule-feature>
        <ace-arrangement-feature sub-panel-context="props.subPanelContext"></ace-arrangement-feature>
        <ace-view-type-feature sub-panel-context="props.subPanelContext"></ace-view-type-feature>
        <organization-scheme-feature sub-panel-context="props.subPanelContext" exist-when="subPanelContext.occContext.supportedFeatures.Fgf0OrganizationSchemeFeature !== undefined && subPanelContext.occContext.supportedFeatures.Fgf0OrganizationSchemeFeature === true"></organization-scheme-feature>
</aw-panel-body>
