<ace-object-header model-object="props.modelObject" display-label="{{subPanelContext.provider.displayLabel.text}}"></ace-object-header>
<ace-data-navigator class="flex-auto"
        sub-panel-context="{...subPanelContext, occContext:subPanelContext.occContext ? subPanelContext.occContext : data.occContext, selectionQueryParamKey : subPanelContext.provider.selectionQueryParamKey }"
        provider="subPanelContext.provider" contextKey="{{subPanelContext.provider.contextKey}}"
        baseSelection="{{props.modelObject}}" sublocation-state="props.sublocationState" key="{{props.modelObject.uid}}"
        use-ace-default-initialization-service = false>
</ace-data-navigator>
