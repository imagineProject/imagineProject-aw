<aw-command-panel caption="i18n.filter" context="subPanelContext">

    <div class="sw-row flex-shrink" height="auto" enable-when="(data.activeViewSharedData.activeView !== 'PartitionHierarchySubPanel')" >
        <div class="sw-column flex-auto" align-content="left" width="fill">
            <aw-command-bar context="{...subPanelContext.occContext,...fields.sharedData}" class="aw-subset-recipeCommandGroup" anchor="newRecipeGroupSlot" alignment="HORIZONTAL" show-command-labels="true"
            exist-when='props.subPanelContext.occContext.supportedFeatures.Awb0EnableSmartDiscoveryFeature
             && !props.subPanelContext.occContext.readOnlyFeatures.Awb0StructureFilterFeature'
            visible-when="(data.activeViewSharedData.activeView !== 'Awb0FilterPanelSettings'
            && data.activeViewSharedData.activeView !== 'ProximitySubPanel' && data.activeViewSharedData.activeView !== 'BoxZoneSubPanel'
            && data.activeViewSharedData.activeView !== 'PlaneZoneSubPanel' )">
            </aw-command-bar>
        </div>
        <div class="sw-column flex-shrink" align-content="end" width="6f" >
            <aw-command-bar context="{...subPanelContext.occContext,...fields.sharedData}" class="aw-subset-recipeCommandGroup" anchor="clearAllSlot" alignment="HORIZONTAL" show-command-labels="true"
            exist-when='props.subPanelContext.occContext.supportedFeatures.Awb0EnableSmartDiscoveryFeature
             && !props.subPanelContext.occContext.readOnlyFeatures.Awb0StructureFilterFeature'
            visible-when="(data.activeViewSharedData.activeView !== 'Awb0FilterPanelSettings'
            && data.activeViewSharedData.activeView !== 'ProximitySubPanel' && data.activeViewSharedData.activeView !== 'BoxZoneSubPanel'
            && data.activeViewSharedData.activeView !== 'PlaneZoneSubPanel' )">
            </aw-command-bar>
        </div>
        <div class="sw-column flex-shrink" align-content="end" width="6f" >
            <aw-command-bar anchor="filterSettingsSlot" alignment="HORIZONTAL"
            exist-when='props.subPanelContext.occContext.supportedFeatures.Awb0EnableSmartDiscoveryFeature
            && !props.subPanelContext.occContext.readOnlyFeatures.Awb0StructureFilterFeature'
            visible-when="(data.activeViewSharedData.activeView !== 'Awb0FilterPanelSettings'
            && data.activeViewSharedData.activeView !== 'ProximitySubPanel' && data.activeViewSharedData.activeView !== 'BoxZoneSubPanel'
            && data.activeViewSharedData.activeView !== 'PlaneZoneSubPanel' )" >
            </aw-command-bar>
        </div>
    </div>


    <div class="sw-row flex-auto" exist-when="!subPanelContext.occContext.supportedFeatures.Awb0EnableSmartDiscoveryFeature">
        <aw-command-sub-panel panel-id="Awb0StructureFilterCommandSubPanel"
            exist-when="data.activeViewSharedData.activeView === 'Awb0StructureFilterCommandSubPanel'"
            sub-panel-context="{...subPanelContext, sharedData:fields.sharedData}">
        </aw-command-sub-panel>
    </div>

    <div class="sw-row flex-auto" exist-when="subPanelContext.occContext.supportedFeatures.Awb0EnableSmartDiscoveryFeature">

        <aw-command-sub-panel panel-id="Awb0DiscoveryFilterCommandSubPanel"
            exist-when="data.activeViewSharedData.activeView === 'Awb0DiscoveryFilterCommandSubPanel'"
            sub-panel-context="{...subPanelContext, operation: props.operation, activeViewSharedData: fields.activeViewSharedData, sharedData:fields.sharedData}">
        </aw-command-sub-panel>

            <aw-navigate-panel title='i18n.settings' exist-when="data.activeViewSharedData.activeView === 'Awb0FilterPanelSettings'"
                pre-panel-id='Awb0DiscoveryFilterCommandSubPanel' panel-id='Awb0FilterPanelSettings'
                sub-panel-context='{activeViewSharedData: fields.activeViewSharedData, sharedData:fields.sharedData}'
                action="navigateBackToDiscoverySubPanel">
            </aw-navigate-panel>
        <aw-navigate-panel title="{{data.sharedData.spatialRecipeIndexToUpdate >=0 ?  i18n.EditProximitySubPanel: i18n.ProximitySubPanel }}"
            exist-when="data.activeViewSharedData.activeView === 'ProximitySubPanel'"
            pre-panel-id='Awb0DiscoveryFilterCommandSubPanel' panel-id='ProximitySubPanel'
            sub-panel-context='{activeViewSharedData: fields.activeViewSharedData, sharedData:fields.sharedData, occContext: subPanelContext.occContext}'
            action="navigateBackToDiscoverySubPanel">
        </aw-navigate-panel>
        <aw-navigate-panel title='i18n.BoxZoneSubPanel'
            exist-when="data.activeViewSharedData.activeView === 'BoxZoneSubPanel'"
            pre-panel-id='Awb0DiscoveryFilterCommandSubPanel' panel-id='BoxZoneSubPanel'
                sub-panel-context='{activeViewSharedData: fields.activeViewSharedData, sharedData:fields.sharedData, occContext: subPanelContext.occContext}'
            action="navigateBackToDiscoverySubPanel">
        </aw-navigate-panel>
        <aw-navigate-panel title='i18n.PlaneZoneSubPanel'
            exist-when="data.activeViewSharedData.activeView === 'PlaneZoneSubPanel'"
            pre-panel-id='Awb0DiscoveryFilterCommandSubPanel' panel-id='PlaneZoneSubPanel'
                sub-panel-context='{activeViewSharedData: fields.activeViewSharedData, sharedData:fields.sharedData, occContext: subPanelContext.occContext}'
            action="navigateBackToDiscoverySubPanel">
        </aw-navigate-panel>
        <div class="sw-row aw-partition-filter-panel" exist-when="data.activeViewSharedData.activeView === 'PartitionHierarchySubPanel'">
            <aw-panel-section collapsed="disabled" caption="i18n.filters" class="aw-partition-left-panel-view" aw-class="{'disabled': data.activeViewSharedData.activeView === 'PartitionHierarchySubPanel' }">
                <aw-command-sub-panel panel-id="Awb0DiscoveryFilterCommandSubPanel"
                    sub-panel-context="{...props.subPanelContext, activeViewSharedData: fields.activeViewSharedData, sharedData:fields.sharedData}">
                </aw-command-sub-panel>
            </aw-panel-section>
            <aw-separator is-vertical="true"></aw-separator>
            <aw-panel-section collapsed="disabled" caption='{{data.sharedData.clickedObj.categoryName}}: {{data.sharedData.clickedObj.name}}' class="aw-results-section aw-partition-right-panel-view">
                <aw-command-sub-panel panel-id="PartitionHierarchySubPanel"
                    sub-panel-context='{occContext: subPanelContext.occContext, activeViewSharedData: fields.activeViewSharedData, sharedData:fields.sharedData}'>
                </aw-command-sub-panel>
            </aw-panel-section>
        </div>
    </div>
</aw-command-panel>
