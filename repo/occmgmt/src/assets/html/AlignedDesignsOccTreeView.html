<aw-panel-body exist-when="conditions.isShowAlignedDesignsOccTree">
    <aw-command-panel-section caption="i18n.alignedDesignsOccTreeTitle" context="props.subPanelContext">
        <div class="aw-base-scrollPanel aw-splm-table-overflow-visible">
            <div class="sw-row" width="fill">
                <div class="sw-column w-8 aw-occmgmt-whereUsedtrevrulelabel">
                    <div class="aw-row" aw-class="{ 'disabled': !fields.configureStructure.value }">
                        <div class="sw-column w-12">
                            <aw-label prop="data.alignedDesignsOccTreeRevisionRuleLabel"></aw-label>
                        </div>
                    </div>
                </div>
                <div class="sw-column w-4 aw-occmgmt-whereUsedtoggle">
                    <aw-togglebutton class="aw-category-toggle" prop="data.configureStructureView"
                        action='updateToggleLableAndReloadAlignedDesignsOccTreeGrid'></aw-togglebutton>
                </div>
            </div>
            <aw-splm-table gridid="{{data.gridId}}" use-tree="true" show-context-menu="true"></aw-splm-table>
        </div>
    </aw-command-panel-section>
</aw-panel-body>
