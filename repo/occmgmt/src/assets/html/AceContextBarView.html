<div class="sw-row align-center flex-auto">
    <!-- Configuration Parameters and header properties-->
    <div class="sw-column" width="fill">
        <aw-workarea-header-properties sub-panel-context="props.subPanelContext"></aw-workarea-header-properties>
    </div>
    <aw-separator is-vertical="true" class="sw-leaf-separator" exist-when="props.subPanelContext.occContext.pwaInitialized"></aw-separator>
    <!-- Common Context Command "Reset View" -->
    <aw-server-visibility-command-bar anchor="aceContextBarLeftSlot" context="props.subPanelContext" overflow='true' alignment="HORIZONTAL" exist-when="props.subPanelContext.occContext.pwaInitialized"></aw-server-visibility-command-bar>
    <!-- Remaining Context Commands in collapsed mode -->
    <div class="sw-column aw-occmgmt-collapsed-contextBar" exist-when="conditions.isCollapsedWorkAreaHeader && props.subPanelContext.occContext.pwaInitialized">
        <aw-server-visibility-command-bar anchor="aceContextBar" context="props.subPanelContext" mselected="props.subPanelContext.occContext.pwaSelection" overflow='true' alignment="HORIZONTAL"></aw-server-visibility-command-bar>
    </div>
    <!-- Remaining Context Commands in expanded mode -->
    <div class="sw-column justify-right aw-occmgmt-expanded-contextBar-rightSlot" exist-when="conditions.isExpandedWorkAreaHeader && props.subPanelContext.occContext.pwaInitialized">
        <aw-server-visibility-command-bar anchor="aceContextBarRightSlot" context="props.subPanelContext" mselected="props.subPanelContext.occContext.pwaSelection" overflow='true' alignment="HORIZONTAL"></aw-server-visibility-command-bar>
    </div>
    <!-- Remaining Context Commands when ToggleWorkAreaHeaderPref is not defined -->
    <div class="sw-column aw-occmgmt-expanded-contextBar-rightSlot" exist-when="conditions.isToggleWorkAreaHeaderNotVisible && props.subPanelContext.occContext.pwaInitialized">
        <aw-server-visibility-command-bar anchor="aceContextBar" context="props.subPanelContext" mselected="props.subPanelContext.occContext.pwaSelection" overflow='true' alignment="HORIZONTAL"></aw-server-visibility-command-bar>
    </div>
</div>
