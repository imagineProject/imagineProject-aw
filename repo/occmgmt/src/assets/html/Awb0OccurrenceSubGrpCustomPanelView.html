<aw-panel-body>
    <aw-panel-section caption="i18n.primaryElements" anchor-position="RIGHT" collapsed="false" exist-when="data.dataProviders.getPrimaryElements">
        <aw-list dataprovider="data.dataProviders.getPrimaryElements">
            <aw-default-cell vmo="item"></aw-default-cell>
        </aw-list>
    </aw-panel-section>

    <aw-panel-section caption="i18n.substitutes" anchor-position="RIGHT" anchor="aw_addSubstituteGroupSetAnchor" collapsed="false">
        <ace-add-substitute-group-set
                aw-repeat="setInfoSectionObject: props.subPanelContext.substituteSetsInfo.setInfoSectionObject"
                substitute-set-section-info="setInfoSectionObject"
                active-state="props.activeState" sub-panel-context="{...props.subPanelContext}">
        </ace-add-substitute-group-set>
    </aw-panel-section>
</aw-panel-body>
