<div class="afx-layout-header-container">
    <div class="sw-leafContainer aw-layout-headerLeft flex-shrink">
        <div class="sw-layout-header sw-leaf-modelIcon">
            <aw-model-icon vmo="props.modelObject"></aw-model-icon >
        </div>
        <label class="sw-breadcrumb-leaf" exist-when="props.displayLabel != null">
            <h1>{{props.displayLabel}} </h1>
        </label>
        <aw-separator is-vertical="true" class="sw-leaf-separator aw-occmgmt-seperator" exist-when="props.displayLabel != null"></aw-separator>
        <div class="sw-breadcrumb-leaf">
            <h1> {{props.modelObject.props.object_string.uiValues[0]}} </h1>
        </div>
        <aw-separator is-vertical="true" class="sw-leaf-separator" exist-when="props.modelObject.indicators.length>0"></aw-separator>
        <aw-visual-indicator vmo="props.modelObject"> </aw-visual-indicator>
    </div>
</div>
