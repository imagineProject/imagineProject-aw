<aw-panel>
    <partition-hierarchy-table sub-panel-context="{...subPanelContext}" parent-state="data.partitionFilterState"></partition-hierarchy-table>
    <aw-panel-footer class="aw-partition-filterButton">
        <aw-button size="auto" button-type='base' action="navigateBackToPrevLocation">
            <aw-i18n>i18n.backButton</aw-i18n>
        </aw-button>
        <aw-button size="auto" action="updateFilters" enable-when="data.partitionFilterState.isFilterButtonEnable">
            <aw-i18n>i18n.Apply</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel>
