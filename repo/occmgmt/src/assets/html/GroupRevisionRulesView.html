<aw-panel-body>
    <aw-panel-section>
        <aw-label prop='data.showSelectedClausesInGroup' class="aw-groupClause-elementMargin"></aw-label>
        <aw-listbox prop="data.groupTypeList" list="data.groupTypeListValues.dbValue" class="aw-groupClause-elementMargin" action="groupTypeListSelectionChange"></aw-listbox>
        <aw-widget prop="data.usageRevisionTypeList" hint="checkboxoptionlov" class="aw-groupClause-elementMargin" exist-when="data.groupTypeList.dbValue===4"></aw-widget>
        <aw-widget prop="data.childItemTypeList" hint="checkboxoptionlov" class="aw-groupClause-elementMargin"></aw-widget>
    </aw-panel-section>
</aw-panel-body>
<aw-panel-footer>
    <aw-button action="makeGroupClauseAction" enable-when="(data.groupTypeList.dbValue===4 && data.usageRevisionTypeList.dbValues.length > 0 && data.childItemTypeList.dbValues.length > 0) || (data.groupTypeList.dbValue===3 && data.childItemTypeList.dbValues.length > 0)" size="auto">
        <aw-i18n>i18n.makeGroupClause</aw-i18n>
    </aw-button>
</aw-panel-footer>
