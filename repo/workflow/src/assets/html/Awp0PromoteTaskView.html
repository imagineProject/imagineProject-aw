<aw-command-panel caption="i18n.promoteTask" context="subPanelContext">
     <aw-panel-body>
        <aw-panel-section>
            <aw-widget  prop="data.taskName" hint="label"></aw-widget>
            <aw-widget  prop="data.description" hint="label" visible-when="conditions.showInstructions"></aw-widget>
            <aw-listbox prop="data.promotePath" visible-when="conditions.showPromotePaths" list="data.promotePaths"></aw-listbox>
            <aw-widget  prop="data.comments" hint="textarea"></aw-widget>
        </aw-panel-section>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button size="auto" action="promote" enable-when="conditions.isValidToComplete"><aw-i18n>i18n.promote</aw-i18n></aw-button>
    </aw-panel-footer>
</aw-command-panel>
