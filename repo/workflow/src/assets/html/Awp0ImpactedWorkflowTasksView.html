<aw-panel-body sub-panel-context="{ ...subPanelContext, provider : data.dataProviders.impactedWorkflowTasksInfoSearch }">
    <aw-break></aw-break>
    <aw-panel-section exist-when="conditions.showReplace" caption="i18n.ParticipantToBeReassign">
        <aw-splm-table gridid="participantToBeReassignTable" enable-when="true"></aw-splm-table>
    </aw-panel-section>
    <aw-panel-section exist-when="conditions.showAdd" caption="i18n.ParticipantToBeAdded">
        <aw-splm-table gridid="participantToBeReassignTable" enable-when="true"></aw-splm-table>
    </aw-panel-section>
    <aw-panel-section exist-when="conditions.showRemove" caption="i18n.ParticipantToBeRemoved">
        <aw-splm-table gridid="participantToBeReassignTable" enable-when="true"></aw-splm-table>
    </aw-panel-section>
    <aw-panel-section caption="i18n.ImpactedWorkflowTasks" enable-when="true">
        <h5 show-when="conditions.showAdd">i18n.showAddInfo</h5>
        <h5 show-when="conditions.showRemove">i18n.showRemoveInfo</h5>
        <h5 show-when="conditions.showReplace">i18n.showReplaceInfo</h5>
        <aw-splm-table gridid="impactedWorkflowTasksTable" show-context-menu="true"></aw-splm-table>
    </aw-panel-section>
</aw-panel-body>
