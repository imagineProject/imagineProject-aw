<div class="aw-base-scrollPanel" exist-when="!subPanelContext.searchState.totalFound && !subPanelContext.searchState.appliedFilters && !subPanelContext.searchState.totalLoaded && subPanelContext.provider.clientScopeURI === 'Awp0AvailableTemplateLists'">
    <aw-empty-workarea image="graEmptyGeneric" title="i18n.noWorkflowTemplateCreated"  hint="i18n.workflowTemplateCreatePWAHint"></aw-empty-workarea>
</div>
<div class="aw-base-scrollPanel" exist-when="!subPanelContext.searchState.totalFound && subPanelContext.searchState.appliedFilters && !subPanelContext.searchState.totalLoaded && subPanelContext.provider.clientScopeURI === 'Awp0AvailableTemplateLists'">
    <aw-empty-workarea image="graEmptyGeneric" title="i18n.noResultsFound"  hint="i18n.noResultsFoundHint"></aw-empty-workarea>
</div>
<aw-scrollpanel exist-when="subPanelContext.searchState.totalFound>0">
    <aw-list dataprovider="data.dataProviders.listDataProvider" show-context-menu="true">
        <aw-default-cell vmo="item"></aw-default-cell>

</aw-scrollpanel>
