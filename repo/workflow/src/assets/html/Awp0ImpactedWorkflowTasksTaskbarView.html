<div class="sw-row aw-taskbar-container afx-accent-background">
    <div class="sw-column justify-center flex-auto">
        <div class="sw-row justify-flex-end flex-auto" anchor="aw_fullScreen">
            <div class="sw-column aw-occmgmtduplicate-buttonMargin justify-center afx-static-size">
                <aw-checkbox prop="data.notifyAssignees" action="setUpdateTasksAndNotifyInBackground"></aw-checkbox>
            </div>
            <div class="sw-column aw-occmgmtduplicate-buttonMargin justify-center afx-static-size">
                <aw-button size='auto' action="impactedWorkflowTasksNavigateToBack">i18n.CancelText</aw-button>
            </div>
            <div class="sw-column aw-occmgmtduplicate-buttonMargin justify-center afx-static-size">
                <aw-button size='auto' action="replaceParticipantsInternal" show-when="conditions.showReplace">i18n.ModifyParticipantsOnly</aw-button>
                <aw-button size='auto' action="removeParticipantsInternal" show-when="conditions.showRemove">i18n.RemoveParticipantsOnly</aw-button>
                <aw-button size='auto' action="AddParticipantsInternal" show-when="conditions.showAdd">i18n.AddParticipantsOnly</aw-button>
            </div>
            <div class="sw-column aw-occmgmtduplicate-buttonMargin justify-center afx-static-size">
                <aw-button button-type='base' size='auto' action="replaceParticipantsInternalNew" show-when="conditions.showReplace">i18n.ModifyParticipantsReassignTasks</aw-button>
                <aw-button button-type='base' size='auto' action="removeParticipantsInternalNew" show-when="conditions.showRemove">i18n.RemoveParticipantsReassignTasks</aw-button>
                <aw-button button-type='base' size='auto' action="addParticipantsInternalNew" show-when="conditions.showAdd">i18n.AddParticipantsReassignTasks</aw-button>
            </div>
        </div>
    </div>
    <div class="sw-column justify-center">
        <aw-command-bar anchor="toolbarRightSlot" alignment="HORIZONTAL"></aw-command-bar>
    </div>
</div>
