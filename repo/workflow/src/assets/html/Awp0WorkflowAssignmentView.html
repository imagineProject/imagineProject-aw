<aw-panel-body visible-when="data.isTableDataReady">
    <div class="sw-column">
        <aw-widget prop="data.palList" visible-when="conditions.isPrivileged" action="processAssignmentListsValueChanged"></aw-widget>
        <aw-splm-table id="treeTasks" gridid="taskTreeTable" use-tree="true" show-context-menu="true" command-context="{dialogActionForReplaceContextMenu:actions.dialogActionForReplaceContextMenu, assignmentState:props.assignmentState, isPanelMode: props.subPanelContext.isPanelMode, selectionData: props.subPanelContext.selectionData, xrtState: props.subPanelContext.xrtState}"></aw-splm-table>
        <aw-dialog action="dialogActionForReplaceContextMenu"></aw-dialog> 
    </div>
</aw-panel-body>
