<aw-command-panel caption="i18n.Replace_Title" context="subPanelContext">
    <aw-people-picker visible-when="data.addUserPanelState.isDataInit" sub-panel-context="{...props.subPanelContext, addUserPanelState: data.addUserPanelState}"></aw-people-picker>
    <aw-panel-footer>
        <div visible-when="!conditions.isDynaParticipantsTableMounted">
            <aw-button size="auto" action="replaceParticipants" visible-when="!conditions.isValidToReplaceTaskParticipant" enable-when="conditions.isValidToReplace"><aw-i18n>i18n.Add_Title</aw-i18n></aw-button>
            <aw-button size="auto" action="replaceTaskParticipants" visible-when="conditions.isValidToReplaceTaskParticipant"><aw-i18n>i18n.Add_Title</aw-i18n></aw-button>
        </div>
        <div visible-when="conditions.isDynaParticipantsTableMounted">
            <aw-button size="auto" action="replaceParticipants" visible-when="!conditions.isValidToReplaceTaskParticipant" enable-when="conditions.isValidToReplace"><aw-i18n>i18n.Replace_Title</aw-i18n></aw-button>
            <aw-button size="auto" action="replaceTaskParticipants" visible-when="conditions.isValidToReplaceTaskParticipant"><aw-i18n>i18n.Replace_Title</aw-i18n></aw-button>
        </div>
    </aw-panel-footer>
</aw-command-panel>
