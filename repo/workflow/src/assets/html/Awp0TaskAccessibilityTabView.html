<aw-panel>
    <aw-panel-body scrollable="true">
        <aw-radiobutton prop="data.aclType" list="data.aclTypeValues.dbValue" action="changeAclType" exist-when="conditions.isTemplateInEditMode" ></aw-radiobutton>
        <am0-acl-table acl-prop="data.selectedACLValue" sub-panel-context="{...subPanelContext, selectedAclType:data.aclType}" is-editing="conditions.isTemplateInEditMode" named-acl-state="fields.namedAclState" ></am0-acl-table>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="Am0SaveACEEntriesAction" exist-when="conditions.isValidWrkflwDesignerLocationWithEditCriteria" size='auto'><aw-i18n>i18n.save</aw-i18n></aw-button>
    </aw-panel-footer>
</aw-panel>
