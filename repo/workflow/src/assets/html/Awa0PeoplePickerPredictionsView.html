<!-- <aw-search-box prop="data.searchBox" placeholder="data.globalSearchBoxPlaceHolder.dbValue"></aw-search-box> -->
<div class="sw-row aw-create-fillAvailable">
    <div class="sw-column w-6 flex-auto aw-results-section aw-create-fillAvailable">
        <aw-panel>
            <aw-command-panel-section id="assigner"
                exist-when="conditions.isTaskObjectSelected && conditions.isMultiUserTaskSelected"
                caption="i18n.Assigner" anchor="props.commandAnchor"
                context="{...props.taskInfoObject.props.assignee, selectedObjects: data.assignerSelectionData.selected, sidenavMode:props.subPanelContext.sidenavMode,selectedUsers:props.addUserPanelState.selectedUsers,taskObject:props.taskObject,isPrivilegedToAssign: props.assignmentState.isPrivilegedToAssign }">
                <aw-list dataprovider="data.dataProviders.assignerDataProvider" show-drop-area="true">
                    <aw-people-picker-cell vmo="item"></aw-people-picker-cell>
                </aw-list>
            </aw-command-panel-section>

            <aw-command-panel-section id="assignee"
                exist-when="conditions.isTaskObjectSelected && !conditions.isMultiUserTaskSelected"
                caption="i18n.assignee" anchor="props.commandAnchor"
                context="{...props.taskInfoObject.props.assignee, selectedObjects: data.assignerSelectionData.selected, sidenavMode:props.subPanelContext.sidenavMode,selectedUsers:props.addUserPanelState.selectedUsers,taskObject:props.taskObject,isPrivilegedToAssign: props.assignmentState.isPrivilegedToAssign}">
                <aw-list dataprovider="data.dataProviders.assignerDataProvider" show-drop-area="true"
                    name="assignerDataProvider">
                    <aw-people-picker-cell vmo="item"></aw-people-picker-cell>
                </aw-list>
            </aw-command-panel-section>

            <aw-command-panel-section id="reviewers" exist-when="conditions.isReviewOrAckOrRouteTaskSelected"
                caption="i18n.addReviewerLabelText" anchor="props.commandAnchor"
                context="{...props.taskInfoObject.props.reviewers, selectedObjects: data.reviewersSelectionData.selected, sidenavMode:props.subPanelContext.sidenavMode,selectedUsers:props.addUserPanelState.selectedUsers,taskObject:props.taskObject,isPrivilegedToAssign: props.assignmentState.isPrivilegedToAssign}">
                <aw-list dataprovider="data.dataProviders.reviewersDataProvider" show-drop-area="true">
                    <aw-people-picker-cell vmo="item"></aw-people-picker-cell>
                </aw-list>
            </aw-command-panel-section>

            <aw-command-panel-section id="acknowledgers" exist-when="conditions.isRouteTaskSelected"
                caption="i18n.Acknowledgers" anchor="props.commandAnchor"
                context="{...props.taskInfoObject.props.acknowledgers, selectedObjects: data.acknowledgersSelectionData.selected, sidenavMode:props.subPanelContext.sidenavMode, selectedUsers:props.addUserPanelState.selectedUsers,taskObject:props.taskObject,isPrivilegedToAssign: props.assignmentState.isPrivilegedToAssign}">
                <aw-list dataprovider="data.dataProviders.acknowledgersDataProvider" show-drop-area="true">
                    <aw-people-picker-cell vmo="item"></aw-people-picker-cell>
                </aw-list>
            </aw-command-panel-section>

            <aw-command-panel-section id="notifyees" exist-when="conditions.isRouteTaskSelected"
                caption="i18n.Notifyees" anchor="props.commandAnchor"
                context="{...props.taskInfoObject.props.notifyees, selectedObjects: data.notifyeesSelectionData.selected, sidenavMode:props.subPanelContext.sidenavMode, selectedUsers:props.addUserPanelState.selectedUsers,taskObject:props.taskObject,isPrivilegedToAssign: props.assignmentState.isPrivilegedToAssign}">
                <aw-list dataprovider="data.dataProviders.notifyeesDataProvider" show-drop-area="true">
                    <aw-people-picker-cell vmo="item"></aw-people-picker-cell>
                </aw-list>
            </aw-command-panel-section>

        </aw-panel>

    </div>
</div>
