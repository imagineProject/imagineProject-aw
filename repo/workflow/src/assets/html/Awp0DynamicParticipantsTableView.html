<aw-panel-body>
    <div class="sw-column w-12">
        <div class="sw-row h-2 justify-right">
            <aw-command-bar anchor="awp0DynaPartTable_commandsAnchor" class="aw-commands-commandBarHorizontalRight" context="{...subPanelContext, dataProvider:dataProviders.dynamicParticipantsProvider, selectionModel: data.dataProviders.dynamicParticipantsProvider.selectionModel, assignableParticipantTypes: data.assignableParticipantTypes}"
                    alignment="HORIZONTAL"></aw-command-bar>
        </div>
        <div class="sw-row h-10">
            <aw-splm-table gridid="dynamicParticipants" use-tree="false" show-check-box="data.dataProviders.dynamicParticipantsProvider.selectionModel.multiSelectEnabled" command-context="{assignableParticipantTypes: data.assignableParticipantTypes}" show-context-menu="true"></aw-splm-table>
        </div>
    </div>
</aw-panel-body>
