<aw-command-panel caption="i18n.Replace_Title" context="subPanelContext">
    <aw-people-picker exist-when="!conditions.arePPSuggestionsEnabled" sub-panel-context="{...props.subPanelContext, addUserPanelState : data.addUserPanelState}"></aw-people-picker>
    <aw-tab-set exist-when="conditions.arePPSuggestionsEnabled" tabs="data.tabsModel.dbValue">
        <aw-panel-body show-when="conditions.showPeoplePickerTab">
            <aw-people-picker sub-panel-context="{...props.subPanelContext, addUserPanelState : data.addUserPanelState}"></aw-people-picker>
        </aw-panel-body>
        <aw-panel-body exist-when="conditions.showSuggestionsTab">
            <aw-panel>
                <aw-command-panel-section>
                    <aw-list dataprovider="data.dataProviders.assignerDataProvider" show-drop-area="true" name="assignerDataProvider">
                        <aw-people-picker-cell vmo="item"></aw-people-picker-cell>
                    </aw-list>
                </aw-command-panel-section>
            </aw-panel>
        </aw-panel-body>
    </aw-tab-set>
    <aw-panel-footer>
        <aw-button size="auto" action="replaceTaskAssignment" visible-when="true" enable-when="conditions.isValidToAdd"><aw-i18n>i18n.modify</aw-i18n></aw-button>
    </aw-panel-footer>
</aw-command-panel>
