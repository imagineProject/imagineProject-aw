<div class="sw-column awHeader">
    <div class="sw-row aw-layout-locationTitle">
        {{i18n.impactedWorkflowTasksTitle}}
        <span class="aw-taskbasedpage-headerTitleSeparator" exist-when="conditions.isReplaceParticipant">| {{i18n.replaceParticipantTitle}}</span>
        <span class="aw-taskbasedpage-headerTitleSeparator" exist-when="conditions.isRemoveParticipant">| {{i18n.removeMultipleParticipantsCommandTitle}}</span>
        <span class="aw-taskbasedpage-headerTitleSeparator" exist-when="conditions.isAddParticipants">| {{i18n.addParticipantCommandTitle}}</span>
        <span class="aw-taskbasedpage-headerTitleSeparator">|</span>
        {{ ctx.state.params.headerTitle ? ctx.state.params.headerTitle : ctx.state.params.subPanelContext.showObjectContext.displayName }}
    </div>
</div>
