<div class="aw-base-scrollPanel w-12" exist-when="!subPanelContext.searchState.totalFound && subPanelContext.searchState.criteria.searchString === '' && !subPanelContext.searchState.totalLoaded && subPanelContext.provider.clientScopeURI === 'fnd0mytasks'">
    <aw-empty-workarea image="graEmptyInbox" title="i18n.noTaskAssignedToMe"  hint="i18n.taskAvailabilityGoToTeamHint"
        action="actions.goToTeamLocation" link-text="i18n.goToTeam"></aw-empty-workarea>
</div>
<div class="w-12" exist-when="!subPanelContext.searchState.totalFound && subPanelContext.searchState.criteria.searchString === '' && !subPanelContext.searchState.totalLoaded && subPanelContext.provider.clientScopeURI === 'Awp0TeamTasks'">
    <aw-empty-workarea image="graEmptyInbox" title="i18n.noTaskAssignedToTeam"  hint="i18n.taskAvailabilityHint"></aw-empty-workarea>
</div>
<div class="w-12" exist-when="!subPanelContext.searchState.totalFound && subPanelContext.searchState.criteria.searchString === '' && !subPanelContext.searchState.totalLoaded && subPanelContext.provider.clientScopeURI === 'Awp0TasksToTrack'">
    <aw-empty-workarea image="graEmptyInbox" title="i18n.noTaskForMeToTrack"  hint="i18n.noTrackingTaskHint"></aw-empty-workarea>
</div>
<div class="w-12" exist-when="!subPanelContext.searchState.totalFound && subPanelContext.searchState.criteria.searchString === '' && !subPanelContext.searchState.totalLoaded && subPanelContext.provider.clientScopeURI === 'fnd0alltasks'">
    <aw-empty-workarea image="graEmptyInbox" title="i18n.noTasks"  hint="i18n.noTaskForAttentionHint"></aw-empty-workarea>
</div>
<div class="w-12" exist-when="!subPanelContext.searchState.totalFound && subPanelContext.searchState.criteria.searchString === '' && !subPanelContext.searchState.totalLoaded && subPanelContext.provider.clientScopeURI === 'fnd0surrogatescope'">
    <aw-empty-workarea image="graEmptyInbox" title="i18n.noSurrogateTask"  hint="i18n.noSurrogateTaskHint"></aw-empty-workarea>
</div>
<div class="w-12" exist-when="!subPanelContext.searchState.totalFound && subPanelContext.searchState.criteria.searchString !== '' && ( subPanelContext.provider.clientScopeURI === 'fnd0mytasks' || subPanelContext.provider.clientScopeURI === 'Awp0TeamTasks' || subPanelContext.provider.clientScopeURI === 'Awp0TasksToTrack' || subPanelContext.provider.clientScopeURI === 'fnd0alltasks' || subPanelContext.provider.clientScopeURI === 'fnd0surrogatescope' )">
    <aw-empty-workarea image="graEmptyInbox" title="i18n.noResultsFound"  hint="i18n.noResultsFoundHint"></aw-empty-workarea>
</div>
<aw-scrollpanel exist-when="subPanelContext.searchState.totalFound>0">
    <aw-list dataprovider="data.dataProviders.listDataProvider" show-context-menu="true"  command-context="subPanelContext" show-decorators="true" show-check-box="subPanelContext.pwaSelectionModel.multiSelectEnabled">
        <aw-default-cell vmo = "item"></aw-default-cell>
    </aw-list>
    <aw-dialog action="inboxDialogAction"></aw-dialog>
</aw-scrollpanel>
