<div class="aw-base-scrollPanel w-12" exist-when="!subPanelContext.searchState.totalFound && !subPanelContext.searchState.totalLoaded && conditions.isMyPalListOrGroupList">
    <aw-empty-workarea image="graEmptyGeneric" title="i18n.nothingAddedYet"  hint="i18n.tryCreatingNewlist"
        action="actions.createAssignmentListLinkCommand"
        link-text="i18n.createProcessAssignmentList"></aw-empty-workarea>
</div>
<div class="w-12" exist-when="!subPanelContext.searchState.totalFound && !subPanelContext.searchState.totalLoaded && conditions.isOtherPalList">
    <aw-empty-workarea image="graEmptyGeneric" title="i18n.noResultsFound"  hint="i18n.OtherPalListHint"></aw-empty-workarea>
</div>
<aw-scrollpanel exist-when="subPanelContext.searchState.totalFound>0" >
    <aw-list dataprovider="data.dataProviders.listDataProvider" show-context-menu="true">
       <aw-default-cell vmo="item"></aw-default-cell>
    </aw-list>
</aw-scrollpanel>
