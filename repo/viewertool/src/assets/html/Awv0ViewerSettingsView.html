<aw-command-panel caption="i18n.toolPanelTitle" context="subPanelContext">
    <aw-panel-body>
        <aw-panel-section caption="i18n.renderPanelTitle">
            <aw-checkbox prop="fields.visAllOnCheckboxProp" exist-when="conditions.showVisAllOn" action="visAllOnSettingChanged" extended-tooltip="data.visAllOnExtendedTooltip"></aw-checkbox>
            <aw-checkbox prop="fields.shadedCheckboxProp" exist-when="conditions.showShadedWithEdges" action="shadedWithEdgesSettingChanged"></aw-checkbox>
            <aw-radiobutton prop="data.renderSourceRadioProp" action="renderSourceChanged" exist-when="conditions.showRenderOptions" enable-when="conditions.enableRenderOptions"></aw-radiobutton>
            <aw-widget prop="data.occCullProp" exist-when="!conditions.isSSRViewer" hide-filter=true action="occCullingSelectionChange" is-select-only="true"></aw-widget>
        </aw-panel-section>
        <aw-panel-section caption="i18n.orientation">
            <aw-widget prop="data.orientationProp"hide-filter=true action="setOrientation" is-select-only="true"></aw-widget>
            <aw-label prop="data.orientationDisplayProp"></aw-label>
            <aw-checkbox prop="fields.navCubeCheckboxProp" action="navCubeCheckboxPropSettingChanged" exist-when="!conditions.isSSRViewer"></aw-checkbox>
            <aw-checkbox prop="fields.trihedronCheckboxProp" action="trihedronSettingChanged" exist-when="conditions.isSSRViewer"></aw-checkbox>
            <aw-label prop="data.pmiPanelTitleProp" exist-when="conditions.showPMI"></aw-label>
            <aw-checkbox prop="data.pmiCheckboxProp" action="pmiSettingChanged"  exist-when="conditions.showPMI"></aw-checkbox>
            <aw-widget prop="data.moveManipulatorDefaultPositionProp" hide-filter=true action="moveManipulatorDefaultPositionChanged" is-select-only="true" exist-when="!conditions.isSSRViewer"></aw-widget>

        </aw-panel-section>
        <aw-panel-section caption="i18n.navigationPanelTitle" exist-when="conditions.showNavigationPanelSection">
            <aw-radiobutton class="sw-column" prop="data.mouseGestureProp" action="mouseGestureSettingChanged" exist-when="!conditions.isSSRViewer"></aw-radiobutton>
            <aw-radiobutton class="sw-column" prop="data.fitTypeRadioProp" action="fitTypeSettingChange" exist-when="!conditions.isSSRViewer"></aw-radiobutton>
            <aw-radiobutton class="sw-column" prop="data.navigationRadioProp" action="navigationSettingChanged" exist-when="conditions.showNavigationRadioOption"></aw-radiobutton>
        </aw-panel-section>
        <aw-panel-section caption="i18n.trueShading"  exist-when="conditions.enabledTrueShadeOption">
            <div class="sw-row aw-viewertool-selectedMaterial">
                <div class="aw-viewertool-selectedMaterialCheckbox">
                    <aw-checkbox prop="data.materialCheckboxProp" action="materialSettingChanged"></aw-checkbox>
                </div>
                <div aw-click="actions.launchMaterialPopup" id="materialRefId" class="aw-viewertool-selectedMaterialIcon">
                    <aw-image id="materialRefId" source="data.materialProp.iconUrl" is-icon="true"></aw-image>
                </div>
                <div class="sw-property-name aw-viewertool-selectedMaterialText">
                    {{data.materialProp.tooltip}}
                </div>
            </div>
            <aw-label prop="data.floorDispNameProp"></aw-label>
            <aw-checkbox prop="data.showFloorCheckboxProp" action="showFloorSettingChanged"></aw-checkbox>
            <div class="aw-viewertool-floorSection" exist-when="conditions.showFloorOptions">
                <aw-widget prop="data.floorPlanProp" hide-filter=true action="viewerFloorPlaneChanged" is-select-only="true"></aw-widget>
                <aw-label prop="data.offsetLabelProp" ></aw-label>
                <aw-slider prop="data.floorSliderProp" ></aw-slider>
                <aw-checkbox prop="data.gridCheckboxProp" action="gridSettingChanged"></aw-checkbox>
                <aw-checkbox prop="data.shadowCheckboxProp" action="shadowSettingChanged"></aw-checkbox>
                <aw-checkbox prop="data.reflectionCheckboxProp" action="reflectionSettingChanged"></aw-checkbox>
            </div>
        </aw-panel-section>
        <aw-panel-section caption="i18n.unitPanelTitle">
            <aw-label prop="data.modelTitleProp" exist-when="conditions.viewerSettingOn3DTab"></aw-label>
            <aw-widget prop="data.unitTextProp" action="setDisplayUnit" is-select-only="true"></aw-widget>
        </aw-panel-section>
        <aw-panel-section caption="i18n.colorThemeTitle" exist-when="conditions.viewerSettingOn3DTab">
            <aw-widget prop="data.themeProp" hide-filter=true action="themeSelectionChange" is-select-only="true"></aw-widget>
            <aw-label prop='data.lightingProp'  exist-when="!conditions.isSSRViewer"></aw-label>
            <aw-slider prop="data.lightingSliderProp"  exist-when="!conditions.isSSRViewer"></aw-slider>
        </aw-panel-section>
        <aw-panel-section caption="i18n.selectionDisplayPanelTitle" exist-when="!conditions.isSSRViewer">
            <aw-checkbox prop="data.useHighlightPartsOnMouseHoverProp" action="useHighlightPartsOnMouseHoverChanged"></aw-checkbox>
            <aw-numeric prop="data.hoverHighlightDelayProp" extended-tooltip="data.hoverHighlightDelayTooltip"></aw-numeric>       
        </aw-panel-section>
        <aw-panel-section caption="i18n.IndexedModePanelTitle" exist-when="conditions.showIndexedOption">
            <aw-checkbox prop="data.useIndexedCheckboxProp" action="useIndexedSettingChanged"></aw-checkbox>
        </aw-panel-section>
        </aw-panel-section>
        <aw-panel-section caption="i18n.diagnostics" exist-when="conditions.isDiagnosticsEnabled">
            <div class="sw-row">
                <div class="sw-column w-1">
                    <aw-icon class="sw-pic-thumbnail" icon-id="cmdFile"></aw-icon>
                </div>
                <div class="sw-column w-7">
                    <div class="sw-row"> {{i18n.viewerDiagnosticReport}}</div>
                    <div class="sw-row"> {{i18n.txtFile}}</div>
                </div>
                <div class="sw-column w-4">
                    <aw-icon-button command="data.viewerDiagnosticReport"></aw-icon-button>
                </div>
            </div>
        </aw-panel-section>
    </aw-panel-body>
    <aw-panel-footer>
    </aw-panel-footer>
</aw-command-panel>
<aw-popup options="actions.launchMaterialPopup.options" popup="launchMaterialPopup">
    <aw-include name="Awv0MaterialGridPopup" sub-panel-context="{ materialProp:fields.materialProp }"></aw-include>
</aw-popup>
