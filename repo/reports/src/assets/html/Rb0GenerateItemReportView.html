<aw-panel-body exist-when="!data.addPanelState.sourceObjects.length || data.addPanelState.sourceObjects.length === 0 || props.subPanelContext.selectionReportDef.props.rd_source.dbValues[0] === 'Active Workspace'">
    <search-tab-page-sub sub-panel-context="{searchFilterTabModels: data.searchFilterTabModels.dbValue,addPanelState: data.addPanelState, typeFilter: data.typeFilter.dbValue, selectionMode: data.selectionMode}">
    </search-tab-page-sub>
</aw-panel-body>
<aw-panel-header exist-when="data.addPanelState.sourceObjects.length > 0 && props.subPanelContext.selectionReportDef.props.rd_source.dbValues[0] !== 'Active Workspace'">
    <Aw-Cell-Header anchor="Rb0_Reports_sourceObjectCellCommands" header-vmo="data.addPanelState.sourceObjects[0]" sub-panel-context="{addPanelState: fields.addPanelState}"></Aw-Cell-Header>
</aw-panel-header>
<aw-panel-body exist-when="data.addPanelState.sourceObjects.length > 0 && props.subPanelContext.selectionReportDef.props.rd_source.dbValues[0] !== 'Active Workspace'">
    <aw-panel-section caption="i18n.properties" exist-when="conditions.showifBOM">
        <aw-listbox prop="data.packedbom" list="data.packedbombooleanValues"></aw-listbox>
        <aw-listbox prop="data.revRuleProp" list="data.revRuleLovList"></aw-listbox>
    </aw-panel-section>
    <aw-panel-section caption="i18n.customPanel" visible-when="conditions.showForCustomRD && !data.customreportPropConfig" exist-when="data.customProps" collapsed="disabled">
        <aw-widget visible-when="!data.customreportPropConfig" prop="property" aw-repeat="property : data.customProps"></aw-widget>
    </aw-panel-section>
    <aw-panel-section caption="i18n.additionalParams" collapsed="disabled">
        <aw-listbox prop="data.selectStyleSheet" list="data.reportStylesheets"></aw-listbox>
        <aw-listbox prop="data.displayLocale" list="data.languageList" visible-when="conditions.showifSourceIsTc"></aw-listbox>
        <aw-textbox prop="data.saveToDataSet" visible-when="conditions.showifSourceIsTc && !data.customreportPropConfig"></aw-textbox>
        <aw-checkbox prop="data.doLiveIntegration" visible-when="conditions.showforOfficeTemplate"></aw-checkbox>
    </aw-panel-section>
</aw-panel-body>
<aw-panel-footer class="sw-column">
    <aw-checkbox prop="data.runReportAsync" exist-when="data.addPanelState.sourceObjects.length > 0 && props.subPanelContext.selectionReportDef.props.rd_source.dbValues[0] !== 'Active Workspace'" visible-when="conditions.showifSourceIsTc && !data.customreportPropConfig"></aw-checkbox>
    <aw-button class="align-self-right" enable-when="conditions.isCriteriaAvailable" action="generateReport" size="auto">
        <aw-i18n>i18n.generateReport</aw-i18n>
    </aw-button>
</aw-panel-footer>
