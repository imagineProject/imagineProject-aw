<div class="aw-reports-defaultView" exist-when="data.showDefaultMessage">
    <aw-empty-workarea exist-when="!data.selectedReport"
        image="graEmptyReport128"
        hint="i18n.generateReportHint"
        action="actions.openGenerateReport"
        link-visibility="true"
        link-text="i18n.generateAdvCommandName">
    </aw-empty-workarea>
    <aw-empty-workarea exist-when="data.selectedReport"
        image="graEmptyReport128"
        title="i18n.noReportAvailable">
    </aw-empty-workarea>
</div>
<div class="sw-column" exist-when="!data.showDefaultMessage" justify="center">
    <div class="sw-row aw-reportView-containerSize w-12" align-content="center" exist-when="!data.showAwReport">
        <iframe title="{{i18n.reportsPage}}" class="aw-reports-frameSize"></iframe>
    </div>
    <div class="sw-row aw-reportView-containerSize w-12" align-content="center" exist-when="data.showAwReport">
        <aw-active-report-viewer report-template="data.selectedReport" report-source-object-uid="{{data.selectedSourceObject.uid}}" sub-panel-context="{ ...subPanelContext}"></aw-active-report-viewer>
    </div>
</div>
