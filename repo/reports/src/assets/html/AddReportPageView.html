<aw-panel-body>
    <aw-panel-section class="h-2" caption="i18n.reportTemplates" collapsed="disabled">
        <aw-widget prop="data.reportsList"></aw-widget>
    </aw-panel-section>
    <aw-panel-section class="aw-reports-searchItem" caption="i18n.item" exist-when="conditions.sourceItemAdd" collapsed="disabled">
        <search-data-tab-page sub-panel-context='{searchState: fields.searchState, selectionData: fields.selectionData, typeFilter: data.dataProviders.reportsDataProvider.selectedObjects[0].reportdefinition.props.rd_class.dbValues[0]}'></search-data-tab-page>
    </aw-panel-section>
</aw-panel-body>
<aw-panel-footer>
    <aw-button action="addReport" enable-when="conditions.isAddEnabled" size="auto">
        <aw-i18n>i18n.addDashboardReportWithPanelTitle</aw-i18n>
    </aw-button>
</aw-panel-footer>
