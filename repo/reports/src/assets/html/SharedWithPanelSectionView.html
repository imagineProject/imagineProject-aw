<aw-scrollpanel aw-class="[{ 'aw-search-searchFolderSharedWithTableContent': !conditions.isMobileMode }]" exist-when="props.shareReportState.sharedWithList.length>0 || props.sharedWith ==='private' || props.sharedWith ==='public'">
    <aw-search-box prop="data.sharedTableSearchBox" action="doGridDataProvider"></aw-search-box>
    <aw-splm-table aw-class="[{ 'aw-reports-heightForShareWithListInMobileMode': conditions.isMobileMode }]" gridid="accessorsView" show-context-menu="true"></aw-splm-table>
</aw-scrollpanel>
<aw-scrollpanel class="justify-center" exist-when="props.sharedWith ==='custom' &&  props.shareReportState.sharedWithList.length===0">
    <aw-label class="aw-reports-defaultNotSharedTitle" prop='data.defaultNotSharedTitle'></aw-label>
    <aw-label class="aw-reports-defaultNotSharedDesc" prop='data.defaultNotSharedDesc'></aw-label>
</aw-scrollpanel>
