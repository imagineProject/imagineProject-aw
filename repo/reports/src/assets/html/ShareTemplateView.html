<aw-panel>
    <aw-panel-header>
        <aw-cell-header anchor="aw_info_panel_cell_header" header-vmo="subPanelContext.shareReportState.selectedReport" sub-panel-context="props"></aw-cell-header>
        <aw-radiobutton class="sw-row" prop="data.sharedWith" list="data.sharedWithValues.dbValue"></aw-radiobutton>
    </aw-panel-header>
    <aw-panel-body class="aw-reports-shareTemplateBody h-12" enable-when="data.sharedWith.dbValue==='custom'">
        <div aw-class="[{ 'h-12': !conditions.isMobileMode }]" class="aw-search-searchFolderSharingTab">
            <div aw-class="[{ 'h-12': !conditions.isMobileMode }]" class="aw-layout-flexColumn">
                <div aw-class="[{ 'sw-column h-12': conditions.isMobileMode },{ 'sw-row': !conditions.isMobileMode }]" class="aw-layout-flexRowContainer w-12">
                    <div aw-class="[{ 'sw-row w-12 h-6': conditions.isMobileMode },{ 'sw-column w-6': !conditions.isMobileMode }]" class="aw-search-searchFolderAvailableTable">
                        <aw-panel-section class="aw-reports-availableListSection" aw-class="[{ 'h-12': !conditions.isMobileMode }]" caption="i18n.availableTable">
                            <aw-radiobutton prop="data.searchFolderShareRuleOption" list="data.searchFolderShareRuleOptionValues.dbValue"></aw-radiobutton>
                            <rb0-report-template-share-rule-users-table
                                aw-class="[{ 'aw-reports-heightForShareListInMobileMode': conditions.isMobileMode }]"
                                exist-when="data.searchFolderShareRuleOption.dbValue === 'users'"
                                share-report-state="subPanelContext.shareReportState">
                            </rb0-report-template-share-rule-users-table>
                            <rb0-report-template-share-rule-projects-table
                                aw-class="[{ 'aw-reports-heightForShareListInMobileMode': conditions.isMobileMode }]"
                                exist-when="data.searchFolderShareRuleOption.dbValue === 'projects'"
                                share-report-state="subPanelContext.shareReportState">
                            </rb0-report-template-share-rule-projects-table>
                            <rb0-report-template-share-rule-organization
                                aw-class="[{ 'aw-reports-heightForShareListInMobileMode': conditions.isMobileMode }]"
                                exist-when="data.searchFolderShareRuleOption.dbValue === 'organization'"
                                share-report-state="subPanelContext.shareReportState">
                            </rb0-report-template-share-rule-organization>
                        </aw-panel-section>
                    </div>

                    <aw-command-bar class="aw-search-searchFolderAccessor" anchor="aw_reportsShareAccessorToolbar" alignment="VERTICAL" context="{shareReportState: subPanelContext.shareReportState}" exist-when="!conditions.isMobileMode"></aw-command-bar>

                    <aw-command-bar class="aw-reports-shareCmdBar" anchor="aw_reportsShareAccessorToolbarMobile" alignment="HORIZONTAL" context="{shareReportState: subPanelContext.shareReportState}" exist-when="conditions.isMobileMode"></aw-command-bar>

                    <div aw-class="[{ 'sw-row w-12 aw-reports-heightForShareListInMobileMode': conditions.isMobileMode },{ 'sw-column w-6 h-12': !conditions.isMobileMode }]" class="aw-search-searchFolderSharedWithTable">
                        <aw-panel-section class="aw-reports-sharedListSection" aw-class="[{ 'h-12': !conditions.isMobileMode }]" caption="i18n.sharedWithTable">
                            <shared-with-panel-section
                                share-report-state="subPanelContext.shareReportState"
                                shared-with="{{data.sharedWith.dbValue}}"
                                sub-panel-context="props.subPanelContext">
                            </shared-with-panel-section>
                        </aw-panel-section>
                    </div>
                </div>
            </div>
        </div>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="initiateCreateRelations" enable-when="conditions.enableShareButton" size="auto">
            <aw-i18n>i18n.shareTemplateTitle</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel>
