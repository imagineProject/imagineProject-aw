<aw-panel>
    <aw-panel-body>
        <aw-panel-section exist-when="ctx.sublocation.historyNameToken === 'teamcenter_search_search' || ctx.sublocation.historyNameToken === 'teamcenter_search_advancedSearch'" caption="i18n.reportTypeLabel" collapsed="disabled">
            <aw-radiobutton prop="data.reportTypeRadio" list="data.reportTypeValues.dbValue"></aw-radiobutton>
        </aw-panel-section>
        <aw-panel-section exist-when="(data.reportTypeRadio.dbValue === '0' && (props.subPanelContext.searchState.criteria.searchString.length > 0 || (props.subPanelContext.searchState.advancedSearchCriteria && props.subPanelContext.searchState.referencingSavedQuery)) || data.reportTypeRadio.dbValue === '1' && ctx.mselected.length > 0)" caption="i18n.reportCriteria" collapsed="disabled">

            <aw-togglebutton prop="data.blankRepCriteriaToggleBtn"></aw-togglebutton>
            <aw-break></aw-break>
            <aw-label class="aw-reports-chooseCriteriaLabel" exist-when="!data.blankRepCriteriaToggleBtn.dbValue" prop="data.chooseCriteriaLabel"></aw-label>

            <div exist-when="data.reportTypeRadio.dbValue === '0' && (props.subPanelContext.searchState.criteria.searchString.length > 0 || (props.subPanelContext.searchState.advancedSearchCriteria && props.subPanelContext.searchState.referencingSavedQuery)) && !data.blankRepCriteriaToggleBtn.dbValue">
                <aw-label exist-when="props.subPanelContext.searchState.savedQuery.name" prop="data.search"></aw-label>
                <aw-label prop="data.searchString"></aw-label>
                <aw-label exist-when="props.subPanelContext.searchState.criteria.searchString.length > 0" prop="data.searchFilters"></aw-label>
            </div>
            <div exist-when="data.reportTypeRadio.dbValue === '1' && ctx.mselected.length > 0 && !data.blankRepCriteriaToggleBtn.dbValue">
                <aw-list dataprovider="data.dataProviders.selectionList">
                    <div class='sw-column w-12'>
                        <aw-search-cell vmo="item" sub-panel-context="subPanelContext"></aw-search-cell>
                    </div>
                </aw-list>
            </div>
        </aw-panel-section>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="navigateToCreateReport" enable-when="conditions.isSelectEnabled" size="auto">
            <aw-i18n>i18n.addNewReport</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel>
