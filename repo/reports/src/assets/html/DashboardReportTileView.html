<div id="{{subPanelContext.selectedReport.props.rd_name.uiValues[0]}}" title="{{subPanelContext.selectedReport.props.rd_name.dbValues[0]}}" class="h-12"
aw-class="[{'aw-reports-chartContent': !conditions.showtheTable && !conditions.showtheChart }, {'aw-reports-tableContent': conditions.showtheTable},{'aw-reports-chartContent': conditions.showtheChart}]">
    <div class="sw-row">
        <div class="sw-column aw-reports-dashboardTemplateInfo">
            <aw-link class="aw-reports-reportTitle" prop="data.reportlink" action="goToReport"></aw-link>
            <aw-link class="aw-reports-reportSourceName" prop="data.reportSource" action="goToSource" exist-when="conditions.showSourceLink"></aw-link>
            <div class="aw-reports-reportTotalFound" exist-when="conditions.showtheChart || conditions.showtheTable">
                {{data.totalObjectFound}}
            </div>
        </div>
        <div class="sw-column aw-reports-dashboardTemplateCommands" aw-class="{'aw-reports-tableMarginShift':conditions.showtheTable}">
            <aw-cell-command-bar anchor="reportTileViewerCommands" alignment="HORIZONTAL" context="{...subPanelContext, gridContextPlaceholder: props.grids.dashboardReportTable.gridContextPlaceholder, dataprovider: data.dataProviders.dashboardReportTableDataProvider, ...data.exportContext}"></aw-cell-command-bar>
        </div>
    </div>
    <div class="sw-row aw-reports-dashboardThumbnail" aw-class="[{'aw-reports-ReportThumbnailWithLink': conditions.showSourceLink}]">
        <aw-splm-table gridid="dashboardReportTable" reusable="true" selection-data="props.subPanelContext.selectionData" exist-when="conditions.showtheTable"></aw-splm-table>
        <aw-chart chart-provider="data.chartProviders.myChartProvider" exist-when="conditions.showtheChart"></aw-chart>
    </div>
</div>
