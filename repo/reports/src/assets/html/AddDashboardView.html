<aw-panel-body>
    <div>
        <aw-cell-header exist-when="subPanelContext.searchState.editingDashboard" anchor="aw_info_panel_cell_header" header-vmo="subPanelContext.searchState.dashboardTabObject" sub-panel-context="props"></aw-cell-header>
        <aw-panel-section caption="i18n.properties">
            <aw-widget prop="data.dashboardName"></aw-widget>
            <aw-widget prop="data.dashboardDesc"></aw-widget>
            <report-definition-additional-props exist-when="subPanelContext.searchState.editingDashboard" sub-panel-context="{selected:subPanelContext.searchState.dashboardTabObject}"></report-definition-additional-props>
        </aw-panel-section>
    </div>
    <aw-panel-section class="aw-reports-dashboardTemplatesList" caption="i18n.templatesTitle">
        <aw-server-visibility-command-bar anchor="rb0_reportTemplateList_commands" alignment="HORIZONTAL" context="{selectedObjects: data.dataProviders.listDataProvider.selectedObjects, dataProvider: dataProviders.listDataProvider, searchState: subPanelContext.searchState}" overflow = true></aw-server-visibility-command-bar>
        <aw-scrollpanel exist-when="!data.searchResults || data.searchResults.length > 0">
            <aw-list dataprovider="data.dataProviders.listDataProvider">
            <aw-default-cell vmo="item"></aw-default-cell>
            </aw-list>
        </aw-scrollpanel>
    </aw-panel-section>
</aw-panel-body>
<aw-panel-footer>
    <aw-button action="saveReportDashboardAction" enable-when="conditions.enableSave" size="auto">
        <aw-i18n>{{props.subPanelContext.searchState.editingDashboard ? i18n.saveReport : i18n.addDashboardReportWithPanel}}</aw-i18n>
    </aw-button>
</aw-panel-footer>
