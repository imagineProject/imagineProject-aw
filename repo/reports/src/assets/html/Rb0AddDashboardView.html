<aw-command-panel caption="{{subPanelContext.searchState.editingDashboard ? i18n.editDashboard : i18n.addDashboard}}" context="subPanelContext">
    <aw-command-sub-panel exist-when="!subPanelContext.searchState.dashboardActiveView && data.submitPanelState.dashboardId.dbValue.length>0" panel-id="AddDashboard" sub-panel-context="{...subPanelContext, submitPanelState: data.submitPanelState}"></aw-command-sub-panel>
    <aw-navigate-panel title='{{i18n.addDashboardReportWithPanelTitle}}' pre-panel-id='AddDashboard' panel-id='AddReportPage' sub-panel-context="{...subPanelContext, isSubPanel: 'true'}" exist-when="subPanelContext.searchState.dashboardActiveView" action="updateActiveView">
    </aw-navigate-panel>
</aw-command-panel>
