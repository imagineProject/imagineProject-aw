<aw-command-panel caption="i18n.inContextReportPanelTitle" context="subPanelContext">
    <aw-command-sub-panel panel-id="Awp0ReportsSummaryExecution" exist-when="data.reportDefnObject.props.rd_type.dbValues[0] !== '1' && !data.reportDefnObject.props.rd_class.dbValues[0].length" sub-panel-context="{ ...subPanelContext, selectionReportDef: data.reportDefnObject }"></aw-command-sub-panel>
    <aw-command-sub-panel panel-id="Rb0GenerateItemReport" exist-when="data.reportDefnObject.props.rd_type.dbValues[0] === '1' || (data.reportDefnObject.props.rd_type.dbValues[0] === '2' && data.reportDefnObject.props.rd_class.dbValues[0].length > 0)" sub-panel-context="{ ...subPanelContext, selectionReportDef: data.reportDefnObject }"></aw-command-sub-panel>
</aw-command-panel>
