<div class="aw-base-scrollPanel" exist-when="data.searchResults.filteredList.length === 0">
    <aw-empty-workarea
        image="graEmptyReport128"
        title="i18n.noReportTemplates"
        hint="i18n.emptyReportAreaHint"
        action="actions.createReport"
        link-visibility="true"
        link-text="i18n.createReport">
    </aw-empty-workarea>
</div>
<div class="aw-base-scrollPanel" exist-when="data.searchResults.filteredList.length>0 && conditions.noSearchResultsFound">
    <aw-empty-workarea
        image="graEmptyReport128"
        title="i18n.noSearchResultsFoundTitle"
        hint="i18n.noSearchResultsFoundHint">
    </aw-empty-workarea>
</div>
<aw-scrollpanel exist-when="data.searchResults.filteredList.length>0 && !conditions.noSearchResultsFound">
  <aw-list dataprovider="data.dataProviders.listDataProvider">
     <aw-default-cell vmo="item"></aw-default-cell>
  </aw-list>
</aw-scrollpanel>
