<aw-panel-body class="aw-reports-searchItem">
    <aw-panel-section caption="i18n.dataSource">
        <aw-textbox prop="data.dataProviderName"></aw-textbox>
        <aw-label prop="data.criteria" exist-when="data.CriteriaChips.length > 0"></aw-label>
        <aw-chip-list class="aw-reports-criteriaLabelsContainer w-12" dataprovider="data.dataProviders.criteriaChipDataProvider" action="chipUIAction" ui-icon-action="removeChipAction" exist-when="data.CriteriaChips.length > 0"></aw-chip-list>
    </aw-panel-section>
    <aw-panel-section class="aw-reports-addCustomCriteriaPanel" caption="i18n.addCriteria">
        <div class="sw-row justify-right">
            <div class="aw-reports-addCriteriaInfoLabel aw-aria-border" tabindex="0" extended-tooltip="data.addCriteriaInfoTooltip">
                <aw-icon icon-id="homehelp"></aw-icon>
            </div>
        </div>
        <aw-widget prop="data.searchCriteriaKey"></aw-widget>
        <aw-widget prop="data.searchCriteriaValue"></aw-widget>
        <aw-panel-footer>
            <aw-button action="addCriteriaChip" size="auto" enable-when="conditions.addSearchCriteriaInput">
                <aw-i18n>i18n.addReport</aw-i18n>
            </aw-button>
        </aw-panel-footer>
    </aw-panel-section>
</aw-panel-body>
<aw-panel-footer>
    <aw-button action="saveCustomSearchCriteria" size="auto" button-type="base">
        <aw-i18n>i18n.preview</aw-i18n>
    </aw-button>
    <aw-button action="saveCriteriaAndClose" enable-when="conditions.totalFoundAvailable" size="auto">
        <aw-i18n>i18n.saveReport</aw-i18n>
    </aw-button>
</aw-panel-footer>
