<aw-panel class='h-12'>
    <aw-panel-body class="sw-column aw-searchResultsFilters-tab aw-create-fillAvailable">
        <div>
            <aw-widget class="aw-reports-relationProp" prop="data.relationValue" ></aw-widget>
            <div class="sw-row">
                <aw-icon-button
                exist-when="!subPanelContext.searchState.hideFilters"
                command="data.filterCommand"
                aw-class="[{'disabled': subPanelContext.searchState.categories && subPanelContext.searchState.categories.length === 0 || !subPanelContext.searchState.categories},
                { 'aw-state-selected': data.activeSection === 'filter' && subPanelContext.searchState.categories && subPanelContext.searchState.categories.length > 0 }]" ></aw-icon-button>
            </div>
            <aw-search-breadcrumb-title crumb-title="data.crumbTitle" exist-when="data.activeSection === 'filter'">
            </aw-search-breadcrumb-title>
            <aw-search-breadcrumb-chips search-object="subPanelContext.searchState" >
            </aw-search-breadcrumb-chips>
        </div>
        <div class="sw-column aw-create-fillAvailable">
            <aw-panel-section collapsed="disabled"
                caption="i18n.filters"
                class="aw-filters-section aw-create-fillAvailable"
                exist-when="data.activeSection === 'filter'">
                <aw-panel class="aw-search-filterPadding">
                    <aw-filter-panel exist-when="data.activeSection === 'filter'" sub-panel-context="props.subPanelContext" string-facet-call-back="" numeric-range-facet-call-back="" date-range-facet-call-back=""></aw-filter-panel>
                </aw-panel>
            </aw-panel-section>
            <aw-panel-section collapsed="disabled"
                caption="{{data.resultsText}}"
                exist-when="data.activeSection === 'result'"
                class="aw-results-section aw-create-fillAvailable">
                <aw-list dataprovider="data.dataProviders.searchListDataProvider" has-floating-cell-commands="true" show-decorators="true"
                show-context-menu="true" show-check-box="subPanelContext.showCheckBox">
                    <div class='sw-column w-12'>
                        <aw-search-cell vmo="item" sub-panel-context="subPanelContext"></aw-search-cell>
                    </div>
                </aw-list>
            </aw-panel-section>
        </div>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button size='auto' enable-when="conditions.isSaveEnabled" action="addFilterAction">
            <aw-i18n>{{props.subPanelContext.activeState.selectedNode.searchFilterMapCount ? i18n.saveReport : i18n.addFilter}}</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel>
