<div class="sw-row aw-taskbar-container afx-accent-background w-12">
    <div class="sw-row aw-reports-reportTypeContainer">
        <div class="aw-reports-reportTypeLabel">
            <aw-property-label prop="data.reportTypeLabel"></aw-property-label>
        </div>
        <div class="aw-reports-typeSelectorWidget">
            <aw-widget class="w-12" enable-when="conditions.editMode" prop="data.reportTypeName" action="changeReportType"></aw-widget>
        </div>
        <div class="aw-reports-criteriaLabel sw-row w-11" exist-when="!conditions.itemReport && props.subPanelContext.reportsState.searchTypeChip.length>0">
            <aw-chip-list class="aw-reports-reportCriteriaContainer" enable-when="conditions.notPreviewed" button-type="base" dataprovider="data.dataProviders.searchTypeChipDataProvider"></aw-chip-list>
            <div class="w-12" exist-when="props.subPanelContext.reportsState.searchTypeChip.length>0">
                <div class="sw-row w-12" exist-when="props.subPanelContext.reportsState.searchTypeChip[0].labelDisplayName !== i18n.customSearch">
                    <aw-label class="aw-reports-relationProp" exist-when="props.subPanelContext.reportsState.searchTypeChip[0].labelDisplayName === i18n.results || props.subPanelContext.reportsState.searchTypeChip[0].labelDisplayName === i18n.advanced" prop="data.searchCriteriaValue"></aw-label>
                    <aw-label class="aw-reports-relationProp" exist-when="props.subPanelContext.reportsState.searchTypeChip[0].labelDisplayName === i18n.results && data.filterValue.dbValue.length > 0" prop="data.filterValue"></aw-label>
                </div>
                <div class="sw-row w-12" exist-when="props.subPanelContext.reportsState.searchTypeChip[0].labelDisplayName === i18n.customSearch">
                    <aw-label class="w-12 aw-reports-relationProp" prop="data.customCriteriaValue"></aw-label>
                </div>
            </div>
        </div>
        <div class="sw-row aw-reports-criteriaLabelsContainer" exist-when="conditions.itemReport" >
            <div class="aw-reports-reportTypeLabel">
                <aw-property-label prop="data.criteria"></aw-property-label>
            </div>
            <aw-label class="aw-reports-reportNoCriteriaContainer" exist-when="data.criteriaChips.length===0" prop="data.criteriaValue"></aw-label>
            <aw-chip-list class="aw-reports-reportCriteriaContainer" enable-when="conditions.notPreviewed" exist-when="data.criteriaChips.length>0"  button-type="chromeless" dataprovider="data.dataProviders.criteriaChipDataProvider"></aw-chip-list>
            <aw-command-bar anchor="createItemReportTemplateTaskBar1" alignment="HORIZONTAL" context="subPanelContext"></aw-command-bar>
            <aw-separator is-vertical="true" exist-when="props.subPanelContext.reportsState.rootClassSampleObject.length>0"></aw-separator>
            <aw-property-label class="sw-row aw-reports-relationProp" exist-when="conditions.segmentsAvailable" prop="data.relations"></aw-property-label>
            <aw-popup-wrapper popup="openSegmentPopup">
                <aw-chip-list exist-when="conditions.segmentsAvailable" class="aw-reports-reportCriteriaContainer" button-type="chromeless" dataprovider="data.dataProviders.segmentChipDataProvider" action="openSegmentPopup"></aw-chip-list>
            </aw-popup-wrapper>
            <aw-command-bar anchor="createItemReportTemplateTaskBar2" alignment="HORIZONTAL" context="subPanelContext"></aw-command-bar>
        </div>
    </div>
    <aw-command-bar class="justify-right flex-auto" overflow="true" anchor="createTemplateTaskBar" alignment="HORIZONTAL" context="subPanelContext"></aw-command-bar>
    <aw-separator is-vertical="true"></aw-separator>
    <aw-command-bar class="aw-layout-headerRight" anchor="toolbarRightSlot" alignment="HORIZONTAL"></aw-command-bar>
</div>
