<aw-configure-report-viewer exist-when="conditions.nullSearchCriteria && ctx.dashboardObjects" reports-state="subPanelContext.provider.reportsState" sub-panel-context="{...subPanelContext}"></aw-configure-report-viewer>
<aw-empty-workarea
    exist-when="!conditions.nullSearchCriteria"
    image="graEmptyReportFaded128"
    title="{{conditions.summaryReport ? i18n.noChartData : i18n.noItemAvailable}}"
    hint="{{conditions.summaryReport ? i18n.searchDataContext : i18n.searchItemContext}}"
    command-id="{{conditions.summaryReport ? 'Rb0ConfigureSearch' : 'Rb0ConfigureItemSearch'}}"
    link-text="{{conditions.summaryReport ? i18n.dataTabName : i18n.searchItem}}"
    link-visibility="true" command-context="{reportsState: props.subPanelContext.provider.reportsState}">
</aw-empty-workarea>
