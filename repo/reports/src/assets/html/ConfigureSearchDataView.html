<aw-panel exist-when="ctx.state.params.reportType !== '1'">
    <aw-panel-body class="aw-reports-searchItem">
        <search-data-tab-page sub-panel-context='{searchState: fields.searchState, selectionData: fields.selectionData}'></search-data-tab-page>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button exist-when="conditions.isSummaryReport" enable-when="conditions.enableSaveButton" action="saveConfiguredSearchAction" size="auto" button-type="base">
            <aw-i18n>i18n.preview</aw-i18n>
        </aw-button>
        <aw-button action="saveCriteriaAndClose" exist-when="conditions.isSummaryReport" enable-when="conditions.enableSaveButton" size="auto">
            <aw-i18n>i18n.saveReport</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel>
<aw-panel exist-when="ctx.state.params.reportType === '1'">
    <aw-panel-body class="aw-reports-searchItem">
        <search-tab-page-sub sub-panel-context="{searchFilterTabModels: data.searchFilterTabModels.dbValue,addPanelState: data.addPanelState, typeFilter: data.typeFilter.dbValue, selectionMode: data.selectionMode}">
        </search-tab-page-sub>
    </aw-panel-body>
    <aw-panel-footer>
        <aw-button action="changeSourceObjConfirmation" enable-when="conditions.enableSaveButton" size="auto">
            <aw-i18n>i18n.select</aw-i18n>
        </aw-button>
    </aw-panel-footer>
</aw-panel>
