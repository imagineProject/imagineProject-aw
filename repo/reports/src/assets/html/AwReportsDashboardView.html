<aw-scrollpanel class="aw-reports-dashboardTileContent">
    <aw-empty-workarea exist-when="data.totalFound === 0"
        image="graEmptyReport128"
        title="i18n.noReports"
        hint="i18n.reportsDashboardHint"
        action="actions.addReport"
        link-visibility="true"
        link-text="i18n.addDashboardReportWithPanelTitle">
    </aw-empty-workarea>
    <aw-list class="aw-reports-dashboardTileList justify-center" exist-when="data.totalFound>0" dataprovider="data.dataProviders.imageDataProvider" loading-style="sw-imageCell-skeleton">
        <aw-layout-slot name="reportDashboardTile" context="{selectedReport:item, ...subPanelContext}"></aw-layout-slot>
    </aw-list>
</aw-scrollpanel>
