<aw-sublocation class="aw-reports-workAreaCommandBar" sub-panel-context="{provider:data._provider,reportsState:data.reportsState}" sub-location-preference="data._provider.awSubLocationPref">
    <div class="sw-row h-12 afx-content-background">
        <div class="sw-column w-12">
            <aw-standard-sublocation sub-panel-context="{...subPanelContext, reportsState:data.reportsState}"
                provider="data._provider" search-state="data.searchState"
                base-selection="ctx.modelObjectsToOpen[0]" selection-model="selectionModels.reportPageSelectionModel"
                selection-data="data.selectionData">
                {props.children}
            </aw-standard-sublocation>
        </div>
    </div>
</aw-sublocation>
