<aw-panel-header exist-when="!data.searchState.isParentProjectTemplate">
    <div aw-class="[{ 'sw-row': conditions.nonMobileMode }]">
        <div aw-class="[{ 'w-12': conditions.nonMobileMode }]">
            <aw-radiobutton class="sw-column" prop="data.queryType" list="data.queryTypeValues.dbValue" exist-when="conditions.showQueryOptions"></aw-radiobutton>
            <aw-widget prop="data.queryTypeLOVProp"></aw-widget>
        </div>
    </div>
    <aw-togglebutton prop="data.preferredSearch" visible-when="conditions.showAdvancedSearchButton && conditions.showPreferredToggle" action="togglePreferred"></aw-togglebutton>
</aw-panel-header>
<!-- Advanced Search Panel View without Results Section -->
<aw-panel-body exist-when="conditions.isMobileMode">
    <aw-panel-section visible-when="conditions.showAdvancedSearchAttributes" class="aw-attributes-section">
        <aw-advanced-search-attributes attributes="fields.awp0AdvancedQueryAttributes" call-back-action="clearAll" enter-key-action="doAdvancedSearch"></aw-advanced-search-attributes>
    </aw-panel-section>
</aw-panel-body>
<aw-panel-footer>
    <aw-button exist-when="conditions.isSummaryReport" action="saveConfiguredSearchActionBatchJob" size="auto" button-type="base">
        <aw-i18n>i18n.preview</aw-i18n>
    </aw-button>
    <aw-button action="saveCriteriaAndClose" exist-when="conditions.isSummaryReport" enable-when="conditions.totalFoundAvailable" size="auto">
        <aw-i18n>i18n.saveReport</aw-i18n>
    </aw-button>
    <div exist-when="!conditions.isSummaryReport">
        <aw-button action="changeSourceObjConfirmation" enable-when="conditions.enableSaveButton" size="auto">
            <aw-i18n>i18n.select</aw-i18n>
        </aw-button>
    </div>
</aw-panel-footer>
