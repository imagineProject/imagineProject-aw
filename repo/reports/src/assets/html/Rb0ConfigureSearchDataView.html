<aw-command-panel caption="{{ctx.state.params.reportType === '1' ? i18n.itemTabName : i18n.dataTabName}}" context="subPanelContext">
    <aw-tab-set exist-when="data.tabsModel.dbValue && ctx.state.params.reportType !== '1'" tabs="data.tabsModel.dbValue" >
    </aw-tab-set>
    <aw-command-sub-panel exist-when="data.selectedTab.tabKey=='awKeywordSearch' || ctx.state.params.reportType === '1'" panel-id="ConfigureSearchData" sub-panel-context="{...subPanelContext, reportsState: {...subPanelContext.reportsState, ...subPanelContext.reportsState.getValue()}}"></aw-command-sub-panel>
    <aw-command-sub-panel exist-when="data.selectedTab.tabKey=='awAdvancedSearch' && ctx.state.params.reportType !== '1'" panel-id="ConfigureAdvancedSearch" sub-panel-context="{...subPanelContext, reportsState: {...subPanelContext.reportsState, ...subPanelContext.reportsState.getValue()}}"></aw-command-sub-panel>
    <aw-command-sub-panel exist-when="data.selectedTab.tabKey=='awCustomSearch' && ctx.state.params.reportType !== '1'" panel-id="ConfigureCustomSearch" sub-panel-context="{...subPanelContext, reportsState: {...subPanelContext.reportsState, ...subPanelContext.reportsState.getValue()}}"></aw-command-sub-panel>
</aw-command-panel>
